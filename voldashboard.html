    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxG5qf6mb8E_-b2TeXlRNseMZ26L9DRYg",
            authDomain: "trendscores-df341.firebaseapp.com",
            projectId: "trendscores-df341",
            databaseURL: "https://trendscores-df341-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app);

        let allData = [];

        async function init() {
            try {
                const getVolatilityData = httpsCallable(functions, 'getVolatilityData');
                const result = await getVolatilityData();
                allData = calculateAdvancedMetrics(result.data); // Process data

                document.getElementById('loading').style.display = 'none';
                renderView();
            } catch (error) {
                console.error("Error fetching volatility data:", error);
                document.getElementById('loading').textContent = "Error loading data. Check console.";
            }
        }

        let currentView = 'map'; // map | scatter | table
        let colorMode = 'abs';   // abs | pctl

        function calculateAdvancedMetrics(data) {
            return data.map(item => {
                if (!item.history || item.history.length === 0) return item;

                // 1. Percentile Rank (vs last 252 days - ~1 year)
                const histVals = item.history.slice(-252).map(h => h.value).sort((a, b) => a - b);
                const rank = histVals.filter(v => v <= item.currentRv).length;
                const percentile = (rank / histVals.length) * 100;

                // 2. Vol Regime (Fast vs Slow)
                // Fast = 5d avg, Slow = 60d avg
                const last5 = item.history.slice(-5);
                const last60 = item.history.slice(-60);
                const avg = arr => arr.reduce((a, b) => a + b.value, 0) / arr.length;

                const fastVol = avg(last5);
                const slowVol = avg(last60);
                const volRegime = (fastVol > slowVol) ? 'Inverted' : 'Normal';

                return { ...item, percentile, volRegime, fastVol, slowVol };
            });
        }

        // --- View & Color State Management ---
        window.setView = function (v) {
            currentView = v;
            document.getElementById('btn-map').className = v === 'map' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            document.getElementById('btn-scatter').className = v === 'scatter' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            document.getElementById('btn-table').className = v === 'table' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            renderView();
        }

        window.setColorMode = function (m) {
            colorMode = m;
            document.getElementById('btn-abs').className = m === 'abs' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            document.getElementById('btn-pctl').className = m === 'pctl' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            renderView();
        }

        function renderView() {
            const container = document.getElementById('content-container');
            // Clear content
            d3.select("#content-container svg").remove();

            if (currentView === 'map') {
                drawMap();
                document.getElementById('legend-container').style.display = 'block';
            } else if (currentView === 'scatter') {
                drawScatter();
                document.getElementById('legend-container').style.display = 'none';
            } else {
                drawTable();
                document.getElementById('legend-container').style.display = 'none';
            }
        }

        function drawMap() {
            const container = document.getElementById('content-container');
            container.innerHTML = ''; // Clear previous view (e.g. table)
            const width = container.clientWidth;
            const isMobile = window.innerWidth < 768;
            const height = isMobile ? 1400 : container.clientHeight || 800; // Fallback height

            if (isMobile) container.style.height = (height + 150) + 'px';
            // else container.style.height = '100%'; // Handled by flexbox usually

            const root = d3.hierarchy({ name: "Market", children: Array.from(d3.group(allData, d => d.sector), ([key, value]) => ({ name: key, children: value })) })
                .sum(d => 1)
                .sort((a, b) => b.value - a.value);

            d3.treemap()
                .size([width, height])
                .paddingInner(isMobile ? 2 : 4) // Tight gap on mobile
                .paddingOuter(isMobile ? 2 : 6)
                .paddingTop(isMobile ? 20 : 28) // Title bar
                .round(true)(root);

            const svg = d3.select("#content-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .style("font-family", "Inter, sans-serif");

            const cell = svg.selectAll("g")
                .data(root.leaves())
                .join("g")
                .attr("transform", d => `translate(${d.x0},${d.y0})`);

            cell.append("rect")
                .attr("width", d => d.x1 - d.x0)
                .attr("height", d => d.y1 - d.y0)
                .attr("rx", 6) // Rounded corners
                .attr("ry", 6)
                .attr("fill", d => getColor(d.data))
                .attr("class", "node")
                .on("mouseover", (e, d) => showTooltip(e, d.data))
                .on("mousemove", moveTooltip)
                .on("mouseout", hideTooltip)
                .on("click", (e, d) => openChartModal(d.data));

            cell.append("text")
                .attr("class", "node-label")
                .attr("x", 6) // Slightly more padding
                .attr("y", 16)
                .text(d => (d.x1 - d.x0 > 30) ? d.data.ticker : "")
                .attr("font-weight", 700) // Bold
                .attr("font-size", d => Math.min(14, (d.x1 - d.x0) / 4) + "px");

            svg.selectAll("text.sector-title")
                .data(root.descendants().filter(d => d.depth === 1))
                .join("text")
                .attr("class", "sector-title")
                .attr("x", d => d.x0 + 4)
                .attr("y", d => d.y0 + 16)
                .text(d => d.data.name.toUpperCase())
                .attr("fill", "#8b949e")
                .attr("font-size", "10px")
                .attr("font-weight", "bold")
                .style("pointer-events", "none");
        }

        function drawScatter() {
            const container = document.getElementById('content-container');
            container.innerHTML = ''; // Clear previous view
            const width = container.clientWidth;
            const height = container.clientHeight || 800;
            const margin = { top: 60, right: 60, bottom: 60, left: 60 };

            const svg = d3.select("#content-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .style("font-family", "Inter, sans-serif");

            // --- DEFS: Gradients and Filters for Premium Look ---
            const defs = svg.append("defs");

            // 1. Glow Filter
            const filter = defs.append("filter")
                .attr("id", "glow")
                .attr("x", "-50%")
                .attr("y", "-50%")
                .attr("width", "200%")
                .attr("height", "200%");
            filter.append("feGaussianBlur")
                .attr("stdDeviation", "2.5")
                .attr("result", "coloredBlur");
            const merge = filter.append("feMerge");
            merge.append("feMergeNode").attr("in", "coloredBlur");
            merge.append("feMergeNode").attr("in", "SourceGraphic");

            // 2. Gems Spotlight (Green Radial)
            const gemGrad = defs.append("radialGradient")
                .attr("id", "gemGradient")
                .attr("cx", "0%")
                .attr("cy", "0%")
                .attr("r", "80%");
            gemGrad.append("stop").attr("offset", "0%").attr("stop-color", "#1a2d21").attr("stop-opacity", 0.6); // Center
            gemGrad.append("stop").attr("offset", "100%").attr("stop-color", "#0d1117").attr("stop-opacity", 0); // Fade

            // 3. Danger Spotlight (Red Radial)
            const dangerGrad = defs.append("radialGradient")
                .attr("id", "dangerGradient")
                .attr("cx", "100%")
                .attr("cy", "100%") // Bottom Right
                .attr("r", "80%");
            dangerGrad.append("stop").attr("offset", "0%").attr("stop-color", "#3b1219").attr("stop-opacity", 0.6);
            dangerGrad.append("stop").attr("offset", "100%").attr("stop-color", "#0d1117").attr("stop-opacity", 0);

            // --- Scales ---
            const xVal = d => d.currentRv;
            const yVal = d => d.trendScore || 0;

            const xMax = d3.max(allData, xVal) * 1.1;
            const yMin = d3.min(allData, yVal) - 4;
            const yMax = d3.max(allData, yVal) + 4;

            const x = d3.scaleLinear().domain([0, xMax]).range([margin.left, width - margin.right]);
            const y = d3.scaleLinear().domain([yMin, yMax]).range([height - margin.bottom, margin.top]);

            // --- Background Zones (Spotlights) ---
            const statsX = d3.median(allData, xVal);

            // Top Left (Gems)
            svg.append("rect")
                .attr("x", 0)
                .attr("y", 0)
                .attr("width", x(statsX))
                .attr("height", y(0))
                .attr("fill", "url(#gemGradient)")
                .style("pointer-events", "none");

            svg.append("text")
                .attr("x", margin.left)
                .attr("y", margin.top - 10)
                .text("GEMS ZONE")
                .attr("fill", "#3fb950")
                .attr("opacity", 0.8)
                .attr("font-size", "10px")
                .attr("font-weight", "bold")
                .attr("letter-spacing", "0.1em");

            // Bottom Right (Danger)
            svg.append("rect")
                .attr("x", x(statsX))
                .attr("y", y(0))
                .attr("width", width - x(statsX))
                .attr("height", height - y(0))
                .attr("fill", "url(#dangerGradient)")
                .style("pointer-events", "none");

            // --- Grid ---
            const xAxis = d3.axisBottom(x).ticks(8).tickSize(-height + margin.top + margin.bottom).tickFormat("");
            const yAxis = d3.axisLeft(y).ticks(8).tickSize(-width + margin.left + margin.right).tickFormat("");

            svg.append("g")
                .attr("class", "grid")
                .attr("transform", `translate(0,${height - margin.bottom})`)
                .call(xAxis)
                .style("stroke-opacity", 0.05)
                .style("stroke-dasharray", "4,4")
                .select(".domain").remove();

            svg.append("g")
                .attr("class", "grid")
                .attr("transform", `translate(${margin.left},0)`)
                .call(yAxis)
                .style("stroke-opacity", 0.05)
                .style("stroke-dasharray", "4,4")
                .select(".domain").remove();

            // Zero Line (Trend = 0)
            svg.append("line")
                .attr("x1", margin.left)
                .attr("x2", width - margin.right)
                .attr("y1", y(0))
                .attr("y2", y(0))
                .attr("stroke", "#ffffff")
                .attr("stroke-width", 1)
                .attr("stroke-opacity", 0.1);

            // --- Dots ---
            // Render logic with Glow for gems
            const dots = svg.append("g")
                .selectAll("circle")
                .data(allData)
                .join("circle")
                .attr("cx", d => x(xVal(d)))
                .attr("cy", d => y(yVal(d)))
                .attr("r", 5)
                .attr("fill", d => getColor(d))
                .attr("class", "cursor-pointer transition-all duration-300")
                .attr("stroke", "#0d1117")
                .attr("stroke-width", 1.5)
                .attr("opacity", 0.9)
                .style("filter", d => (xVal(d) < statsX && yVal(d) > 2) ? "url(#glow)" : "none");

            // --- Crosshairs (Hidden by default) ---
            const crosshairG = svg.append("g").style("display", "none");
            const chX = crosshairG.append("line").attr("stroke", "#8b949e").attr("stroke-dasharray", "3,3").attr("stroke-opacity", 0.5);
            const chY = crosshairG.append("line").attr("stroke", "#8b949e").attr("stroke-dasharray", "3,3").attr("stroke-opacity", 0.5);
            const chLabel = crosshairG.append("text").attr("fill", "#c9d1d9").attr("font-size", "10px").attr("font-family", "monospace");

            // Interaction Overlay
            svg.append("rect")
                .attr("class", "overlay")
                .attr("width", width)
                .attr("height", height)
                .style("opacity", 0)
                .on("mouseover", () => crosshairG.style("display", null))
                .on("mouseout", () => {
                    crosshairG.style("display", "none");
                    hideTooltip();
                    dots.attr("r", 5).attr("stroke", "#0d1117"); // Reset dot size/stroke
                })
                .on("mousemove", function (event) {
                    const [mx, my] = d3.pointer(event);
                    // Update Crosshairs
                    chX.attr("x1", mx).attr("x2", mx).attr("y1", margin.top).attr("y2", height - margin.bottom);
                    chY.attr("x1", margin.left).attr("x2", width - margin.right).attr("y1", my).attr("y2", my);

                    // Find nearest dot for tooltip
                    // Simple distance check
                    let minDist = 20; // Hit radius
                    let nearest = null;
                    allData.forEach(d => {
                        const dx = x(xVal(d)) - mx;
                        const dy = y(yVal(d)) - my;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < minDist) {
                            minDist = dist;
                            nearest = d;
                        }
                    });

                    if (nearest) {
                        showTooltip(event, nearest);
                        // Highlight dot
                        dots.attr("r", d => d === nearest ? 8 : 5).attr("stroke", d => d === nearest ? "#fff" : "#0d1117");
                    } else {
                        hideTooltip();
                        dots.attr("r", 5).attr("stroke", "#0d1117");
                    }
                })
                .on("click", function (event) {
                    const [mx, my] = d3.pointer(event);
                    // Find click target
                    let minDist = 20;
                    let nearest = null;
                    allData.forEach(d => {
                        const dx = x(xVal(d)) - mx;
                        const dy = y(yVal(d)) - my;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < minDist) {
                            minDist = dist;
                            nearest = d;
                        }
                    });
                    if (nearest) openChartModalWithId(nearest.ticker);
                });


            // --- Axes Rendering ---
            const xAxisReal = d3.axisBottom(x).ticks(5);
            const yAxisReal = d3.axisLeft(y).ticks(5);

            svg.append("g")
                .attr("transform", `translate(0,${height - margin.bottom})`)
                .call(xAxisReal)
                .attr("color", "#8b949e")
                .style("font-size", "10px")
                .call(g => g.select(".domain").attr("stroke", "#30363d"))
                .call(g => g.selectAll(".tick line").attr("stroke", "#30363d"));

            svg.append("text")
                .attr("x", width / 2)
                .attr("y", height - 20)
                .attr("fill", "#8b949e")
                .attr("font-size", "11px")
                .attr("text-anchor", "middle")
                .text("Volatility (Risk)");

            svg.append("g")
                .attr("transform", `translate(${margin.left},0)`)
                .call(yAxisReal)
                .attr("color", "#8b949e")
                .style("font-size", "10px")
                .call(g => g.select(".domain").attr("stroke", "#30363d"))
                .call(g => g.selectAll(".tick line").attr("stroke", "#30363d"));

            svg.append("text")
                .attr("transform", "rotate(-90)")
                .attr("x", -height / 2)
                .attr("y", 20)
                .attr("fill", "#8b949e")
                .attr("font-size", "11px")
                .attr("text-anchor", "middle")
                .text("Trend Score (Reward)");

            // --- Smart Labels (Gems) ---
            // 1. Filter for Gems (Top Left) with decent trend
            const gems = allData
                .filter(d => xVal(d) < statsX && yVal(d) > 2)
                .sort((a, b) => yVal(b) - yVal(a)); // Priority to higher trend

            const placedLabels = [];
            const labelPadding = 4; // Space around text
            const dotRadius = 5;

            svg.append("g")
                .selectAll("text")
                .data(gems)
                .join("text")
                .attr("fill", "#c9d1d9")
                .attr("font-size", "10px")
                .attr("font-family", "Inter, sans-serif")
                .attr("font-weight", "600")
                .style("pointer-events", "none")
                .style("filter", "drop-shadow(0px 1px 2px rgba(0,0,0,0.8))")
                .each(function (d) {
                    const el = d3.select(this);
                    const labelW = 30; // approx width guess (since we can't measure before render easily without appending)
                    // Actually let's use a rough char width estimation or pre-measure content
                    const estimatedW = d.ticker.length * 7;
                    const labelH = 10;

                    const ox = x(xVal(d));
                    const oy = y(yVal(d));

                    // Potential positions [dx, dy, anchor]
                    const positions = [
                        { dx: dotRadius + 4, dy: 4, anchor: "start" },   // Right
                        { dx: 0, dy: -dotRadius - 4, anchor: "middle" }, // Top
                        { dx: 0, dy: dotRadius + 12, anchor: "middle" }, // Bottom
                        { dx: -dotRadius - 4, dy: 4, anchor: "end" }     // Left
                    ];

                    let bestPos = null;

                    for (const pos of positions) {
                        // Calculate bounding box for this position
                        let bx = ox + pos.dx;
                        let by = oy + pos.dy - labelH; // y is baseline, so box starts higher

                        // Adjust box x based on anchor
                        if (pos.anchor === "middle") bx -= estimatedW / 2;
                        if (pos.anchor === "end") bx -= estimatedW;

                        // Check collision with all previously placed labels
                        const isOverlap = placedLabels.some(box => {
                            return !(bx + estimatedW + labelPadding < box.x ||
                                bx > box.x + box.w + labelPadding ||
                                by + labelH + labelPadding < box.y ||
                                by > box.y + box.h + labelPadding);
                        });

                        if (!isOverlap) {
                            // Check bounds (don't draw off canvas)
                            if (bx > 0 && bx + estimatedW < width && by > 0 && by + labelH < height) {
                                bestPos = pos;
                                placedLabels.push({ x: bx, y: by, w: estimatedW, h: labelH });
                                break;
                            }
                        }
                    }

                    if (bestPos) {
                        el.attr("x", ox + bestPos.dx)
                            .attr("y", oy + bestPos.dy)
                            .attr("text-anchor", bestPos.anchor)
                            .text(d.ticker)
                            .attr("opacity", 0.9);
                    } else {
                        el.remove(); // Don't draw if no space
                    }
                });
        }

        function drawTable() {

                let regimeBadge = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-[#161b22] text-[#c9d1d9] border border-[#30363d]">

                    <span class="w-1.5 h-1.5 rounded-full bg-[#ff7b72]"></span>Stress
                </span>`;
                else if (isCalm) regimeBadge = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-[#1a2d21] text-[#3fb950] border border-[#2ea043]/30">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#3fb950]"></span>Calm

                if (d.volRegime === 'Inverted' && d.percentile < 50) {

                        <span class="w-1.5 h-1.5 rounded-full bg-[#d2a8ff]"></span>Post-Stress
                    </span>`;

                if (trend > 2) signalBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#1a2d21] text-[#3fb950] border border-[#2ea043]/30">LONG</span>`;
                else if (trend < -2) signalBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#3b1219] text-[#ff7b72] border border-[#82071e]/30">SHORT</span>`;

        // Helper to find data object by ticker for onClick
        window.openChartModalWithId = function (ticker) {
            const d = allData.find(item => item.ticker === ticker);
            if (d) openChartModal(d);
        }
        function getColor(d) {
            // Helper to determine color based on Mode
            if (colorMode === 'pctl') {
                // Percentile Heatmap
                // High Percentile (90+) = Red (Stressed)
                // Low Percentile (10-) = Green (Calm)
                const p = d.percentile;
                if (p >= 90) return "#ef4444"; // Strong Stressed (Red-500)
                if (p >= 75) return "#f87171"; // Stressed (Red-400)
                if (p <= 10) return "#4ade80"; // Strong Calm (Green-400)
                if (p <= 25) return "#86efac"; // Calm (Green-300)
                return "#374151"; // Normal/Dark Grey
            } else {
                // Absolute Vol (Legacy) - Updated to match Percentile Palette
                const rv = d.currentRv;
                if (rv >= 0.60) return "#ef4444"; // Strong Stressed (Red-500)
                if (rv >= 0.40) return "#f87171"; // Stressed (Red-400)
                if (rv <= 0.15) return "#4ade80"; // Strong Calm (Green-400)
                if (rv <= 0.25) return "#86efac"; // Calm (Green-300)
                return "#374151"; // Normal/Dark Grey
            }
        }

        function showTooltip(e, d) {

            `;
            moveTooltip(e);
        }

        function moveTooltip(e) {
            const el = document.getElementById('tooltip');
            const tooltipWidth = el.offsetWidth;
            const windowWidth = window.innerWidth;
            let left = e.pageX + 10;
            if ((e.clientX + 10 + tooltipWidth) > (windowWidth - 10)) {
                left = e.pageX - tooltipWidth - 10;
            }
            el.style.left = left + 'px';
            el.style.top = (e.pageY + 10) + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }

                        <div class="flex flex-col gap-0.5 text-xs font-mono text-[#c9d1d9]">
                             <div class="flex justify-between w-24"><span class="text-[#8b949e]">Fast:</span> <span>${fast}</span></div>
                             <div class="flex justify-between w-24"><span class="text-[#8b949e]">Slow:</span> <span>${slow}</span></div>
                             <span class="text-[10px] font-bold mt-1 px-1.5 py-0.5 rounded-full w-max uppercase" style="color:${c}; border:1px solid ${c}40">${d.volRegime || 'Normal'}</span>
                        </div>
                    `;
                };
                const tsDiv = `
                     <div class="flex flex-col gap-1">
                        <span class="font-sans text-[11px] font-semibold tracking-wider text-[#8b949e] uppercase">Term Structure</span>
                        <div class="flex flex-col gap-3 mt-2">
                             ${decorate(getTSHTML(d1), '#c586c0')}
                             ${d2 ? decorate(getTSHTML(d2), '#9cdcfe') : ''}
                        </div>
                    </div>
                `;

                statsDiv.innerHTML = volDiv + rankDiv + trendDiv + tsDiv;
                hStart.parentNode.insertBefore(statsDiv, hStart.nextSibling);
            }

            renderStats(data);

            document.getElementById('modal-ticker').textContent = data.ticker;
            document.getElementById('modal-sector').textContent = data.sector;

            // --- Comparison Dropdown Injection ---
            // Remove existing comparison controls if any
            const existingComp = document.getElementById('compare-controls');
            if (existingComp) existingComp.remove();

            const compDiv = document.createElement('div');
            compDiv.id = 'compare-controls';
            compDiv.className = "absolute top-6 right-16 flex items-center";

            // Populate select options
            const tickers = allData.map(d => d.ticker).sort();
            let options = `<option value="">Compare vs...</option>`;
            tickers.forEach(t => {
                if (t !== data.ticker) options += `<option value="${t}">${t}</option>`;
            });

            compDiv.innerHTML = `
                <select id="compare-select" class="bg-[#0d1117] text-[#c9d1d9] text-xs border border-[#30363d] rounded px-2 py-1 outline-none focus:border-[#58a6ff]">
                    ${options}
                </select>
            `;

            // Insert into modal header area (absolute positioned)
            // chart-modal div is relative so this works
            modal.children[0].appendChild(compDiv);

            // Event Listener
            document.getElementById('compare-select').addEventListener('change', (e) => {
                const targetTicker = e.target.value;
                if (targetTicker) {
                    const targetData = allData.find(d => d.ticker === targetTicker);
                    if (targetData) {
                        renderStats(data, targetData); // Update Stats FIRST
                        requestAnimationFrame(() => {
                            drawHistoryChart(data.history, targetData.history, targetTicker);
                        });
                    }
                } else {
                    renderStats(data); // Reset Stats FIRST
                    requestAnimationFrame(() => {
                        drawHistoryChart(data.history);
                    });
                }
            });

            drawHistoryChart(data.history);
        }

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('chart-modal').classList.add('hidden');
        });

        function drawHistoryChart(history, comparisonHistory = null, comparisonTicker = null) {
            const container = document.getElementById('chart-container');
            container.innerHTML = ''; // Clear previous

            if (!history || history.length === 0) {
                container.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-[#8b949e]">No Historical Data</div>';
                return;
            }

            const margin = { top: 20, right: 30, bottom: 30, left: 40 };
            const width = container.clientWidth - margin.left - margin.right;
            const height = container.clientHeight - margin.top - margin.bottom;

            const svg = d3.select("#chart-container")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // Parse Dates
            const parseTime = d3.timeParse("%m-%d-%Y");
            const process = (arr) => arr.map(d => ({
                date: (typeof d.date === 'string' ? parseTime(d.date) : d.date) || new Date(d.date),
                value: d.value
            }));

            const data1 = process(history);
            let combinedData = [...data1];
            let data2 = null;

            if (comparisonHistory) {
                data2 = process(comparisonHistory);
                combinedData = [...combinedData, ...data2];
            }

            // Scales
            const x = d3.scaleTime()
                .domain(d3.extent(combinedData, d => d.date))
                .range([0, width]);

            const y = d3.scaleLinear()
                .domain([0, d3.max(combinedData, d => d.value) * 1.1])
                .range([height, 0]);

            // Grid lines
            svg.append("g")
                .attr("class", "grid")
                .style("stroke-opacity", 0.1)
                .call(d3.axisLeft(y).tickSize(-width).tickFormat(""));

            // Axes
            svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .attr("class", "axis")
                .call(d3.axisBottom(x).ticks(5).tickSizeOuter(0));

            svg.append("g")
                .attr("class", "axis")
                .call(d3.axisLeft(y).ticks(5));

            // Line Generator
            const line = d3.line()
                .x(d => x(d.date))
                .y(d => y(d.value))
                .defined(d => !isNaN(d.value));

            // Draw Primary Line
            svg.append("path")
                .datum(data1)
                .attr("fill", "none")
                .attr("stroke", "#c586c0") // Purple
                .attr("stroke-width", 2)
                .attr("d", line);

            // Draw Secondary Line (if valid)
            if (data2) {
                svg.append("path")
                    .datum(data2)
                    .attr("fill", "none")
                    .attr("stroke", "#9cdcfe") // Cyan
                    .attr("stroke-width", 2)
                    .attr("stroke-dasharray", "4,4") // Optional styling shift
                    .attr("d", line);

                // Legend
                const legend = svg.append("g")
                    .attr("transform", `translate(10, 0)`);

                // Primary
                legend.append("line").attr("x1", 0).attr("x2", 15).attr("y1", 0).attr("y2", 0).attr("stroke", "#c586c0").attr("stroke-width", 2);
                legend.append("text").attr("x", 20).attr("y", 4).text(document.getElementById('modal-ticker').textContent).attr("fill", "#c586c0").attr("font-size", "10px");

                // Secondary
                legend.append("line").attr("x1", 0).attr("x2", 15).attr("y1", 15).attr("y2", 15).attr("stroke", "#9cdcfe").attr("stroke-width", 2).attr("stroke-dasharray", "4,4");
                legend.append("text").attr("x", 20).attr("y", 19).text(comparisonTicker).attr("fill", "#9cdcfe").attr("font-size", "10px");
            }
            // --- Interaction ---
            // --- Interaction ---
            const focus = svg.append("g")
                .attr("class", "focus")
                .style("display", "none");

            // Focus Circles (Fixed on the point)
            focus.append("circle")
                .attr("id", "focus-circle-1")
                .attr("r", 4)
                .attr("fill", "#c586c0")
                .attr("stroke", "#0d1117")
                .attr("stroke-width", 2);

            if (data2) {
                focus.append("circle")
                    .attr("id", "focus-circle-2")
                    .attr("r", 4)
                    .attr("fill", "#9cdcfe")
                    .attr("stroke", "#0d1117")
                    .attr("stroke-width", 2);
            }

            // Tooltip Content Group (Movable relative to focus)
            const tooltipG = focus.append("g").attr("class", "tooltip-content");

            // Text Label Background
            tooltipG.append("rect")
                .attr("class", "tooltip-bg")
                .attr("width", 140)
                .attr("height", 50)
                .attr("x", 10)
                .attr("y", -22)
                .attr("rx", 4)
                .attr("fill", "#161b22")
                .attr("stroke", "#30363d")
                .attr("opacity", 0.95); // Slightly higher opacity

            const focusText = tooltipG.append("text")
                .attr("x", 18)
                .attr("y", -2);

            // Overlay Rect
            svg.append("rect")
                .attr("class", "overlay")
                .attr("width", width)
                .attr("height", height)
                .style("fill", "transparent")
                .style("cursor", "crosshair")
                .on("mouseover", () => focus.style("display", null))
                .on("mouseout", () => focus.style("display", "none"))
                .on("mousemove", mousemove);

            const bisect = d3.bisector(d => d.date).left;

            function mousemove(event) {
                const x0 = x.invert(d3.pointer(event)[0]);

                // 1. Primary Data
                const i1 = bisect(data1, x0, 1);
                const d0_1 = data1[i1 - 1];
                const d1_1 = data1[i1];
                let d1 = null;
                if (d0_1 && d1_1) {
                    d1 = x0 - d0_1.date > d1_1.date - x0 ? d1_1 : d0_1;
                } else if (d0_1) {
                    d1 = d0_1;
                } else if (d1_1) {
                    d1 = d1_1;
                }

                if (d1) {
                    // Position Focus Group
                    const px = x(d1.date);
                    const py = y(d1.value);
                    focus.attr("transform", `translate(${px},${py})`);
                    focus.select("#focus-circle-1").attr("cy", 0);

                    // Smart Flip Logic
                    if (px > width - 160) {
                        tooltipG.attr("transform", "translate(-160, 0)"); // Flip Left
                    } else {
                        tooltipG.attr("transform", "translate(0, 0)"); // Normal Right
                    }

                    // Update Text
                    const dateStr = d3.timeFormat("%b %d, %Y")(d1.date);
                    focusText.html(null);
                    focusText.append("tspan").attr("x", 18).attr("dy", "0em").text(dateStr).attr("fill", "#8b949e").attr("font-size", "10px");
                    focusText.append("tspan").attr("x", 18).attr("dy", "1.2em").text(`${document.getElementById('modal-ticker').textContent}: ${d1.value.toFixed(4)}`).attr("fill", "#c586c0").attr("font-weight", "bold");

                    // 2. Secondary Data (if exists)
                    if (data2) {
                        const i2 = bisect(data2, x0, 1);
                        const d0_2 = data2[i2 - 1];
                        const d1_2 = data2[i2];
                        let d2 = null;
                        if (d0_2 && d1_2) {
                            d2 = x0 - d0_2.date > d1_2.date - x0 ? d1_2 : d0_2;
                        } else if (d0_2) d2 = d0_2;
                        else if (d1_2) d2 = d1_2;

                        if (d2) {
                            const y2 = y(d2.value) - y(d1.value); // Relative Y
                            focus.select("#focus-circle-2")
                                .attr("cx", x(d2.date) - x(d1.date))
                                .attr("cy", y2);

                            focusText.append("tspan").attr("x", 18).attr("dy", "1.2em").text(`${comparisonTicker}: ${d2.value.toFixed(4)}`).attr("fill", "#9cdcfe").attr("font-weight", "bold");

                            focus.select(".tooltip-bg").attr("height", 65);
                        }
                    } else {
                        focus.select(".tooltip-bg").attr("height", 50);
                    }
                }
            }

        }

        window.addEventListener('resize', () => {
            renderView();
        });

        init();
    </script>
</body>

</html>
