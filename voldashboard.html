        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-size: 12px;
            overflow-y: auto;
        }

        .node {
            cursor: pointer;
            stroke: #0d1117;
            stroke-width: 1px;
            transition: opacity 0.2s;
        }

        .node:hover {
            opacity: 0.8;
            stroke: #fff;
            stroke-width: 2px;
        }

        .node-label {
            pointer-events: none;
            font-weight: bold;
            fill: white;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .map-tooltip {
            position: absolute;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 100;

        }

        .axis path,
        .axis line {
            stroke: #30363d;
        }

        .axis text {
            fill: #8b949e;
        }

        .scatter-dot {
            transition: r 0.2s, stroke-width 0.2s;
            cursor: pointer;
        }

        .scatter-dot:hover {
            stroke: #fff;
            stroke-width: 2px;
            r: 6;
        }

        .signal-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .signal-sell-vol {

        }

        .signal-buy-vol {

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxG5qf6mb8E_-b2TeXlRNseMZ26L9DRYg",
            authDomain: "trendscores-df341.firebaseapp.com",
            projectId: "trendscores-df341",
            databaseURL: "https://trendscores-df341-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app);

        let allData = [];
        let summaryData = null;

        async function init() {
            try {
                const getVolatilityData = httpsCallable(functions, 'getVolatilityData', { timeout: 540000 });
                const result = await getVolatilityData();

                // Handle response structure
                if (result.data.data) {
                    allData = calculateAdvancedMetrics(result.data.data);
                    summaryData = result.data.summary;
                } else {
                    allData = calculateAdvancedMetrics(result.data);
                }

                // Hide loading indicator
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.style.display = 'none';

                // Update summary badge
                if (summaryData && summaryData.vrpMedian !== undefined) {
                    const badge = document.getElementById('summary-badge');
                    if (badge) {
                        badge.innerHTML = `💎 ${summaryData.sellVolCandidates || 0} SELL | 🔥 ${summaryData.buyVolCandidates || 0} BUY | Median VRP: ${(summaryData.vrpMedian * 100).toFixed(0)}%`;
                        badge.classList.remove('hidden');
                    }
                }

                // Show cache timestamp if available
                if (result.data.cached && result.data.summary?.lastUpdated) {
                    const cacheEl = document.getElementById('cache-time');
                    if (cacheEl) {
                        const updated = new Date(result.data.summary.lastUpdated);
                        const timeStr = updated.toLocaleString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            hour: 'numeric',
                            minute: '2-digit',
                            hour12: true
                        });
                        cacheEl.innerHTML = `📦 Cached: ${timeStr}`;
                        cacheEl.classList.remove('hidden');
                    }
                }

                renderView();
            } catch (error) {
                console.error("Error fetching volatility data:", error);
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.textContent = "Error loading data. Check console.";
            }
        }

        let currentView = 'map';
        let colorMode = 'abs';

        function calculateAdvancedMetrics(data) {
            return data.map(item => {
                // Use rvPctlHistory from cache as percentile
                const percentile = item.rvPctlHistory || 50;

                // Vol regime can't be calculated without history, default to Normal
                const volRegime = 'Normal';
                const fastVol = item.currentRv;
                const slowVol = item.currentRv;

                return { ...item, percentile, volRegime, fastVol, slowVol };
            });
        }

        window.setView = function (v) {
            currentView = v;
            document.getElementById('btn-map').className = v === 'map' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            document.getElementById('btn-scatter').className = v === 'scatter' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            document.getElementById('btn-table').className = v === 'table' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            renderView();
        }

        window.setColorMode = function (m) {
            colorMode = m;
            document.getElementById('btn-abs').className = m === 'abs' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            document.getElementById('btn-pctl').className = m === 'pctl' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            document.getElementById('btn-vrp').className = m === 'vrp' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";
            document.getElementById('btn-signal').className = m === 'signal' ? "px-2 py-0.5 text-[10px] rounded font-medium text-[#c9d1d9] bg-[#30363d]" : "px-2 py-0.5 text-[10px] rounded font-medium text-[#8b949e] hover:text-[#c9d1d9]";

            // Update legend
            const legendTitle = document.getElementById('legend-title');
            if (m === 'signal') {
                legendTitle.textContent = 'CROSS-SECTIONAL SIGNAL';
            } else if (m === 'vrp') {
                legendTitle.textContent = 'VOL RISK PREMIUM (IV/RV-1)';
            } else if (m === 'pctl') {
                legendTitle.textContent = 'RV PERCENTILE (vs History)';
            } else {
                legendTitle.textContent = 'REALIZED VOLATILITY (Current)';
            }

            renderView();
        }

        function renderView() {
            const container = document.getElementById('content-container');
            d3.select("#content-container svg").remove();

            if (currentView === 'map') {
                drawMap();
                document.getElementById('legend-container').style.display = 'block';
            } else if (currentView === 'scatter') {
                drawScatter();
                document.getElementById('legend-container').style.display = 'none';
            } else {
                drawTable();
                document.getElementById('legend-container').style.display = 'none';
            }
        }

        function getColor(d) {
            if (colorMode === 'signal') {
                const signal = d.crossSectional?.signal;
                if (signal === 'SELL_VOL') return "#10b981";
                if (signal === 'BUY_VOL') return "#f97316";
                if (signal === 'RICH') return "#0ea5e9";
                if (signal === 'CHEAP') return "#d946ef";
                return "#374151";
            } else if (colorMode === 'pctl') {
                const p = d.percentile;
                if (p >= 90) return "#ef4444";
                if (p >= 75) return "#f87171";
                if (p <= 10) return "#4ade80";
                if (p <= 25) return "#86efac";
                return "#374151";
            } else if (colorMode === 'vrp') {
                const v = d.vrp;
                if (v === undefined || v === null) return "#374151";
                if (v >= 0.20) return "#ef4444";
                if (v >= 0.05) return "#f87171";
                if (v <= -0.15) return "#4ade80";
                if (v <= -0.05) return "#86efac";
                return "#374151";
            } else {
                const rv = d.currentRv;
                if (rv >= 0.60) return "#ef4444";
                if (rv >= 0.40) return "#f87171";
                if (rv <= 0.15) return "#4ade80";
                if (rv <= 0.25) return "#86efac";
                return "#374151";
            }
        }

        function getSignalBadge(signal) {
            const classes = {
                'SELL_VOL': 'signal-sell-vol',
                'BUY_VOL': 'signal-buy-vol',
                'RICH': 'signal-rich',
                'CHEAP': 'signal-cheap',
                'NEUTRAL': 'signal-neutral'
            };
            const labels = {
                'SELL_VOL': '💎 SELL VOL',
                'BUY_VOL': '🔥 BUY VOL',
                'RICH': 'RICH',
                'CHEAP': 'CHEAP',
                'NEUTRAL': 'NEUTRAL'
            };
            return `<span class="signal-badge ${classes[signal] || 'signal-neutral'}">${labels[signal] || signal || '--'}</span>`;
        }

        function drawMap() {
            const container = document.getElementById('content-container');
            container.innerHTML = '';
            const width = container.clientWidth;
            const isMobile = window.innerWidth < 768;
            const height = isMobile ? 1400 : container.clientHeight || 800;

            if (isMobile) container.style.height = (height + 150) + 'px';

            const root = d3.hierarchy({ name: "Market", children: Array.from(d3.group(allData, d => d.sector), ([key, value]) => ({ name: key, children: value })) })
                .sum(d => 1)
                .sort((a, b) => b.value - a.value);

            d3.treemap()
                .size([width, height])
                .paddingInner(isMobile ? 2 : 4)
                .paddingOuter(isMobile ? 2 : 6)
                .paddingTop(isMobile ? 20 : 28)
                .round(true)(root);

            const svg = d3.select("#content-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .style("font-family", "Inter, sans-serif");

            const cell = svg.selectAll("g")
                .data(root.leaves())
                .join("g")
                .attr("transform", d => `translate(${d.x0},${d.y0})`);

            cell.append("rect")
                .attr("width", d => d.x1 - d.x0)
                .attr("height", d => d.y1 - d.y0)
                .attr("rx", 6)
                .attr("ry", 6)
                .attr("fill", d => getColor(d.data))
                .attr("class", "node")
                .on("mouseover", (e, d) => showTooltip(e, d.data))
                .on("mousemove", moveTooltip)
                .on("mouseout", hideTooltip)
                .on("click", (e, d) => openChartModal(d.data));

            cell.append("text")
                .attr("class", "node-label")
                .attr("x", 6)
                .attr("y", 16)
                .text(d => (d.x1 - d.x0 > 30) ? d.data.ticker : "")
                .attr("font-weight", 700)
                .attr("font-size", d => Math.min(14, (d.x1 - d.x0) / 4) + "px");

            svg.selectAll("text.sector-title")
                .data(root.descendants().filter(d => d.depth === 1))
                .join("text")
                .attr("class", "sector-title")
                .attr("x", d => d.x0 + 4)
                .attr("y", d => d.y0 + 16)
                .text(d => d.data.name.toUpperCase())
                .attr("fill", "#8b949e")
                .attr("font-size", "10px")
                .attr("font-weight", "bold")
                .style("pointer-events", "none");
        }

        function drawScatter() {
            // REAL Chart: VRP (Y) vs RV Percentile (X) - Moontower style
            const container = document.getElementById('content-container');
            container.innerHTML = '';
            const width = container.clientWidth;
            const height = container.clientHeight || 800;
            const margin = { top: 60, right: 60, bottom: 60, left: 70 };

            const svg = d3.select("#content-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .style("font-family", "Inter, sans-serif");

            // Defs for gradients
            const defs = svg.append("defs");

            // Gems zone gradient (top-left)
            const gemGrad = defs.append("radialGradient")
                .attr("id", "gemGradient")
                .attr("cx", "0%").attr("cy", "0%").attr("r", "80%");
            gemGrad.append("stop").attr("offset", "0%").attr("stop-color", "#065f46").attr("stop-opacity", 0.4);
            gemGrad.append("stop").attr("offset", "100%").attr("stop-color", "#0d1117").attr("stop-opacity", 0);

            // Danger zone gradient (bottom-right)
            const dangerGrad = defs.append("radialGradient")
                .attr("id", "dangerGradient")
                .attr("cx", "100%").attr("cy", "100%").attr("r", "80%");
            dangerGrad.append("stop").attr("offset", "0%").attr("stop-color", "#7c2d12").attr("stop-opacity", 0.4);
            dangerGrad.append("stop").attr("offset", "100%").attr("stop-color", "#0d1117").attr("stop-opacity", 0);

            // Filter data with VRP
            const plotData = allData.filter(d => d.vrp !== null && d.crossSectional);

            // Scales - X: RV Percentile (cross-sectional), Y: VRP
            const x = d3.scaleLinear()
                .domain([0, 100])
                .range([margin.left, width - margin.right]);

            const yExtent = d3.extent(plotData, d => d.vrp);
            const yPadding = (yExtent[1] - yExtent[0]) * 0.1;
            const y = d3.scaleLinear()
                .domain([Math.min(yExtent[0] - yPadding, -0.1), Math.max(yExtent[1] + yPadding, 0.5)])
                .range([height - margin.bottom, margin.top]);

            // Background zones
            // Gems zone (low RV pctl, high VRP)
            svg.append("rect")
                .attr("x", margin.left)
                .attr("y", margin.top)
                .attr("width", x(40) - margin.left)
                .attr("height", y(0) - margin.top)
                .attr("fill", "url(#gemGradient)");

            svg.append("text")
                .attr("x", margin.left + 10)
                .attr("y", margin.top + 20)
                .text("💎 GEMS ZONE")
                .attr("fill", "#10b981")
                .attr("font-size", "11px")
                .attr("font-weight", "bold");

            // Danger zone (high RV pctl, low VRP)
            svg.append("rect")
                .attr("x", x(60))
                .attr("y", y(0))
                .attr("width", width - margin.right - x(60))
                .attr("height", height - margin.bottom - y(0))
                .attr("fill", "url(#dangerGradient)");

            svg.append("text")
                .attr("x", width - margin.right - 100)
                .attr("y", height - margin.bottom - 10)
                .text("⚠️ CAUTION")
                .attr("fill", "#f97316")
                .attr("font-size", "11px")
                .attr("font-weight", "bold");

            // Grid
            svg.append("g")
                .attr("transform", `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(x).ticks(10).tickSize(-height + margin.top + margin.bottom).tickFormat(""))
                .style("stroke-opacity", 0.1);

            svg.append("g")
                .attr("transform", `translate(${margin.left},0)`)
                .call(d3.axisLeft(y).ticks(8).tickSize(-width + margin.left + margin.right).tickFormat(""))
                .style("stroke-opacity", 0.1);

            // Zero line for VRP
            svg.append("line")
                .attr("x1", margin.left)
                .attr("x2", width - margin.right)
                .attr("y1", y(0))
                .attr("y2", y(0))
                .attr("stroke", "#ffffff")
                .attr("stroke-width", 1)
                .attr("stroke-opacity", 0.3)
                .attr("stroke-dasharray", "4,4");

            // Dots
            const dots = svg.append("g")
                .selectAll("circle")
                .data(plotData)
                .join("circle")
                .attr("cx", d => x(d.crossSectional.rvPctlUniverse))
                .attr("cy", d => y(d.vrp))
                .attr("r", d => {
                    const signal = d.crossSectional?.signal;
                    return (signal === 'SELL_VOL' || signal === 'BUY_VOL') ? 7 : 5;
                })
                .attr("fill", d => getColor(d))
                .attr("stroke", "#0d1117")
                .attr("stroke-width", 1.5)
                .attr("opacity", 0.9)
                .attr("class", "scatter-dot")
                .on("mouseover", (e, d) => showTooltip(e, d))
                .on("mousemove", moveTooltip)
                .on("mouseout", hideTooltip)
                .on("click", (e, d) => openChartModal(d));

            // Labels for key signals
            const labelData = plotData.filter(d =>
                d.crossSectional?.signal === 'SELL_VOL' ||
                d.crossSectional?.signal === 'BUY_VOL'
            );

            svg.append("g")
                .selectAll("text")
                .data(labelData)
                .join("text")
                .attr("x", d => x(d.crossSectional.rvPctlUniverse) + 8)
                .attr("y", d => y(d.vrp) + 4)
                .text(d => d.ticker)
                .attr("fill", "#c9d1d9")
                .attr("font-size", "10px")
                .attr("font-weight", "600")
                .style("pointer-events", "none");

            // Axes
            svg.append("g")
                .attr("transform", `translate(0,${height - margin.bottom})`)
                .call(d3.axisBottom(x).ticks(10).tickFormat(d => d + '%'))
                .attr("color", "#8b949e");

            svg.append("text")
                .attr("x", width / 2)
                .attr("y", height - 15)
                .attr("fill", "#8b949e")
                .attr("font-size", "12px")
                .attr("text-anchor", "middle")
                .text("RV Percentile (Cross-Sectional) → Higher = More Volatile vs Peers");

            svg.append("g")
                .attr("transform", `translate(${margin.left},0)`)
                .call(d3.axisLeft(y).ticks(8).tickFormat(d => (d * 100).toFixed(0) + '%'))
                .attr("color", "#8b949e");

            svg.append("text")
                .attr("transform", "rotate(-90)")
                .attr("x", -height / 2)
                .attr("y", 20)
                .attr("fill", "#8b949e")
                .attr("font-size", "12px")
                .attr("text-anchor", "middle")
                .text("VRP (IV/RV - 1) → Higher = Options More Expensive");

            // Title
            svg.append("text")
                .attr("x", width / 2)
                .attr("y", 25)
                .attr("fill", "#c9d1d9")
                .attr("font-size", "14px")
                .attr("font-weight", "bold")
                .attr("text-anchor", "middle")
                .text("REAL Chart: VRP vs RV Percentile (Moontower Style)");
        }

        function drawTable() {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            const tableDiv = document.createElement('div');
            tableDiv.className = "w-full overflow-x-auto";

            let html = `
                <table class="w-full text-left text-sm text-[#c9d1d9]">
                    <thead class="text-xs uppercase bg-[#161b22] text-[#8b949e] sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th scope="col" class="px-4 py-3 font-semibold">Ticker</th>
                            <th scope="col" class="px-4 py-3 font-semibold">Signal</th>
                            <th scope="col" class="px-4 py-3 font-semibold">VRP</th>
                            <th scope="col" class="px-4 py-3 font-semibold">VRP Pctl</th>
                            <th scope="col" class="px-4 py-3 font-semibold">IV</th>
                            <th scope="col" class="px-4 py-3 font-semibold">RV</th>
                            <th scope="col" class="px-4 py-3 font-semibold">RV Pctl</th>
                            <th scope="col" class="px-4 py-3 font-semibold">Trend</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-[#21262d]">
            `;

            // Sort by signal strength (SELL_VOL and BUY_VOL first)
            const signalPriority = { 'SELL_VOL': 0, 'BUY_VOL': 1, 'RICH': 2, 'CHEAP': 3, 'NEUTRAL': 4 };
            const sortedData = [...allData]
                .filter(d => d.vrp !== null)
                .sort((a, b) => {
                    const aSig = signalPriority[a.crossSectional?.signal] ?? 5;
                    const bSig = signalPriority[b.crossSectional?.signal] ?? 5;
                    if (aSig !== bSig) return aSig - bSig;
                    return (b.crossSectional?.signalStrength || 0) - (a.crossSectional?.signalStrength || 0);
                });

            sortedData.forEach(d => {
                const cs = d.crossSectional || {};
                const vrpPct = d.vrp !== null ? (d.vrp * 100).toFixed(1) + '%' : '--';
                const vrpColor = d.vrp > 0.1 ? 'text-[#f87171]' : (d.vrp < -0.05 ? 'text-[#4ade80]' : 'text-[#c9d1d9]');

                const ivPct = d.impliedVol ? (d.impliedVol * 100).toFixed(1) + '%' : '--';
                const rvPct = d.currentRv ? (d.currentRv * 100).toFixed(1) + '%' : '--';

                const trend = d.trendScore || 0;
                const trendColor = trend > 2 ? 'text-[#4ade80]' : (trend < -2 ? 'text-[#f87171]' : 'text-[#8b949e]');
                const trendArrow = trend > 0 ? '▲' : (trend < 0 ? '▼' : '•');

                html += `
                    <tr class="hover:bg-[#161b22] cursor-pointer" onclick="openChartModalWithId('${d.ticker}')">
                        <td class="px-4 py-3">
                            <div class="font-bold text-[#c9d1d9]">${d.ticker}</div>
                            <div class="text-[10px] text-[#8b949e]">${d.sector}</div>
                        </td>
                        <td class="px-4 py-3">${getSignalBadge(cs.signal)}</td>
                        <td class="px-4 py-3 font-mono ${vrpColor}">${vrpPct}</td>
                        <td class="px-4 py-3">
                            <div class="flex items-center gap-2">
                                <span class="font-mono text-xs">${cs.vrpPctlUniverse || '--'}%</span>
                                <div class="w-16 h-1.5 bg-[#21262d] rounded-full overflow-hidden">
                                    <div class="h-full bg-[#c586c0] rounded-full" style="width: ${cs.vrpPctlUniverse || 0}%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-3 font-mono text-[#9cdcfe]">${ivPct}</td>
                        <td class="px-4 py-3 font-mono">${rvPct}</td>
                        <td class="px-4 py-3">
                            <div class="flex items-center gap-2">
                                <span class="font-mono text-xs">${cs.rvPctlUniverse || d.rvPctlHistory || '--'}%</span>
                                <div class="w-16 h-1.5 bg-[#21262d] rounded-full overflow-hidden">
                                    <div class="h-full bg-[#8b949e] rounded-full" style="width: ${cs.rvPctlUniverse || d.rvPctlHistory || 0}%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-3 font-mono ${trendColor}">${trendArrow} ${trend.toFixed(1)}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tableDiv.innerHTML = html;
            container.appendChild(tableDiv);
        }

        function showTooltip(e, d) {
            const el = document.getElementById('tooltip');
            el.style.display = 'block';

            const cs = d.crossSectional || {};
            const signalHtml = cs.signal ? getSignalBadge(cs.signal) : '';

            el.innerHTML = `
                <div class="font-bold text-[#c586c0] text-sm">${d.ticker}</div>
                <div class="text-[10px] text-[#8b949e] mb-2">${d.sector}</div>
                ${signalHtml ? `<div class="mb-2">${signalHtml}</div>` : ''}
                <div class="text-xs grid grid-cols-2 gap-x-3 gap-y-1">
                    <span class="text-[#8b949e]">IV (30d):</span> 
                    <span class="text-[#9cdcfe] font-mono">${d.impliedVol ? (d.impliedVol * 100).toFixed(1) + '%' : '--'}</span>
                    
                    <span class="text-[#8b949e]">RV (30d):</span> 
                    <span class="text-white font-mono">${(d.currentRv * 100).toFixed(1)}%</span>
                    
                    <span class="text-[#8b949e]">VRP:</span> 
                    <span class="${d.vrp > 0 ? 'text-[#f87171]' : 'text-[#4ade80]'} font-mono">${d.vrp !== null ? (d.vrp * 100).toFixed(1) + '%' : '--'}</span>
                    
                    <span class="text-[#8b949e]">VRP Pctl:</span> 
                    <span class="text-[#c586c0] font-mono">${cs.vrpPctlUniverse || '--'}%</span>
                    
                    <span class="text-[#8b949e]">RV Pctl:</span> 
                    <span class="text-white font-mono">${cs.rvPctlUniverse || '--'}%</span>
                    
                    <span class="text-[#8b949e]">vs Sector:</span> 
                    <span class="font-mono">${cs.vrpVsSector ? (cs.vrpVsSector > 0 ? '+' : '') + (cs.vrpVsSector * 100).toFixed(1) + '%' : '--'}</span>
                    
                    <span class="text-[#8b949e]">Trend:</span> 
                    <span class="${(d.trendScore || 0) > 0 ? 'text-[#4ade80]' : 'text-[#f87171]'} font-mono">${(d.trendScore || 0).toFixed(1)}</span>
                </div>
            `;
            moveTooltip(e);
        }

        function moveTooltip(e) {
            const el = document.getElementById('tooltip');
            const tooltipWidth = el.offsetWidth;
            const tooltipHeight = el.offsetHeight;
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            let left = e.clientX + 10;
            if (left + tooltipWidth > windowWidth - 10) {
                left = e.clientX - tooltipWidth - 10;
            }

            let top = e.clientY + 10;
            if (top + tooltipHeight > windowHeight - 10) {
                top = e.clientY - tooltipHeight - 10;
            }

            el.style.left = left + 'px';
            el.style.top = top + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }

        window.openChartModalWithId = function (ticker) {
            const d = allData.find(item => item.ticker === ticker);
            if (d) openChartModal(d);
        }

        async function openChartModal(data) {
            const modal = document.getElementById('chart-modal');
            modal.classList.remove('hidden');

            document.getElementById('modal-ticker').textContent = data.ticker;
            document.getElementById('modal-sector').textContent = data.sector;

            // Add cross-sectional stats
            const statsContainer = document.getElementById('modal-ticker').parentElement;
            const existingStats = document.getElementById('modal-cs-stats');
            if (existingStats) existingStats.remove();

            if (data.crossSectional) {
                const cs = data.crossSectional;
                const statsHtml = document.createElement('div');
                statsHtml.id = 'modal-cs-stats';
                statsHtml.className = 'mt-3 p-3 bg-[#0d1117] border border-[#21262d] rounded-lg';
                statsHtml.innerHTML = `
                    <div class="flex flex-wrap gap-4 items-center">
                        ${getSignalBadge(cs.signal)}
                        <div class="text-xs">
                            <span class="text-[#8b949e]">VRP:</span>
                            <span class="font-mono ${data.vrp > 0 ? 'text-[#f87171]' : 'text-[#4ade80]'}">${(data.vrp * 100).toFixed(1)}%</span>
                        </div>
                        <div class="text-xs">
                            <span class="text-[#8b949e]">VRP Pctl:</span>
                            <span class="font-mono text-[#c586c0]">${cs.vrpPctlUniverse}%</span>
                        </div>
                        <div class="text-xs">
                            <span class="text-[#8b949e]">vs Sector:</span>
                            <span class="font-mono">${cs.vrpVsSector > 0 ? '+' : ''}${(cs.vrpVsSector * 100).toFixed(1)}%</span>
                        </div>
                        <div class="text-xs">
                            <span class="text-[#8b949e]">Z-Score:</span>
                            <span class="font-mono">${cs.vrpZScore.toFixed(2)}</span>
                        </div>
                    </div>
                `;
                statsContainer.appendChild(statsHtml);
            }

            // Show loading state
            const chartContainer = document.getElementById('chart-container');
            chartContainer.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-[#8b949e]">Loading history...</div>';

            // Fetch history if not already loaded
            if (!data.history || data.history.length === 0) {
                try {
                    const getTickerHistory = httpsCallable(functions, 'getTickerHistory');
                    const result = await getTickerHistory({ ticker: data.ticker });
                    data.history = result.data.history;
                } catch (err) {
                    console.error('Error fetching history:', err);
                    data.history = [];
                }
            }

            drawHistoryChart(data.history);
        }

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('chart-modal').classList.add('hidden');
        });

        function drawHistoryChart(history) {
            const container = document.getElementById('chart-container');
            container.innerHTML = '';

            if (!history || history.length === 0) {
                container.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-[#8b949e]">No Historical Data</div>';
                return;
            }

            const margin = { top: 20, right: 30, bottom: 30, left: 50 };
            const width = container.clientWidth - margin.left - margin.right;
            const height = container.clientHeight - margin.top - margin.bottom;

            const svg = d3.select("#chart-container")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const parseTime = d3.timeParse("%m-%d-%Y");
            const data = history.map(d => ({
                date: (typeof d.date === 'string' ? parseTime(d.date) : d.date) || new Date(d.date),
                value: d.value
            })).filter(d => d.date); // Filter out invalid dates

            if (data.length === 0) {
                container.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-[#8b949e]">No Valid Data Points</div>';
                return;
            }

            const x = d3.scaleTime()
                .domain(d3.extent(data, d => d.date))
                .range([0, width]);

            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.value) * 1.1])
                .range([height, 0]);

            svg.append("g")
                .attr("class", "grid")
                .style("stroke-opacity", 0.1)
                .call(d3.axisLeft(y).tickSize(-width).tickFormat(""));

            svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x).ticks(5));

            svg.append("g")
                .call(d3.axisLeft(y).ticks(5).tickFormat(d => (d * 100).toFixed(0) + '%'));

            const line = d3.line()
                .x(d => x(d.date))
                .y(d => y(d.value));

            svg.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "#c586c0")
                .attr("stroke-width", 2)
                .attr("d", line);

            // Add hover tooltip
            const chartTooltip = d3.select("#chart-container")
                .append("div")
                .attr("class", "chart-tooltip")
                .style("position", "absolute")
                .style("background", "#161b22")
                .style("border", "1px solid #30363d")
                .style("padding", "8px")
                .style("border-radius", "4px")
                .style("font-size", "12px")
                .style("pointer-events", "none")
                .style("opacity", 0)
                .style("z-index", "100");

            // Vertical line for hover
            const verticalLine = svg.append("line")
                .attr("class", "hover-line")
                .attr("stroke", "#8b949e")
                .attr("stroke-width", 1)
                .attr("stroke-dasharray", "4,4")
                .style("opacity", 0);

            // Hover dot
            const hoverDot = svg.append("circle")
                .attr("r", 5)
                .attr("fill", "#c586c0")
                .attr("stroke", "#fff")
                .attr("stroke-width", 2)
                .style("opacity", 0);

            // Overlay for mouse tracking
            svg.append("rect")
                .attr("width", width)
                .attr("height", height)
                .attr("fill", "transparent")
                .on("mousemove", function (event) {
                    const [mouseX] = d3.pointer(event);
                    const hoveredDate = x.invert(mouseX);

                    // Find closest data point
                    const bisect = d3.bisector(d => d.date).left;
                    const idx = bisect(data, hoveredDate);
                    const d0 = data[idx - 1];
                    const d1 = data[idx];

                    if (!d0 && !d1) return;

                    const closest = !d0 ? d1 : !d1 ? d0 :
                        (hoveredDate - d0.date > d1.date - hoveredDate ? d1 : d0);

                    const xPos = x(closest.date);
                    const yPos = y(closest.value);

                    verticalLine
                        .attr("x1", xPos)
                        .attr("x2", xPos)
                        .attr("y1", 0)
                        .attr("y2", height)
                        .style("opacity", 1);

                    hoverDot
                        .attr("cx", xPos)
                        .attr("cy", yPos)
                        .style("opacity", 1);

                    const dateStr = closest.date.toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });

                    chartTooltip
                        .html(`
                            <div class="text-[#8b949e]">${dateStr}</div>
                            <div class="text-[#c586c0] font-bold">${(closest.value * 100).toFixed(1)}%</div>
                        `)
                        .style("left", (xPos + margin.left + 10) + "px")
                        .style("top", (yPos + margin.top - 20) + "px")
                        .style("opacity", 1);
                })
                .on("mouseout", function () {
                    verticalLine.style("opacity", 0);
                    hoverDot.style("opacity", 0);
                    chartTooltip.style("opacity", 0);
                });
        }

        window.addEventListener('resize', () => {
            renderView();
        });

        init();
    </script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const navTexts = document.querySelectorAll('.nav-text');
            const logoText = document.querySelector('.logo-text');
            const toggleIcon = document.getElementById('toggle-icon');

            const isExpanded = sidebar.classList.contains('w-48');

            if (isExpanded) {
                // Collapse
                sidebar.classList.remove('w-48');
                sidebar.classList.add('lg:w-12');
                mainContent.classList.remove('lg:ml-48');
                mainContent.classList.add('lg:ml-12');

                navTexts.forEach(t => t.classList.add('opacity-0'));
                logoText.classList.add('hidden');
                toggleIcon.classList.remove('rotate-180');
            } else {
                // Expand
                sidebar.classList.remove('lg:w-12');
                sidebar.classList.add('w-48');
                mainContent.classList.remove('lg:ml-12');
                mainContent.classList.add('lg:ml-48');

                setTimeout(() => {
                    navTexts.forEach(t => t.classList.remove('opacity-0'));
                    logoText.classList.remove('hidden');
                }, 100);
                toggleIcon.classList.add('rotate-180');
            }
        }
    </script>
</body>

</html>
