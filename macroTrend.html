<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caltropia | Macro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', '"IBM Plex Mono"', 'monospace'],
                        sans: ['"Inter"', 'sans-serif']
                    },
                    colors: {
                        terminal: {
                            bg: '#0d1117',
                            panel: '#161b22',
                            border: '#21262d',
                            orange: '#c586c0',
                            amber: '#dcdcaa',
                            green: '#b5cea8',
                            red: '#f48771',
                            blue: '#9cdcfe',
                            muted: '#8b949e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-size: 12px;
            line-height: 1.4;
        }

        .terminal-header {
            background: #161b22;
            border-bottom: 1px solid #21262d;
        }

        .terminal-card {
            background: #161b22;
            border: 1px solid #21262d;
            transition: all 0.15s ease;
            border-radius: 0.5rem;
        }

        .terminal-card:hover {
            border-color: #c586c0;
            box-shadow: 0 0 20px rgba(197, 134, 192, 0.1);
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
            padding: 12px;
        }

        .risk-bar {
            height: 4px;
            background: #21262d;
        }

        .risk-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
            border-radius: 4px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #21262d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #c586c0;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        input,
        select {
            background: #11151b !important;
            border: 1px solid #21262d !important;
            color: #fff !important;
            font-family: 'Inter', sans-serif !important;
            border-radius: 0.375rem;
        }

        input:focus,
        select:focus {
            border-color: #c586c0 !important;
            outline: none !important;
        }
    </style>
</head>

    <!-- Main Content Container -->
    <div class="ml-0 lg:ml-12 pb-20 lg:pb-0 transition-all">
        <!-- Header -->
        <header
            class="terminal-header px-4 py-2 flex flex-col lg:flex-row lg:items-center justify-between gap-2 lg:gap-0 sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <span class="text-[#c586c0] font-bold text-sm">CALTROPIA</span>
                <span class="text-[#8b949e]">|</span>
                <span class="text-white text-xs">MACRO TERMINAL</span>
                <span class="text-[#b5cea8] text-xs blink">● LIVE</span>
            </div>
            <div class="flex items-center gap-4 text-xs">
                <span class="text-[#8b949e]">LAST UPDATE:</span>
                <span id="last-updated" class="text-[#dcdcaa]">--:--:--</span>
                <button onclick="loadData()"
                    class="px-2 py-1 bg-[#21262d] border border-[#21262d] text-[#c586c0] hover:bg-[#c586c0] hover:text-black transition-all">
                    REFRESH
                </button>
            </div>
        </header>

        <!-- Controls Bar -->
        <div class="bg-[#11151b] border-b border-[#21262d] px-4 py-2 flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-[#8b949e] text-xs">SEARCH:</span>
                <input type="text" id="search-input"
                    class="px-2 py-1 text-base md:text-xs w-32 bg-[#21262d] border border-[#21262d] text-white focus:border-[#c586c0] outline-none"
                    placeholder="TICKER..." oninput="filterAssets()">
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[#8b949e] text-xs">SECTOR:</span>
                <select id="sector-filter"
                    class="px-2 py-1 text-base md:text-xs bg-[#21262d] border border-[#21262d] text-white outline-none"
                    onchange="filterAssets()">
                    <option value="all">ALL</option>
                    <option value="Macro">MACRO</option>
                </select>
            </div>
            <div class="flex items-center gap-1">
                <span class="text-[#8b949e] text-xs">SORT:</span>
                <button onclick="setSortBy('overall')" class="sort-btn px-2 py-1 text-xs bg-[#c586c0] text-black"
                    data-sort="overall">OVERALL</button>
                <button onclick="setSortBy('st')"
                    class="sort-btn px-2 py-1 text-xs bg-[#21262d] border border-[#21262d] text-[#8b949e] hover:text-[#c586c0]"
                    data-sort="st">ST TREND</button>
                <button onclick="setSortBy('it')"
                    class="sort-btn px-2 py-1 text-xs bg-[#21262d] border border-[#21262d] text-[#8b949e] hover:text-[#c586c0]"
                    data-sort="it">IT TREND</button>
                <button onclick="setSortBy('meanrev')"
                    class="sort-btn px-2 py-1 text-xs bg-[#21262d] border border-[#21262d] text-[#8b949e] hover:text-[#c586c0]"
                    data-sort="meanrev">MEAN REV</button>
            </div>
            <div class="ml-auto text-xs">
                <span class="text-[#8b949e]">ASSETS:</span>
                <span id="asset-count" class="text-[#dcdcaa]">0</span>
            </div>
        </div>

        <!-- Assets Grid -->
        <div id="assets-grid" class="data-grid p-2">
        </div>

        <footer class="text-center text-[#21262d] text-xs py-4">
            CALTROPIA MACRO TERMINAL v1.0 | DATA FROM FIREBASE
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxG5qf6mb8E_-b2TeXlRNseMZ26L9DRYg",
            authDomain: "trendscores-df341.firebaseapp.com",
            projectId: "trendscores-df341",
            databaseURL: "https://trendscores-df341-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app);
        const auth = getAuth(app);

        let assetsData = [];
        let currentSort = 'overall';

        onAuthStateChanged(auth, () => loadData());

        window.loadData = async function () {
            document.getElementById('last-updated').textContent = 'Syncing...';
            try {
                // CHANGED FUNCTION CALL TO getMacroData
                const getMacroData = httpsCallable(functions, 'getMacroData');
                const result = await getMacroData();
                assetsData = result.data;
            } catch (error) {
                console.error("Error loading macro data:", error);
            }

            document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
            filterAssets();
        };

        window.filterAssets = function () {
            const search = document.getElementById('search-input').value.toLowerCase();
            const sector = document.getElementById('sector-filter').value;
            let data = [...assetsData];

            if (search) data = data.filter(a => a.ticker.toLowerCase().includes(search));
            if (sector !== 'all') data = data.filter(a => a.sector === sector);

            // Sort
            data.sort((a, b) => {
                if (currentSort === 'overall') return b.overall - a.overall;
                if (currentSort === 'st') return (b.stTrend + b.stStrength) - (a.stTrend + a.stStrength);
                if (currentSort === 'it') return (b.itTrend + b.itStrength) - (a.itTrend + a.itStrength);
                if (currentSort === 'meanrev') return Math.abs(b.meanReversion) - Math.abs(a.meanReversion);
                return 0;
            });

            renderGrid(data);
        };

        window.setSortBy = function (sort) {
            currentSort = sort;
            document.querySelectorAll('.sort-btn').forEach(btn => {
                if (btn.dataset.sort === sort) {
                    btn.classList.add('bg-[#c586c0]', 'text-black');
                    btn.classList.remove('bg-[#21262d]', 'text-[#8b949e]', 'border', 'border-[#21262d]');
                } else {
                    btn.classList.remove('bg-[#c586c0]', 'text-black');
                    btn.classList.add('bg-[#21262d]', 'text-[#8b949e]', 'border', 'border-[#21262d]');
                }
            });
            filterAssets();
        };

        function renderGrid(data) {
            const container = document.getElementById('assets-grid');
            document.getElementById('asset-count').textContent = data.length;

            if (data.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-[#8b949e]">NO DATA - LOADING FROM FIREBASE...</div>';
                return;
            }

            container.innerHTML = data.map(a => {
                const overallColor = a.overall > 0 ? '#b5cea8' : a.overall < 0 ? '#f48771' : '#8b949e';

                const factors = [
                    { name: 'ST TREND', value: a.stTrend, max: 2, color: '#b5cea8' },
                    { name: 'ST STR', value: a.stStrength, max: 2, color: '#9cdcfe' },
                    { name: 'IT TREND', value: a.itTrend, max: 2, color: '#dcdcaa' },
                    { name: 'IT STR', value: a.itStrength, max: 2, color: '#c586c0' },
                    { name: 'MEAN REV', value: a.meanReversion, max: 1.5, color: '#f48771' },
                    { name: 'BREAKOUT', value: a.breakout, max: 2, color: '#a855f7' }
                ];

                const factorRows = factors.map(f => {
                    const normPct = Math.min(100, (Math.abs(f.value) / f.max) * 100);
                    const isPositive = f.value >= 0;
                    const valColor = f.value > 0 ? 'text-[#b5cea8]' : f.value < 0 ? 'text-[#f48771]' : 'text-[#8b949e]';
                    const barColor = isPositive ? f.color : '#f48771';

                    return `
                        <div class="flex items-center justify-between text-[10px] mb-1">
                            <span class="text-[#8b949e] w-16">${f.name}</span>
                            <div class="flex-1 mx-2 h-1 bg-[#21262d] rounded overflow-hidden">
                                <div class="h-full transition-all" 
                                     style="width:${normPct}%; background:${barColor}; opacity: ${f.value === 0 ? 0 : 1}"></div>
                            </div>
                            <span class="w-8 text-right ${valColor}">${f.value > 0 ? '+' : ''}${f.value.toFixed(1)}</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="terminal-card p-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-[#c586c0] font-bold text-lg">${a.ticker}</span>
                                <span class="text-[#444] text-xs">${a.sector.toUpperCase()}</span>
                            </div>
                            <div class="text-3xl font-bold" style="color:${overallColor}">${a.overall > 0 ? '+' : ''}${a.overall.toFixed(1)}</div>
                        </div>
                        <div class="space-y-1 border-t border-[#21262d] pt-2">
                            ${factorRows}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.toggleMobileMenu = function () {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            const menuIcon = document.getElementById('menu-icon');
            const closeIcon = document.getElementById('close-icon');
            sidebar.classList.toggle('-translate-x-full');
            sidebar.classList.toggle('translate-x-0');
            overlay.classList.toggle('hidden');
            menuIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
        };
    </script>
</body>
