        async function init() {
            // Fetch everything
            const results = await Promise.all(tickerConfig.map(async config => {
                try {
                    const [momSnap, riskSnap] = await Promise.all([
                        get(ref(db, `equities/${config.ticker}`)),
                        get(ref(db, `equitiesRiskSignals/${config.ticker}`))
                    ]);

                    const momData = momSnap.val() || {};
                    const riskData = riskSnap.val();

                    const p = v => parseFloat(v) || 0;

                    // Scores
                    const stTrend = p(momData.shortTermTrend);
                    const itTrend = p(momData.intermTrend);
                    const trendScore = stTrend + itTrend; // Combined Momentum

                    const meanReversion = p(momData.meanReversion);
                    const breakout = p(momData.breakoutAndDown);

                    // Risk
                    let riskScore = 4;
                    if (typeof riskData === 'object' && riskData) riskScore = parseFloat(riskData.EquityRisk) || 0;
                    else if (typeof riskData === 'number') riskScore = riskData;

                    return {
                        ticker: config.ticker,
                        sector: config.sector,
                        trendScore,
                        meanReversion, // + means Oversold usually in this app logic (from sectors.html logic: pos trend > 0)
                        breakout,
                        riskScore

            allAssets = results.filter(r => r);

            document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
        }

        function applyScanner() {
            let filtered = [];
            const descEl = document.getElementById('scanner-desc');

            if (currentScanner === 'golden') {
                // Pos Trend + Oversold (MeanRev > 0)
                filtered = allAssets.filter(a => a.trendScore > 0 && a.meanReversion > 0);
                descEl.innerHTML = `Assets with <span class="text-[#b5cea8]">Positive Trend</span> and <span class="text-[#b5cea8]">Oversold</span> conditions. High probability mean reversion entries.`;
            } else if (currentScanner === 'knives') {
                // Neg Trend + Oversold (MeanRev > 0)
                filtered = allAssets.filter(a => a.trendScore < 0 && a.meanReversion > 0);
                descEl.innerHTML = `Assets with <span class="text-[#f48771]">Negative Trend</span> but <span class="text-[#b5cea8]">Oversold</span>. High risk counter-trend plays.`;
            } else if (currentScanner === 'breakouts') {
                // High Momentum (> 2) + Breakout Signal (> 0.5)
                filtered = allAssets.filter(a => a.trendScore > 2 && a.breakout > 0.5);
                descEl.innerHTML = `Assets with strong <span class="text-[#c586c0]">Momentum</span> triggering a <span class="text-[#b5cea8]">Breakout</span> signal.`;
            } else if (currentScanner === 'safe') {
                // Low Risk (<= 2) + Pos Trend
                filtered = allAssets.filter(a => a.riskScore <= 2 && a.trendScore > 0);
                descEl.innerHTML = `Assets with <span class="text-[#b5cea8]">Low Risk</span> scores and <span class="text-[#b5cea8]">Positive Trend</span>. Defensive growth.`;
            } else if (currentScanner === 'shorts') {
                // Neg Trend + Overbought (MeanRev < 0)
                filtered = allAssets.filter(a => a.trendScore < 0 && a.meanReversion < 0);
                descEl.innerHTML = `Assets with <span class="text-[#f48771]">Negative Trend</span> and <span class="text-[#f48771]">Overbought</span> conditions. Potential short entries.`;
            }

            // Sort by Strength of the primary factor
            if (currentScanner === 'safe') filtered.sort((a, b) => a.riskScore - b.riskScore); // Ascending risk
            else filtered.sort((a, b) => b.trendScore - a.trendScore); // Descending trend

            renderGrid(filtered);
        }

        function renderGrid(assets) {
            const container = document.getElementById('results-grid');
            document.getElementById('signal-count').textContent = assets.length;

            if (assets.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-20 text-[#8b949e]">No signals found matching this criteria right now.</div>';
                return;
            }

            container.innerHTML = assets.map(a => {
                const momColor = a.trendScore > 0 ? 'text-[#b5cea8]' : 'text-[#f48771]';
                const riskColor = a.riskScore < 4 ? 'text-[#b5cea8]' : a.riskScore < 7 ? 'text-[#dcdcaa]' : 'text-[#f48771]';

                // Reason Badge
                let badge = '';
                if (currentScanner === 'golden') badge = '<span class="bg-[#b5cea8] text-black text-[10px] px-2 py-0.5 rounded font-bold uppercase">GOLDEN SETUP</span>';
                else if (currentScanner === 'knives') badge = '<span class="bg-[#f48771] text-black text-[10px] px-2 py-0.5 rounded font-bold uppercase">FALLING KNIFE</span>';
                else if (currentScanner === 'breakouts') badge = '<span class="bg-[#c586c0] text-black text-[10px] px-2 py-0.5 rounded font-bold uppercase">BREAKOUT</span>';
                else if (currentScanner === 'safe') badge = '<span class="bg-[#9cdcfe] text-black text-[10px] px-2 py-0.5 rounded font-bold uppercase">SAFE HAVEN</span>';
                else if (currentScanner === 'shorts') badge = '<span class="bg-[#f48771] text-black text-[10px] px-2 py-0.5 rounded font-bold uppercase">POTENTIAL SHORT</span>';

                return `
                    <div class="terminal-card p-5 hover:border-[#c586c0] transition-colors group cursor-pointer" onclick="window.location.href='sector_detail.html?sector=${a.sector}'">
                        <div class="flex justify-between items-center mb-4 border-b border-[#21262d] pb-2">
                            <h3 class="text-xl font-bold text-white group-hover:text-[#c586c0] transition-colors">${a.ticker}</h3>
                            <span class="text-xs text-[#8b949e] font-mono">${a.sector.toUpperCase()}</span>
                        </div>
                        
                        <div class="mb-4 flex justify-between items-center">
                            ${badge}
                        </div>

                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between">
                                <span class="text-[#8b949e]">TREND SCORE</span>
                                <span class="font-bold ${momColor}">${a.trendScore.toFixed(2)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-[#8b949e]">MEAN REV</span>
                                <span class="font-bold ${a.meanReversion > 0 ? 'text-[#b5cea8]' : 'text-[#f48771]'}">${a.meanReversion.toFixed(2)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-[#8b949e]">RISK SCORE</span>
                                <span class="font-bold ${riskColor}">${a.riskScore.toFixed(0)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.setScanner = function (type) {
            currentScanner = type;
            document.querySelectorAll('.scanner-tab').forEach(b => {
                if (b.id === `tab-${type}`) {
                    b.classList.add('active', 'bg-[#c586c0]', 'text-[#0d1117]');
                    b.classList.remove('text-[#c9d1d9]', 'bg-[#161b22]');
                } else {
                    b.classList.remove('active', 'bg-[#c586c0]', 'text-[#0d1117]');
                    b.classList.add('text-[#c9d1d9]', 'bg-[#161b22]');
                }
            });
            applyScanner();
        }

        init();

        // Expose to window for buttons
        window.setScanner = setScanner;
    </script>
</body>

</html>
