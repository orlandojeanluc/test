<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Check Debugger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            padding: 20px;
        }

        .log-entry {
            border-bottom: 1px solid #30363d;
            padding: 10px 0;
            word-break: break-all;
        }

        .success {
            color: #56ff69;
        }

        .error {
            color: #ff6b6b;
        }

        .info {
            color: #58a6ff;
        }
    </style>
</head>

<body>
    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">App Check Debugger (Enterprise)</h1>

        <div class="mb-6 p-4 border border-gray-700 rounded bg-gray-900">
            <h2 class="text-xl mb-2">Configuration</h2>
            <div class="grid grid-cols-[120px_1fr] gap-2 text-sm">
                <div class="text-gray-500">Project ID:</div>
                <div>trendscores-df341</div>
                <div class="text-gray-500">Site Key:</div>
                <div id="site-key-display">6LdhuEssAAAAAJrGKy3V5OZdCIjn4IGLz6iJRswE</div>
                <div class="text-gray-500">Provider:</div>
                <div>ReCaptchaEnterpriseProvider</div>
            </div>
            <button id="run-check-btn"
                class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold">
                Run App Check Verification
            </button>
        </div>

        <h2 class="text-xl mb-2">Logs</h2>
        <div id="logs" class="border border-gray-700 rounded bg-black h-96 overflow-y-auto p-4 font-mono text-xs"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider, getToken } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app-check.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBxG5qf6mb8E_-b2TeXlRNseMZ26L9DRYg",
            authDomain: "trendscores-df341.firebaseapp.com",
            projectId: "trendscores-df341",
            databaseURL: "https://trendscores-df341-default-rtdb.firebaseio.com",
            storageBucket: "trendscores-df341.appspot.com",
            messagingSenderId: "172076043329",
            appId: "1:172076043329:web:9f8cb666de1914eb441b4e"
        };

        const SITE_KEY = '6LdhuEssAAAAAJrGKy3V5OZdCIjn4IGLz6iJRswE';

        const logDiv = document.getElementById('logs');

        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = `log-entry ${type}`;
            el.innerHTML = `<span class="opacity-50">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            logDiv.appendChild(el);
            logDiv.scrollTop = logDiv.scrollHeight;
            console[type === 'error' ? 'error' : 'log'](msg);
        }

        async function verifyAppCheck() {
            log("Initializing Firebase App...", 'info');
            try {
                const app = initializeApp(firebaseConfig);
                log("Firebase Initialized.", 'success');

                log(`Initializing App Check with Enterprise Key: ${SITE_KEY}`, 'info');

                // Enable debug mode to see more in console
                self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;

                const appCheck = initializeAppCheck(app, {
                    provider: new ReCaptchaEnterpriseProvider(SITE_KEY),
                    isTokenAutoRefreshEnabled: false // Manual trigger for debugging
                });

                log("Requesting Token via getToken(forceRefresh=true)...", 'info');

                try {
                    const tokenResult = await getToken(appCheck, true);
                    log(`SUCCESS! Token received: ${tokenResult.token.substring(0, 10)}...`, 'success');
                    log("App Check is working correctly on this client.", 'success');
                } catch (err) {
                    log(`TOKEN EXCHANGE FAILED: ${err.message}`, 'error');
                    log(`Full Error Object: ${JSON.stringify(err, Object.getOwnPropertyNames(err))}`, 'error');

                    if (err.code) log(`Error Code: ${err.code}`, 'error');

                    // Specific advice based on message
                    if (err.message && err.message.includes("400")) {
                        log("⚠️ 400 Bad Request often means:", 'info');
                        log("1. The Site Key in code does not match the one in Firebase Console.", 'info');
                        log("2. The Firebase Console is set to 'v3' instead of 'Enterprise'.", 'info');
                        log("3. The 'Firebase App Check API' is not enabled in Google Cloud.", 'info');
                    }
                }

            } catch (setupErr) {
                log(`Setup Error: ${setupErr.message}`, 'error');
            }
        }

        document.getElementById('run-check-btn').addEventListener('click', verifyAppCheck);

        // Auto-run on load after short delay
        setTimeout(() => {
            log("Ready. Click button to test.", 'info');
        }, 500);

    </script>
</body>

</html>
