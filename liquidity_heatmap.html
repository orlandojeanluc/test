    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app-check.js";

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBQcttND6KKVGhccxOpv7rKWIPfIOCCpss",
            authDomain: "trendscores-df341.firebaseapp.com",
            projectId: "trendscores-df341",
            databaseURL: "https://trendscores-df341-default-rtdb.firebaseio.com",
            storageBucket: "trendscores-df341.appspot.com",
            messagingSenderId: "565710392511",
            appId: "1:565710392511:web:37349319364bba19b3ca0a"
        };

        let app, functions, getVolatilityData, getEodhdData, appCheck;
        try {
            app = initializeApp(firebaseConfig);

            // Initialize App Check with reCAPTCHA Enterprise
            appCheck = initializeAppCheck(app, {
                provider: new ReCaptchaEnterpriseProvider('6LdhuEssAAAAAJrGKy3V5OZdCIjn4IGLz6iJRswE'),
                isTokenAutoRefreshEnabled: true
            });

            functions = getFunctions(app);
            getVolatilityData = httpsCallable(functions, 'getVolatilityData', { timeout: 540000 });
            getEodhdData = httpsCallable(functions, 'getEodhdData', { timeout: 120000 });
        } catch (err) {
            // Firebase initialization error handled silently
        }

        let currentTicker = "SPY";
        let historyData = [];
        let optionsData = [];
        let proprietaryDataMap = null;
        let showOI = true;  // Toggle for OI levels visibility

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            initDashboard();
            fetchProprietaryData();

            document.getElementById('search-btn').addEventListener('click', () => {
                const newTicker = document.getElementById('ticker-input').value.toUpperCase();
                if (newTicker) {
                    currentTicker = newTicker;
                    initDashboard();
                }
            });

            document.getElementById('ticker-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const newTicker = document.getElementById('ticker-input').value.toUpperCase();
                    if (newTicker) {
                        currentTicker = newTicker;
                        initDashboard();
                    }
                }
            });

            // OI Toggle Button
            const toggleBtn = document.getElementById('toggle-oi-btn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    showOI = !showOI;
                    toggleBtn.textContent = showOI ? 'OI: ON' : 'OI: OFF';
                    toggleBtn.className = showOI
                        ? 'px-3 py-1 rounded-md text-xs font-semibold transition-all bg-pink-500/20 text-pink-300 border border-pink-500/30 hover:bg-pink-500/30'
                        : 'px-3 py-1 rounded-md text-xs font-semibold transition-all bg-gray-500/20 text-gray-400 border border-gray-500/30 hover:bg-gray-500/30';
                    renderChart();  // Re-render chart with new setting
                });
            }

            // Auto-refresh intraday candle every 60 seconds during market hours
            setInterval(async () => {
                if (isMarketHours() && historyData.length > 0) {
                    await updateIntradayCandle();
                }
            }, 60 * 1000);
        });

        // Lightweight function to update just the intraday candle without full reload
        async function updateIntradayCandle() {
            try {
                const realtimeData = await fetchRealtimeData(currentTicker);
                if (!realtimeData || !realtimeData.close) return;

                const todayStr = new Date().toISOString().split('T')[0];
                const lastCandle = historyData[historyData.length - 1];

                if (lastCandle && lastCandle.date === todayStr) {
                    // Update existing intraday candle
                    lastCandle.high = Math.max(lastCandle.high, realtimeData.high || realtimeData.close);
                    lastCandle.low = Math.min(lastCandle.low, realtimeData.low || realtimeData.close);
                    lastCandle.close = realtimeData.close;
                    lastCandle.volume = realtimeData.volume || lastCandle.volume;

                    // Re-render chart with updated candle
                    renderChart();

                    // Update price display
                    document.getElementById('current-price').innerHTML = `$${realtimeData.close.toFixed(2)} <span class="text-[10px] text-green-400 animate-pulse">● LIVE</span>`;

                }
            } catch (err) {
                // Intraday update handled silently
            }
        }

        async function fetchProprietaryData() {
            const loading = document.getElementById('prop-data-loading');
            if (loading) loading.classList.remove('hidden');

            try {
                if (!getVolatilityData) throw new Error("Firebase not initialized");

                const result = await getVolatilityData();
                const rawData = result.data.data || result.data;

                proprietaryDataMap = {};
                if (Array.isArray(rawData)) {
                    rawData.forEach(item => {
                        proprietaryDataMap[item.ticker] = item;
                    });
                }

                // Refresh Stats if we are idling
                if (document.getElementById('walls-list').childElementCount > 0) {
                    updateStats();
                }

                const container = document.getElementById('prop-data-container');
                if (!proprietaryDataMap && container) container.innerHTML = '<span class="text-xs text-[#8b949e]">No Data.</span>';

            } catch (err) {
                const container = document.getElementById('prop-data-container');
                if (container) container.innerHTML = '<span class="text-xs text-red-500">Signal Sync Error</span>';
            } finally {
                if (loading) loading.classList.add('hidden');
            }
        }

        // --- PRICE ALERT SYSTEM ---
        let alertsEnabled = false;
        let lastAlerts = {};  // Track last alert time per ticker to avoid spam

        // Request notification permission
        async function requestNotificationPermission() {
            if ('Notification' in window) {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    alertsEnabled = true;
                    startAlertScanner();
                } else {
                    // Permission denied
                }
            }
        }

        // Check if within market hours (9:30 AM - 4:00 PM EST)
        function isMarketHours() {
            const now = new Date();
            // Convert to EST (UTC-5, or UTC-4 during DST)
            const estOffset = -5;  // Standard time; adjust if needed for DST
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const est = new Date(utc + (3600000 * estOffset));

            const hours = est.getHours();
            const minutes = est.getMinutes();
            const timeInMinutes = hours * 60 + minutes;

            // Market: 9:30 AM (570 min) to 4:00 PM (960 min)
            const marketOpen = 9 * 60 + 30;  // 9:30 AM = 570
            const marketClose = 16 * 60;      // 4:00 PM = 960

            // Also check if weekday (Mon-Fri)
            const day = est.getDay();
            const isWeekday = day >= 1 && day <= 5;

            return isWeekday && timeInMinutes >= marketOpen && timeInMinutes < marketClose;
        }

        // Send browser notification
        function sendNotification(ticker, price, level, levelType) {
            if (!alertsEnabled) return;

            // Prevent duplicate alerts for same ticker within 15 minutes
            const now = Date.now();
            if (lastAlerts[ticker] && (now - lastAlerts[ticker]) < 15 * 60 * 1000) {
                return;
            }
            lastAlerts[ticker] = now;

            const notification = new Notification(`🎯 CALTROPIA ALERT: ${ticker}`, {
                body: `Price $${price.toFixed(2)} is within 0.5% of ${levelType} at $${level.toFixed(2)}`,
                icon: 'https://caltropia.com/favicon.ico',
                tag: `caltropia-${ticker}`,
                requireInteraction: true
            });

            notification.onclick = () => {
                window.focus();
                document.getElementById('ticker-input').value = ticker;
                currentTicker = ticker;
                initDashboard();
            };

        }

        // Fetch real-time data for a ticker (returns full object with OHLC)
        async function fetchRealtimeData(ticker) {
            try {
                const result = await getEodhdData({ type: 'realtime', ticker: ticker });
                return result.data;
            } catch (err) {
                return null;
            }
        }

        // Wrapper for backward compatibility with alert scanner
        async function fetchRealtimePrice(ticker) {
            const data = await fetchRealtimeData(ticker);
            return data ? (data.close || data.previousClose || null) : null;
        }

        // Check a ticker against its Vol Levels
        function checkTickerLevels(ticker, currentPrice, propData) {
            if (!propData.impliedVol) return;

            const iv = propData.impliedVol;
            const oneSigmaMove = currentPrice * iv * Math.sqrt(30 / 365);
            const multipliers = [0.25, 0.5, 1.0, 2.0];
            const threshold = 0.005;  // 0.5%

            multipliers.forEach(m => {
                const upperLevel = currentPrice + (oneSigmaMove * m);
                const lowerLevel = currentPrice - (oneSigmaMove * m);

                // Check proximity to each level
                if (Math.abs(currentPrice - upperLevel) / currentPrice <= threshold) {
                    sendNotification(ticker, currentPrice, upperLevel, `RES ${m}σ`);
                }
                if (Math.abs(currentPrice - lowerLevel) / currentPrice <= threshold) {
                    sendNotification(ticker, currentPrice, lowerLevel, `SUP ${m}σ`);
                }
            });
        }

        // Main scanner function
        async function scanAllTickers() {
            if (!isMarketHours()) {
                return;
            }

            if (!proprietaryDataMap || Object.keys(proprietaryDataMap).length === 0) {
                return;
            }

            // Limit to first 50 tickers

            // Limit to first 50 tickers to avoid API rate limits
            const tickers = Object.keys(proprietaryDataMap).slice(0, 50);

            for (const ticker of tickers) {
                const propData = proprietaryDataMap[ticker];
                const price = await fetchRealtimePrice(ticker);

                if (price) {
                    checkTickerLevels(ticker, price, propData);
                }

                // Small delay to respect API rate limits
                await new Promise(r => setTimeout(r, 200));
            }

        }

        // Start the scanner (runs every 5 minutes)
        function startAlertScanner() {
            // Initial scan after 30 seconds (let data load first)
            setTimeout(scanAllTickers, 30000);

            // Then scan every 5 minutes
            setInterval(scanAllTickers, 5 * 60 * 1000);
        }

        // Initialize alerts on page load
        setTimeout(() => {
            requestNotificationPermission();
        }, 5000);  // Wait 5s for page to load

        async function initDashboard() {
            const loader = document.getElementById('loading-indicator');
            loader.style.display = 'flex';
            loader.innerHTML = `Scanning Liquidity for ${currentTicker}...<br><span class="text-xs text-[#8b949e]">Fetching Price & Volume...</span>`;

            document.getElementById('chart-ticker').textContent = currentTicker;

            try {
                // 1. Fetch EOD History (Prices + Volume)
                const today = new Date();
                const past = new Date();
                past.setDate(today.getDate() - 200);

                const fromStr = past.toISOString().split('T')[0];

                const eodResult = await getEodhdData({ type: 'eod', ticker: currentTicker, from: fromStr });

                if (!eodResult.data) throw new Error("Price Data Fetch Failed - Ticker might be invalid or restricted.");

                historyData = eodResult.data;
                if (!Array.isArray(historyData)) throw new Error("Invalid Price Data Format");

                // 1b. Fetch Real-Time Intraday Data for Today's Developing Candle
                loader.innerHTML = `Scanning Liquidity for ${currentTicker}...<br><span class="text-xs text-[#8b949e]">Fetching Real-Time Data...</span>`;

                try {
                    const realtimeData = await fetchRealtimeData(currentTicker);

                    if (realtimeData && realtimeData.close) {
                        const todayStr = today.toISOString().split('T')[0];
                        const lastHistoryDate = historyData.length > 0 ? historyData[historyData.length - 1].date : null;

                        // Only add today's candle if it's not already in EOD data
                        if (lastHistoryDate !== todayStr) {
                            // Build today's candle from real-time data
                            const todayCandle = {
                                date: todayStr,
                                open: realtimeData.open || realtimeData.previousClose || realtimeData.close,
                                high: realtimeData.high || realtimeData.close,
                                low: realtimeData.low || realtimeData.close,
                                close: realtimeData.close,
                                volume: realtimeData.volume || 0,
                                isIntraday: true  // Flag for styling if needed
                            };

                            historyData.push(todayCandle);
                        }

                        // Update Current Price UI with live price
                        document.getElementById('current-price').innerHTML = `$${realtimeData.close.toFixed(2)} <span class="text-[10px] text-green-400 animate-pulse">● LIVE</span>`;
                    } else {
                        // No real-time data, use last close
                        const lastClose = historyData[historyData.length - 1].close;
                        document.getElementById('current-price').textContent = `$${lastClose.toFixed(2)}`;
                    }
                } catch (rtErr) {
                    const lastClose = historyData[historyData.length - 1].close;
                    document.getElementById('current-price').textContent = `$${lastClose.toFixed(2)}`;
                }

                // RENDER PRICE IMMEDIATELY (Progressive Loading)
                renderChart(false);
                loader.innerHTML = `Scanning Liquidity for ${currentTicker}...<br><span class="text-xs text-[#8b949e]">Fetching Options & Gamma Walls...</span>`;

                // 2. Fetch Options for "Gamma Walls"
                try {
                    const dateStr = today.toISOString().split('T')[0];
                    const nextMonth = new Date();
                    nextMonth.setDate(today.getDate() + 45);
                    const nextMonthStr = nextMonth.toISOString().split('T')[0];

                    const optionsResult = await getEodhdData({
                        type: 'options',
                        ticker: currentTicker,
                        expDateFrom: dateStr,
                        expDateTo: nextMonthStr
                    });

                    const chainJson = optionsResult.data;

                    optionsData = chainJson.data ? chainJson.data.map(d => d.attributes) : [];

                    // RENDER FULL CHART with Options
                    renderChart(true);
                    updateStats();

                    loader.style.display = 'none'; // Success

                } catch (optErr) {
                    loader.innerHTML = `<span class="text-amber-400">Warning: Options Data Unavailable</span><br><span class="text-xs text-[#8b949e]">Showing Price & Volume Only</span>`;
                    setTimeout(() => { loader.style.display = 'none'; }, 2000);
                }

            } catch (err) {
                loader.innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
                // Keep error visible
            }
        }

        let chart = null;
        let candleSeries = null;

        function renderChart() {
            const container = document.getElementById('chart-container');
            container.innerHTML = '';

            // Create Lightweight Chart
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: {
                    background: { type: 'solid', color: '#0d1117' },  // Same as sectors.html body
                    textColor: '#8b949e',
                },
                grid: {
                    vertLines: { color: '#21262d' },
                    horzLines: { color: '#21262d' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: { color: '#22d3ee', width: 1, style: 2 },  // Cyan crosshair
                    horzLine: { color: '#22d3ee', width: 1, style: 2 },
                },
                rightPriceScale: {
                    borderColor: '#30363d',
                },
                timeScale: {
                    borderColor: '#30363d',
                    timeVisible: true,
                    secondsVisible: false,
                },
                handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: true },
                handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
            });

            // Add Candlestick Series (v4 API) - Vol Dashboard Color Palette (Medium)
            candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
                upColor: '#67e8f9',         // Medium Cyan
                downColor: '#f472b6',       // Medium Pink
                borderUpColor: '#67e8f9',
                borderDownColor: '#f472b6',
                wickUpColor: '#67e8f9',
                wickDownColor: '#f472b6',
            });

            // Convert data to Lightweight Charts format
            const candleData = historyData.map(d => ({
                time: d.date, // YYYY-MM-DD format works
                open: d.open,
                high: d.high,
                low: d.low,
                close: d.close,
            }));

            candleSeries.setData(candleData);

            // --- ADD OI WALLS (Pink Lines) - Conditional based on toggle ---
            if (showOI && optionsData.length > 0) {
                const lastClose = historyData[historyData.length - 1].close;
                const oiByStrike = {};

                optionsData.forEach(opt => {
                    const strike = parseFloat(opt.strike);
                    // Filter to reasonable range
                    if (strike >= lastClose * 0.8 && strike <= lastClose * 1.2) {
                        oiByStrike[strike] = (oiByStrike[strike] || 0) + (opt.open_interest || 0);
                    }
                });

                const sortedStrikes = Object.entries(oiByStrike)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5);

                sortedStrikes.forEach(([strike, oi]) => {
                    candleSeries.createPriceLine({
                        price: parseFloat(strike),
                        color: '#f472b6',  // Pink (matches 104.0% text)
                        lineWidth: 1,
                        lineStyle: LightweightCharts.LineStyle.Dashed,
                        axisLabelVisible: true,
                        title: `OI: ${strike}`,
                    });
                });
            }

            // --- ADD CALTROPIA VOL LEVELS (Gold Lines) - Based on YESTERDAY'S close ---
            if (proprietaryDataMap && proprietaryDataMap[currentTicker]) {
                const prop = proprietaryDataMap[currentTicker];
                if (prop.impliedVol) {
                    // Use yesterday's close for stable levels (not today's intraday price)
                    const lastCandle = historyData[historyData.length - 1];
                    const isIntradayCandle = lastCandle && lastCandle.isIntraday;
                    const yesterdayClose = isIntradayCandle && historyData.length >= 2
                        ? historyData[historyData.length - 2].close
                        : lastCandle.close;

                    const oneSigmaMove = yesterdayClose * prop.impliedVol * Math.sqrt(30 / 365);

                    const multipliers = [
                        { m: 0.25, label: 'V.TIGHT', style: LightweightCharts.LineStyle.Dotted, width: 1 },
                        { m: 0.5, label: 'TIGHT', style: LightweightCharts.LineStyle.Dotted, width: 1 },
                        { m: 1.0, label: '', style: LightweightCharts.LineStyle.Dashed, width: 2 },
                        { m: 2.0, label: 'EXTREME', style: LightweightCharts.LineStyle.Solid, width: 2 },
                    ];

                    multipliers.forEach(({ m, label, style, width }) => {
                        const dist = oneSigmaMove * m;
                        const prefix = label ? `${label} ` : '';

                        // Upper Level
                        candleSeries.createPriceLine({
                            price: yesterdayClose + dist,
                            color: '#93c5fd',  // Light blue (matches badges)
                            lineWidth: width,
                            lineStyle: style,
                            axisLabelVisible: true,
                            title: `${prefix}RES ${m}σ`,
                        });

                        // Lower Level
                        candleSeries.createPriceLine({
                            price: yesterdayClose - dist,
                            color: '#93c5fd',  // Light blue (matches badges)
                            lineWidth: width,
                            lineStyle: style,
                            axisLabelVisible: true,
                            title: `${prefix}SUP ${m}σ`,
                        });
                    });
                }
            }

            // Fit content to view
            chart.timeScale().fitContent();

            // Handle resize
            const resizeObserver = new ResizeObserver(entries => {
                if (chart) {
                    const { width, height } = entries[0].contentRect;
                    chart.resize(width, height);
                }
            });
            resizeObserver.observe(container);
        }

        function updateStats() {
            // Populate Side Panel
            const list = document.getElementById('walls-list');
            list.innerHTML = '';

            // Calculate local OI max
            const lastClose = historyData[historyData.length - 1].close;
            const nearbyOpts = optionsData.filter(o => Math.abs(parseFloat(o.strike) - lastClose) < (lastClose * 0.2));

            // Group nearby OI
            const oiMap = {};
            let totalCalls = 0;
            let totalPuts = 0;

            nearbyOpts.forEach(o => {
                const s = o.strike;
                oiMap[s] = (oiMap[s] || 0) + (o.open_interest || 0);
                if (o.type === 'CALL') totalCalls += (o.open_interest || 0);
                if (o.type === 'PUT') totalPuts += (o.open_interest || 0);
            });

            const topStrikes = Object.entries(oiMap)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 8); // Top 8

            topStrikes.forEach(([strike, oi]) => {
                const el = document.createElement('div');
                const isAbove = parseFloat(strike) > lastClose;
                el.className = `flex justify-between items-center bg-[#0d1117] p-2 rounded border border-[#30363d] text-xs`;
                el.innerHTML = `
                    <span class="font-mono font-bold ${isAbove ? 'text-purple-400' : 'text-purple-300'}">${strike}</span>
                    <span class="text-[#8b949e]">${oi.toLocaleString()} OI</span>
                `;
                list.appendChild(el);
            });

            // Update POC (Point of Control - Max Vol Shelf)
            // (Re-logic from renderChart for simplicity or global state)
            // For now, placeholder or simple calc
            // Update POC
            document.getElementById('poc-price').textContent = `$${topStrikes[0] ? topStrikes[0][0] : '---'}`;

            // Put Call Ratio
            const pcr = totalCalls > 0 ? totalPuts / totalCalls : 0;
            const pcrWidth = Math.min(100, (totalPuts / (totalPuts + totalCalls)) * 100);
            document.getElementById('pcr-bar').style.width = `${pcrWidth}%`;

            // --- PROPRIETARY DATA UPDATE ---
            const propContainer = document.getElementById('prop-data-container');
            const propLoader = document.getElementById('prop-data-loading');

            if (propContainer) {
                if (!proprietaryDataMap) {
                    // Loading state handled in fetch
                    if (propLoader) propLoader.classList.remove('hidden');
                } else {
                    if (propLoader) propLoader.classList.add('hidden');
                    const tickerData = proprietaryDataMap[currentTicker];

                    if (tickerData) {
                        // Extract Signals
                        const vrp = tickerData.vrp !== undefined ? (tickerData.vrp * 100).toFixed(1) + '%' : '--';
                        const regime = tickerData.volRegime || 'Normal';
                        const trend = tickerData.trendScore ? tickerData.trendScore.toFixed(2) : '--';

                        // Colors
                        const vrpColor = (tickerData.vrp > 0) ? 'text-rose-400' : 'text-emerald-400';
                        const trendColor = (tickerData.trendScore > 0) ? 'text-emerald-400' : 'text-rose-400';
                        // Regime Color
                        let regimeColor = 'text-blue-300';
                        if (regime === 'Stress') regimeColor = 'text-red-500';
                        if (regime === 'High Vol') regimeColor = 'text-amber-400';
                        if (regime === 'Low Vol') regimeColor = 'text-emerald-400';

                        propContainer.innerHTML = `
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                 <div class="bg-[#161b22] p-2 rounded border border-[#30363d] flex flex-col justify-center items-center">
                                    <div class="text-[#8b949e] text-[9px] uppercase tracking-wide">Trend Score</div>
                                    <div class="font-mono font-bold ${trendColor} text-lg">${trend}</div>
                                 </div>
                                 <div class="bg-[#161b22] p-2 rounded border border-[#30363d] flex flex-col justify-center items-center">
                                    <div class="text-[#8b949e] text-[9px] uppercase tracking-wide">VRP Prem</div>
                                    <div class="font-mono font-bold ${vrpColor} text-lg">${vrp}</div>
                                 </div>
                                 <div class="col-span-2 bg-[#161b22] p-2 rounded border border-[#30363d] flex justify-between items-center">
                                    <div class="text-[#8b949e] text-[9px] uppercase tracking-wide">Vol Regime</div>
                                    <div class="px-3 py-1 rounded-md font-mono font-semibold text-sm" style="background: #dbeafe; color: #1e40af;">${regime}</div>
                                 </div>
                            </div>
                        `;
                    } else {
                        propContainer.innerHTML = `<div class="text-xs text-[#8b949e] p-2 text-center italic">No Caltropia signal for ${currentTicker}</div>`;
                    }
                }
            }
        }

    </script>
