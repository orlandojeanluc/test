    <style>
        * {
            font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-size: 12px;
            line-height: 1.4;
        }

        .terminal-header {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 1px solid #ff6600;
        }

        .terminal-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            transition: all 0.15s ease;
        }

        .terminal-card:hover {
            border-color: #ff6600;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.1);
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2px;
            background: #1a1a1a;
            padding: 2px;
        }

        .risk-bar {
            height: 4px;
            background: #1a1a1a;
        }

        .risk-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff6600;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        input,
        select {
            background: #0a0a0a !important;
            border: 1px solid #333 !important;
            color: #fff !important;
            font-family: 'JetBrains Mono', monospace !important;
        }

        input:focus,
        select:focus {
            border-color: #ff6600 !important;
            outline: none !important;
        }
    </style>

            { ticker: "CAT", sector: "Industrial" }, { ticker: "DE", sector: "Industrial" }, { ticker: "UNP", sector: "Industrial" }, { ticker: "HON", sector: "Industrial" }, { ticker: "GE", sector: "Industrial" }, { ticker: "BA", sector: "Industrial" }, { ticker: "RTX", sector: "Industrial" }, { ticker: "LMT", sector: "Industrial" }, { ticker: "GD", sector: "Industrial" }, { ticker: "NOC", sector: "Industrial" }, { ticker: "MMM", sector: "Industrial" }, { ticker: "EMR", sector: "Industrial" }, { ticker: "ETN", sector: "Industrial" }, { ticker: "PH", sector: "Industrial" }, { ticker: "ITW", sector: "Industrial" }, { ticker: "CMI", sector: "Industrial" }, { ticker: "CSX", sector: "Industrial" }, { ticker: "NSC", sector: "Industrial" }, { ticker: "UPS", sector: "Industrial" }, { ticker: "FAST", sector: "Industrial" }, { ticker: "URI", sector: "Industrial" }, { ticker: "PWR", sector: "Industrial" }, { ticker: "CTAS", sector: "Industrial" }, { ticker: "TDG", sector: "Industrial" }, { ticker: "HWM", sector: "Industrial" }, { ticker: "AXON", sector: "Industrial" }, { ticker: "JCI", sector: "Industrial" }, { ticker: "TT", sector: "Industrial" }, { ticker: "MSI", sector: "Industrial" }, { ticker: "ROP", sector: "Industrial" },

        ];

        let assetsData = [];
        let currentSort = 'overall';

        onAuthStateChanged(auth, () => loadData());

        window.loadData = async function () {
            document.getElementById('last-updated').textContent = 'Syncing...';
            const results = await Promise.all(tickerConfig.map(async config => {
                try {
                    const snapshot = await get(ref(db, "equities/" + config.ticker));
                    const data = snapshot.val();
                    if (data) {
                        const p = v => parseFloat(v) || 0;
                        return {
                            ticker: config.ticker,
                            sector: config.sector,
                            stTrend: p(data.shortTermTrend),
                            stStrength: p(data.shortTermStrength),
                            itTrend: p(data.intermTrend),
                            itStrength: p(data.intermStrength),
                            meanReversion: p(data.meanReversion),
                            breakout: p(data.breakoutAndDown),
                            overall: p(data.shortTermTrend) + p(data.shortTermStrength) + p(data.intermTrend) + p(data.intermStrength) + p(data.meanReversion) + p(data.breakoutAndDown)
                        };
                    }
                } catch (e) { }
                return null;
            }));
            assetsData = results.filter(r => r);
            document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
            filterAssets();
        };

        window.filterAssets = function () {
            const search = document.getElementById('search-input').value.toLowerCase();
            const sector = document.getElementById('sector-filter').value;
            let data = [...assetsData];

            if (search) data = data.filter(a => a.ticker.toLowerCase().includes(search));
            if (sector !== 'all') data = data.filter(a => a.sector === sector);

            // Sort
            data.sort((a, b) => {
                if (currentSort === 'overall') return b.overall - a.overall;
                if (currentSort === 'st') return (b.stTrend + b.stStrength) - (a.stTrend + a.stStrength);
                if (currentSort === 'it') return (b.itTrend + b.itStrength) - (a.itTrend + a.itStrength);
                if (currentSort === 'meanrev') return Math.abs(b.meanReversion) - Math.abs(a.meanReversion);
                return 0;
            });

            renderGrid(data);
        };

        window.setSortBy = function (sort) {
            currentSort = sort;
            document.querySelectorAll('.sort-btn').forEach(btn => {
                if (btn.dataset.sort === sort) {
                    btn.classList.add('bg-[#ff6600]', 'text-black');
                    btn.classList.remove('bg-[#1a1a1a]', 'text-[#666]', 'border', 'border-[#333]');
                } else {
                    btn.classList.remove('bg-[#ff6600]', 'text-black');
                    btn.classList.add('bg-[#1a1a1a]', 'text-[#666]', 'border', 'border-[#333]');
                }
            });
            filterAssets();
        };

        function renderGrid(data) {
            const container = document.getElementById('assets-grid');
            document.getElementById('asset-count').textContent = data.length;

            if (data.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-[#666]">NO DATA - LOADING FROM FIREBASE...</div>';
                return;
            }

            container.innerHTML = data.map(a => {
                const overallColor = a.overall > 0 ? '#00ff88' : a.overall < 0 ? '#ff3344' : '#666';

                const factors = [
                    { name: 'ST TREND', value: a.stTrend, max: 2, color: '#00ff88' },
                    { name: 'ST STR', value: a.stStrength, max: 2, color: '#0088ff' },
                    { name: 'IT TREND', value: a.itTrend, max: 2, color: '#ffaa00' },
                    { name: 'IT STR', value: a.itStrength, max: 2, color: '#ff6600' },
                    { name: 'MEAN REV', value: a.meanReversion, max: 1.5, color: '#ff3344' },
                    { name: 'BREAKOUT', value: a.breakout, max: 2, color: '#a855f7' }
                ];

                const factorRows = factors.map(f => {
                    const normPct = Math.min(100, (Math.abs(f.value) / f.max) * 100);
                    const isPositive = f.value >= 0;
                    const valColor = f.value > 0 ? 'text-[#00ff88]' : f.value < 0 ? 'text-[#ff3344]' : 'text-[#666]';
                    const barColor = isPositive ? f.color : '#ff3344';

                    return `
                        <div class="flex items-center justify-between text-[10px] mb-1">
                            <span class="text-[#666] w-16">${f.name}</span>
                            <div class="flex-1 mx-2 h-1 bg-[#1a1a1a] rounded overflow-hidden">
                                <div class="h-full transition-all" 
                                     style="width:${normPct}%; background:${barColor}; opacity: ${f.value === 0 ? 0 : 1}"></div>
                            </div>
                            <span class="w-8 text-right font-mono ${valColor}">${f.value > 0 ? '+' : ''}${f.value.toFixed(1)}</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="terminal-card p-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-[#ff6600] font-bold text-lg">${a.ticker}</span>
                                <span class="text-[#444] text-xs">${a.sector.toUpperCase()}</span>
                            </div>
                            <div class="text-2xl font-bold font-mono" style="color:${overallColor}">${a.overall > 0 ? '+' : ''}${a.overall.toFixed(1)}</div>
                        </div>
                        <div class="space-y-1 border-t border-[#1a1a1a] pt-2">
                            ${factorRows}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.toggleMobileMenu = function () {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            const menuIcon = document.getElementById('menu-icon');
            const closeIcon = document.getElementById('close-icon');
            sidebar.classList.toggle('-translate-x-full');
            sidebar.classList.toggle('translate-x-0');
            overlay.classList.toggle('hidden');
            menuIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
        };
    </script>
</body>

</html>
