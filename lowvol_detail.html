        .terminal-card {

            border: 1px solid #21262d;
            transition: all 0.2s ease;
            position: relative;
            border-radius: 0.5rem;
        }

        .terminal-card:hover {
            border-color: #30363d;
            background: #1c2128;
        }

        .risk-card-active {
            border-color: #c586c0 !important;
            background: #1c2128 !important;
        }



        .risk-lowest {
            color: #b5cea8;
        }

        .risk-low {
            color: #b5cea8;
        }

        .risk-medium {
            color: #dcdcaa;
        }

        .risk-high {
            color: #f48771;
        }

        .risk-highest {
            color: #f48771;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }

                title="Vol Dashboard">
                <svg class="w-5 h-5 lg:w-4 lg:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <div class="ml-0 lg:ml-12 pb-20 lg:pb-0 transition-all">
        <!-- Header -->
        <header
            class="terminal-header px-4 py-2 flex flex-col md:flex-row md:items-center justify-between gap-2 md:gap-0 sticky top-0 z-40 bg-[#161b22]">
            <div class="flex items-center gap-2 md:gap-4">
                <a href="lowvol.html"
                    class="text-[#c586c0] hover:text-white transition-colors text-xs flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                    Back
                </a>
                <span class="text-[#8b949e] hidden md:inline">|</span>
                <span id="ticker-header" class="text-white text-xs font-bold uppercase">Loading...</span>
                <span class="text-[#b5cea8] text-[10px] md:text-xs blink">● Live</span>
            </div>
            <div class="flex items-center gap-4 text-xs">
                <span class="text-[#8b949e]">Updated:</span>
                <span id="last-updated" class="text-[#dcdcaa]">--:--:--</span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="p-6 max-w-7xl mx-auto space-y-6">

            <!-- Current Risk Score Card -->
            <div id="top-score-card" class="terminal-card p-8 flex flex-col items-center justify-center text-center">
                <span class="text-[#8b949e] text-xs tracking-[0.15em] mb-2">Current Risk Score</span>
                <div id="current-risk-score" class="text-7xl font-bold text-white">--</div>
                <span id="risk-label" class="text-[#8b949e] text-sm mt-2"></span>
            </div>

            <div class="space-y-4 mt-6">
                <h3 class="text-lg text-[#c9d1d9] font-semibold border-b border-[#21262d] pb-2">
                    Performance by Risk Regime
                </h3>

                <!-- Risk Grid -->
                <!-- Grid of 5 Equal Cards -->
                <div id="risk-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                    <!-- Cards injected by JS -->
                    <div class="col-span-full text-center text-[#8b949e] py-12">Loading data...</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxG5qf6mb8E_-b2TeXlRNseMZ26L9DRYg",
            authDomain: "trendscores-df341.firebaseapp.com",
            projectId: "trendscores-df341",
            storageBucket: "trendscores-df341.firebasestorage.app",
            messagingSenderId: "128695232870",
            appId: "1:128695232870:web:96e8d1964175b5b4819280",
            measurementId: "G-RJD2K2XW68"
        };

        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app);

        // Get Params
        const urlParams = new URLSearchParams(window.location.search);
        const ticker = urlParams.get('ticker');

        if (!ticker) {
            window.location.href = 'lowvol.html';
        }

        document.getElementById('ticker-header').textContent = `${ticker} Risk Analysis`;

        async function loadDetailData() {
            document.getElementById('last-updated').textContent = "Syncing...";

            try {
                const getLowVolDetailData = httpsCallable(functions, 'getLowVolDetailData');
                const result = await getLowVolDetailData({ ticker: ticker });
                const data = result.data;

                const currentScore = data.currentRisk;
                const perfData = data.performance;

                const scoreEl = document.getElementById('current-risk-score');
                const labelEl = document.getElementById('risk-label');

                scoreEl.textContent = currentScore;

                // Colorize Main Score
                const styles = getRiskClasses(currentScore);
                scoreEl.className = `text-7xl font-bold ${styles.textClass}`;
                labelEl.textContent = styles.label;
                labelEl.className = `text-sm mt-2 ${styles.textClass}`;

                renderRiskGrid(perfData, currentScore); // Pass current score
                document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();

            } catch (e) {
                console.error("Error fetching details", e);
                document.getElementById('risk-grid').innerHTML = '<div class="col-span-full text-center text-[#f48771]">Error loading data: ' + e.message + '</div>';
            }
        }

        function renderRiskGrid(data, currentScore) {
            const container = document.getElementById('risk-grid');
            if (!data) {
                container.innerHTML = '<div class="col-span-full text-center text-[#8b949e]">No historical performance data available</div>';
                return;
            }

            // Expected keys: 0, 2, 4, 6, 10
            const keys = ['0', '2', '4', '6', '10'];

            // Normalize current score to nearest key for highlighting (0, 2, 4, 6, 10)
            // Just finding exact match or closest bucket? Assuming exact match logic for "Active Regime" highlighting
            let activeKey = null;
            if (keys.includes(String(currentScore))) activeKey = String(currentScore);

            container.innerHTML = keys.map(k => {
                const item = data[k];
                if (!item) return '';

                // Keys from Firebase: AnnualizedReturn, AnnualizedVolatility
                const ret = item.AnnualizedReturn !== undefined ? item.AnnualizedReturn : (item.Return || 0);
                const vol = item.AnnualizedVolatility !== undefined ? item.AnnualizedVolatility : (item.Volatility || 0);

                const retVal = parseFloat(ret);
                const displayRet = retVal.toFixed(2) + '%';
                const displayVol = parseFloat(vol).toFixed(2) + '%';
                const displayScore = k === '10' ? '10' : k;

                // Color Logic
                const retColor = retVal >= 0 ? 'text-[#b5cea8]' : 'text-[#f48771]';
                const isActive = k === activeKey ? 'risk-card-active' : '';
                const activeLabel = k === activeKey ? '<span class="absolute top-3 right-3 text-[10px] text-[#c586c0] font-medium bg-[#c586c0]/10 px-2 py-0.5 rounded">Current</span>' : '';

                return `
                    <div class="terminal-card p-5 flex flex-col min-h-[180px] relative ${isActive}">
                        ${activeLabel}
                        <div class="flex items-baseline gap-2 mb-4 pb-3 border-b border-[#21262d]">
                            <span class="text-[#8b949e] text-sm">Risk</span>
                            <span class="text-3xl font-bold text-white">${displayScore}</span>
                        </div>
                        
                        <div class="space-y-3 flex-1">
                            <div class="flex justify-between items-center">
                                <span class="text-[#8b949e] text-xs">Annual Return</span>
                                <span class="text-lg font-semibold ${retColor}">${displayRet}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-[#8b949e] text-xs">Volatility</span>
                                <span class="text-lg font-semibold text-white">${displayVol}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getRiskClasses(score) {
            if (score <= 0) return { textClass: 'text-[#b5cea8]', label: 'Lowest Risk' };
            if (score <= 2) return { textClass: 'text-[#b5cea8]', label: 'Low Risk' };
            if (score <= 4) return { textClass: 'text-[#dcdcaa]', label: 'Moderate Risk' };
            if (score <= 6) return { textClass: 'text-[#f48771]', label: 'High Risk' };
            return { textClass: 'text-[#f48771]', label: 'Highest Risk' };
        }

        // Initialize
        loadDetailData();

    </script>
</body>
