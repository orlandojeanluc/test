        ];

        let allData = [];
        let currentView = 'momentum'; // momentum | risk

        async function init() {
            const results = await Promise.all(tickerConfig.map(async config => {
                try {
                    const [momSnap, riskSnap] = await Promise.all([
                        get(ref(db, `equities/${config.ticker}`)),
                        get(ref(db, `equitiesRiskSignals/${config.ticker}`))
                    ]);
                    const momData = momSnap.val() || {};
                    const riskData = riskSnap.val();
                    const p = v => parseFloat(v) || 0;

                    const trendScore = p(momData.shortTermTrend) + p(momData.intermTrend);

                    let riskScore = 4;
                    if (typeof riskData === 'object' && riskData) riskScore = parseFloat(riskData.EquityRisk) || 0;
                    else if (typeof riskData === 'number') riskScore = riskData;

                    return { ticker: config.ticker, sector: config.sector, trendScore, riskScore, value: 1 }; // Uniform size for now
                } catch (e) { return null; }
            }));

            allData = results.filter(r => r);
            document.getElementById('loading').style.display = 'none';
            drawMap();
        }

        function drawMap() {
            const container = document.getElementById('map-container');
            const width = container.clientWidth;

            // Mobile Optimization: Force tall height for scrolling
            const isMobile = window.innerWidth < 768;
            const height = isMobile ? 1400 : container.clientHeight; // 1400px height on mobile

            // Adjust container height for mobile (D3 needs explicit height)
            if (isMobile) container.style.height = '1400px';
            else container.style.height = '100%';

            d3.select("#map-container svg").remove();

            // Hierarchy
            const root = d3.hierarchy({ children: allData })
                .sum(d => d.value) // Size by equal value (or market cap if we had it)
                .sort((a, b) => b.value - a.value);

            // Treemap Layout
            d3.treemap()
                .size([width, height])
                .paddingInner(1)
                .paddingOuter(4)
                .paddingTop(20) // Space for titles
                .round(true)
                (root);

            // Group by Sector manually to create containers? 
            // Better: Hierarchy should be Sector -> Ticker.
            // Let's restructure logic quickly
            const grouped = d3.group(allData, d => d.sector);
            const hierarchyData = { name: "Market", children: Array.from(grouped, ([key, value]) => ({ name: key, children: value })) };

            const root2 = d3.hierarchy(hierarchyData)
                .sum(d => d.value ? d.value : 0) // Leaf nodes have value 1
                .sort((a, b) => b.value - a.value);

            d3.treemap()
                .size([width, height])
                .paddingInner(2)
                .paddingOuter(4)
                .paddingTop(24) // Title bar
                .round(true)
                (root2);

            const svg = d3.select("#map-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .style("font-family", "Inter, sans-serif");

            // Cell Groups
            const cell = svg.selectAll("g")
                .data(root2.leaves())
                .join("g")
                .attr("transform", d => `translate(${d.x0},${d.y0})`);

            // Rectangles
            cell.append("rect")
                .attr("width", d => d.x1 - d.x0)
                .attr("height", d => d.y1 - d.y0)
                .attr("fill", d => getColor(d.data))
                .attr("class", "node")
                .on("mouseover", (e, d) => showTooltip(e, d.data))
                .on("mousemove", (e) => moveTooltip(e))
                .on("mouseout", hideTooltip)
                .on("click", (e, d) => {
                    const isMobile = window.innerWidth < 768;
                    if (isMobile) {
                        // Mobile: Just show/update tooltip on tap, don't navigate
                        e.stopPropagation(); // Prevent affecting parents
                        showTooltip(e, d.data);
                    } else {
                        // Desktop: Navigate to sector detail
                        window.location.href = `sector_detail.html?sector=${d.data.sector}`;
                    }
                });

            // Ticker Labels
            cell.append("text")
                .attr("class", "node-label")
                .attr("x", 4)
                .attr("y", 14)
                .text(d => (d.x1 - d.x0 > 30) ? d.data.ticker : "")
                .attr("font-size", d => Math.min(14, (d.x1 - d.x0) / 4) + "px"); // Scale font

            // Sector Titles (Parent Nodes)
            svg.selectAll("text.sector-title")
                .data(root2.descendants().filter(d => d.depth === 1)) // Sector level
                .join("text")
                .attr("class", "sector-title")
                .attr("x", d => d.x0 + 4)
                .attr("y", d => d.y0 + 16)
                .text(d => d.data.name.toUpperCase())
                .attr("fill", "#8b949e")
                .attr("font-size", "10px")
                .attr("font-weight", "bold")
                .style("pointer-events", "none");
        }

        function getColor(d) {
            if (currentView === 'momentum') {
                if (d.trendScore > 5) return "#c586c0"; // High Mom
                if (d.trendScore > 0) return "#9cdcfe"; // Pos Mom
                if (d.trendScore > -2) return "#2d2d2d"; // Neutral
                return "#f48771"; // Neg Mom
            } else {
                // Risk
                if (d.riskScore <= 2) return "#b5cea8"; // Low Risk (Green)
                if (d.riskScore === 4) return "#dcdcaa"; // Med Risk
                if (d.riskScore >= 7) return "#f48771"; // High Risk
                return "#ce9178"; // Med-High
            }
        }

        function showTooltip(e, d) {
            const el = document.getElementById('tooltip');
            el.style.display = 'block';
            el.innerHTML = `
                <div class="font-bold text-[#c586c0]">${d.ticker}</div>
                <div class="text-[10px] text-[#8b949e] mb-1">${d.sector}</div>
                <div class="grid grid-cols-2 gap-x-4 text-xs">
                    <span>Trend:</span> <span class="${d.trendScore > 0 ? 'text-[#9cdcfe]' : 'text-[#f48771]'}">${d.trendScore.toFixed(2)}</span>
                    <span>Risk:</span> <span class="text-white">${d.riskScore}</span>
                </div>
            `;
            moveTooltip(e);
        }

        function moveTooltip(e) {
            const el = document.getElementById('tooltip');
            const tooltipWidth = el.offsetWidth;
            const windowWidth = window.innerWidth;

            let left = e.pageX + 10;

            // Smart Positioning: Flip to left if too close to right edge
            if ((e.clientX + 10 + tooltipWidth) > (windowWidth - 10)) {
                left = e.pageX - tooltipWidth - 10;
            }

            el.style.left = left + 'px';
            el.style.top = (e.pageY + 10) + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }

        window.setView = function (v) {
            currentView = v;
            document.getElementById('btn-mom').classList.toggle('active', v === 'momentum');
            document.getElementById('btn-risk').classList.toggle('active', v === 'risk');

            // Legend
            const legTitle = document.getElementById('legend-title');
            if (v === 'momentum') {
                legTitle.textContent = "MOMENTUM SCORE";
            } else {
                legTitle.textContent = "RISK SCORE";
            }
            drawMap();
        }

        window.addEventListener('resize', drawMap);
        init();

        window.setView = setView;
    </script>
</body>

</html>
