    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', '"IBM Plex Mono"', 'monospace'],
                        sans: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        terminal: {
                            bg: '#000000',
                            panel: '#0a0a0a',
                            border: '#1a1a1a',
                            orange: '#ff6600',
                            amber: '#ffaa00',
                            green: '#00ff88',
                            red: '#ff3344',

    <style>
        * {
            font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-size: 12px;
            line-height: 1.4;
        }

        .terminal-header {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 1px solid #ff6600;
        }

        .terminal-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            transition: all 0.15s ease;
        }

        .terminal-card:hover {
            border-color: #ff6600;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.1);
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2px;
            background: #1a1a1a;
            padding: 2px;
        }

        .risk-bar {
            height: 4px;
            background: #1a1a1a;
        }

        .risk-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .risk-lowest {
            color: #00ff88;
        }

        .risk-low {
            color: #88ff00;
        }

        .risk-medium {
            color: #ffaa00;
        }

        .risk-high {
            color: #ff6600;
        }

        .risk-highest {
            color: #ff3344;
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .badge-lowest {
            background: #00ff88;
            color: #000;
        }

        .badge-low {
            background: #88ff00;
            color: #000;
        }

        .badge-medium {
            background: #ffaa00;
            color: #000;
        }

        .badge-high {
            background: #ff6600;
            color: #000;
        }

        .badge-highest {
            background: #ff3344;
            color: #000;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff6600;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        input,
        select {
            background: #0a0a0a !important;
            border: 1px solid #333 !important;
            color: #fff !important;
            font-family: 'JetBrains Mono', monospace !important;
        }

        input:focus,
        select:focus {
            border-color: #ff6600 !important;
            outline: none !important;
        }
    </style>
</head>

            { ticker: "CAT", sector: "Industrial" }, { ticker: "DE", sector: "Industrial" }, { ticker: "UNP", sector: "Industrial" }, { ticker: "HON", sector: "Industrial" }, { ticker: "GE", sector: "Industrial" }, { ticker: "BA", sector: "Industrial" }, { ticker: "RTX", sector: "Industrial" }, { ticker: "LMT", sector: "Industrial" }, { ticker: "GD", sector: "Industrial" }, { ticker: "NOC", sector: "Industrial" }, { ticker: "MMM", sector: "Industrial" }, { ticker: "EMR", sector: "Industrial" }, { ticker: "ETN", sector: "Industrial" }, { ticker: "PH", sector: "Industrial" }, { ticker: "ITW", sector: "Industrial" }, { ticker: "CMI", sector: "Industrial" }, { ticker: "CSX", sector: "Industrial" }, { ticker: "NSC", sector: "Industrial" }, { ticker: "UPS", sector: "Industrial" }, { ticker: "FAST", sector: "Industrial" }, { ticker: "URI", sector: "Industrial" }, { ticker: "PWR", sector: "Industrial" }, { ticker: "CTAS", sector: "Industrial" }, { ticker: "TDG", sector: "Industrial" }, { ticker: "HWM", sector: "Industrial" }, { ticker: "AXON", sector: "Industrial" }, { ticker: "JCI", sector: "Industrial" }, { ticker: "TT", sector: "Industrial" }, { ticker: "MSI", sector: "Industrial" }, { ticker: "ROP", sector: "Industrial" },

        let assetsData = [];
        let currentSort = 'score';

        onAuthStateChanged(auth, () => loadData());

        window.loadData = async function () {
            document.getElementById('last-updated').textContent = 'Syncing...';
            const results = await Promise.all(tickerConfig.map(async config => {
                try {
                    const snapshot = await get(ref(db, "equitiesRiskSignals/" + config.ticker));
                    const data = snapshot.val();
                    if (data !== null && data !== undefined) {
                        let score = 0;
                        // Check if data is a direct number value or an object
                        if (typeof data === 'number') {
                            score = data;
                        } else if (typeof data === 'string') {
                            score = parseFloat(data) || 0;
                        } else if (typeof data === 'object') {
                            // Use EquityRisk field from Firebase
                            score = parseFloat(data.EquityRisk) || 0;
                        }

                        return {
                            ticker: config.ticker,
                            sector: config.sector,
                            score
                        };
                    }
                } catch (e) { console.log('Error loading ' + config.ticker, e); }
                return null;
            }));
            assetsData = results.filter(r => r);
            document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
            filterAssets();
        };

        window.filterAssets = function () {
            const search = document.getElementById('search-input').value.toLowerCase();
            const sector = document.getElementById('sector-filter').value;
            let data = [...assetsData];

            if (search) data = data.filter(a => a.ticker.toLowerCase().includes(search));
            if (sector !== 'all') data = data.filter(a => a.sector === sector);

            // Sort by score (lower = lower risk)
            data.sort((a, b) => {
                if (currentSort === 'score') return a.score - b.score;
                if (currentSort === 'score-desc') return b.score - a.score;
                return a.ticker.localeCompare(b.ticker);
            });

            renderGrid(data);
        };

        window.setSortBy = function (sort) {
            currentSort = sort;
            document.querySelectorAll('.sort-btn').forEach(btn => {
                if (btn.dataset.sort === sort) {
                    btn.classList.add('bg-[#ff6600]', 'text-black');
                    btn.classList.remove('bg-[#1a1a1a]', 'text-[#666]', 'border', 'border-[#333]');
                } else {
                    btn.classList.remove('bg-[#ff6600]', 'text-black');
                    btn.classList.add('bg-[#1a1a1a]', 'text-[#666]', 'border', 'border-[#333]');
                }
            });
            filterAssets();
        };

        function getRiskLevel(score) {
            if (score <= 0) return { class: 'risk-lowest', badge: 'badge-lowest', text: 'LOWEST' };
            if (score <= 2) return { class: 'risk-low', badge: 'badge-low', text: 'LOW' };
            if (score <= 4) return { class: 'risk-medium', badge: 'badge-medium', text: 'MODERATE' };
            if (score <= 6) return { class: 'risk-high', badge: 'badge-high', text: 'HIGH' };
            return { class: 'risk-highest', badge: 'badge-highest', text: 'HIGHEST' };
        }

        function renderGrid(data) {
            const container = document.getElementById('assets-grid');
            document.getElementById('asset-count').textContent = data.length;

            if (data.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-[#666]">NO DATA - LOADING FROM EQUITIESRISKSIGNALS...</div>';
                return;
            }

            container.innerHTML = data.map(a => {
                const risk = getRiskLevel(a.score);
                const scoreColor = a.score <= 2 ? '#00ff88' : a.score <= 4 ? '#ffaa00' : '#ff3344';
                const barWidth = Math.min(100, a.score * 10);

                return `
                    <div class="terminal-card p-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-[#ff6600] font-bold text-lg">${a.ticker}</span>
                                <span class="text-[#444] text-xs">${a.sector.toUpperCase()}</span>
                            </div>
                            <span class="badge ${risk.badge}">${risk.text}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-[#666] text-xs">RISK SCORE</span>
                            <span class="text-3xl font-bold ${risk.class}">${a.score.toFixed(1)}</span>
                        </div>
                        <div class="risk-bar mt-3">
                            <div class="risk-fill" style="width:${barWidth}%; background:${scoreColor}"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.toggleMobileMenu = function () {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            const menuIcon = document.getElementById('menu-icon');
            const closeIcon = document.getElementById('close-icon');
            sidebar.classList.toggle('-translate-x-full');
            sidebar.classList.toggle('translate-x-0');
            overlay.classList.toggle('hidden');
            menuIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
        };
    </script>
</body>

</html>
