<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caltropia | Regime Time Machine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', '"IBM Plex Mono"', 'monospace'],
                        sans: ['"Inter"', 'sans-serif']
                    },
                    colors: {
                        terminal: {
                            bg: '#0d1117',
                            panel: '#161b22',
                            border: '#30363d',
                            orange: '#c586c0',
                            amber: '#dcdcaa',
                            green: '#a7f3d0',
                            red: '#fecdd3',
                            blue: '#9cdcfe',
                            muted: '#8b949e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            font-size: 12px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .terminal-card {
            background: #0d1117;
            border: 1px solid #21262d;
            transition: all 0.15s ease;
            position: relative;
            border-radius: 12px;
        }

        .terminal-card:hover {
            border-color: #30363d;
        }

        .similarity-bar {
            height: 8px;
            border-radius: 4px;
            background: #21262d;
            overflow: hidden;
        }

        .similarity-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .tab-btn {
            background: #0d1117;
            border: 1px solid #21262d;
            color: #8b949e;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .tab-btn:hover {
            border-color: #30363d;
            color: white;
        }

        .tab-btn.active {
            border-color: #c586c0;
            color: #c586c0;
        }

        .event-card {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .event-card:hover {
            border-color: #c586c0;
            transform: translateY(-2px);
        }

        .outcome-bullish {
            background: rgba(167, 243, 208, 0.1);
            border-color: #a7f3d0;
        }

        .outcome-bearish {
            background: rgba(254, 205, 211, 0.1);
            border-color: #fecdd3;
        }

        .outcome-neutral {
            background: rgba(220, 220, 170, 0.1);
            border-color: #dcdcaa;
        }

        /* Modal styles */
        #detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #detail-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        #detail-panel {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            max-width: 500px;
            background: #0d1117;
            border-left: 1px solid #21262d;
            z-index: 100;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        #detail-panel.open {
            transform: translateX(0);
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #21262d 25%, #30363d 50%, #21262d 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Responsive sidebar */
        #sidebar.expanded {
            width: 180px !important;
        }

        #sidebar.expanded .nav-text {
            opacity: 1;
        }

        #sidebar.expanded .logo-text {
            display: inline;
        }

        #sidebar.expanded .logo-icon {
            display: none;
        }

        /* Mobile Navigation */
        #mobile-nav-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #mobile-nav-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        #mobile-nav-panel {
            position: fixed;
            bottom: 56px;
            left: 0;
            right: 0;
            background: #0d1117;
            border-top: 1px solid #21262d;
            border-radius: 20px 20px 0 0;
            z-index: 999;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 70vh;
            overflow-y: auto;
            padding: 16px;
        }

        #mobile-nav-panel.show {
            transform: translateY(0);
        }

        .mobile-nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .mobile-nav-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .mobile-nav-card:hover,
        .mobile-nav-card:active {
            border-color: #c586c0;
            background: #1c2128;
        }

        .mobile-nav-card.active {
            border-color: #c586c0;
            background: rgba(197, 134, 192, 0.1);
        }

        .mobile-nav-card .nav-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-nav-card .nav-icon svg {
            width: 100%;
            height: 100%;
        }

        .mobile-nav-card .nav-label {
            font-size: 10px;
            color: #8b949e;
            text-align: center;
            line-height: 1.2;
        }

        @media (min-width: 1024px) {

            #mobile-nav-overlay,
            #mobile-nav-panel {
                display: none !important;
            }
        }
    </style>
</head>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-functions.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app-check.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQcttND6KKVGhccxOpv7rKWIPfIOCCpss",
            authDomain: "trendscores-df341.firebaseapp.com",
            projectId: "trendscores-df341",
            databaseURL: "https://trendscores-df341-default-rtdb.firebaseio.com",
            storageBucket: "trendscores-df341.appspot.com",
            messagingSenderId: "565710392511",
            appId: "1:565710392511:web:37349319364bba19b3ca0a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const functions = getFunctions(app);

        // App Check
        const appCheck = initializeAppCheck(app, {
            provider: new ReCaptchaEnterpriseProvider('6LdhuEssAAAAAJrGKy3V5OZdCIjn4IGLz6iJRswE'),
            isTokenAutoRefreshEnabled: true
        });

        let regimeData = null;
        let currentView = 'combined';

        // Load data
        async function loadData() {
            try {
                const getRegimeTimeMachine = httpsCallable(functions, 'getRegimeTimeMachine');
                const result = await getRegimeTimeMachine();
                regimeData = result.data;

                // Update current state
                updateCurrentState(regimeData.current);

                // Update timestamp
                const ts = new Date(regimeData.timestamp);
                document.getElementById('last-updated').textContent = ts.toLocaleTimeString();

                // Render events
                renderEvents();

            } catch (error) {
                console.error('Error loading regime data:', error);
                document.getElementById('events-container').innerHTML = `
                    <div class="col-span-full text-center py-12 text-[#8b949e]">
                        <p>Unable to load data. Please try again later.</p>
                        <p class="text-xs mt-2">${error.message}</p>
                    </div>
                `;
            }
        }

        function updateCurrentState(current) {
            const stEl = document.getElementById('current-st');
            const itEl = document.getElementById('current-it');
            const combinedEl = document.getElementById('current-combined');

            const stColor = current.avgST > 0 ? '#a7f3d0' : current.avgST < 0 ? '#fecdd3' : '#8b949e';
            const itColor = current.avgIT > 0 ? '#a7f3d0' : current.avgIT < 0 ? '#fecdd3' : '#8b949e';
            const combinedColor = current.avgCombined > 0 ? '#a7f3d0' : current.avgCombined < 0 ? '#fecdd3' : '#8b949e';

            stEl.textContent = (current.avgST > 0 ? '+' : '') + current.avgST.toFixed(2);
            stEl.style.color = stColor;

            itEl.textContent = (current.avgIT > 0 ? '+' : '') + current.avgIT.toFixed(2);
            itEl.style.color = itColor;

            combinedEl.textContent = (current.avgCombined > 0 ? '+' : '') + current.avgCombined.toFixed(2);
            combinedEl.style.color = combinedColor;
        }

        function renderEvents() {
            if (!regimeData) return;

            const container = document.getElementById('events-container');

            // Sort by current view's similarity
            const sorted = [...regimeData.comparisons].sort((a, b) => {
                if (currentView === 'st') return b.stSimilarity - a.stSimilarity;
                if (currentView === 'it') return b.itSimilarity - a.itSimilarity;
                return b.combinedSimilarity - a.combinedSimilarity;
            });

            container.innerHTML = sorted.map((event, index) => {
                const similarity = currentView === 'st' ? event.stSimilarity :
                    currentView === 'it' ? event.itSimilarity :
                        event.combinedSimilarity;

                const barColor = similarity >= 70 ? '#a7f3d0' :
                    similarity >= 40 ? '#dcdcaa' : '#fecdd3';

                const outcomeClass = event.outcomeType === 'bullish' ? 'outcome-bullish' :
                    event.outcomeType === 'bearish' ? 'outcome-bearish' :
                        'outcome-neutral';

                return `
                    <div class="event-card p-4" onclick="openDetail('${event.date}')">
                        <div class="flex items-start justify-between mb-3">
                            <div>
                                <h3 class="text-white font-bold">${event.label}</h3>
                                <p class="text-[#8b949e] text-xs">${event.date}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-bold" style="color: ${barColor}">${similarity.toFixed(0)}%</div>
                                <div class="text-[#8b949e] text-xs">match</div>
                            </div>
                        </div>
                        
                        <div class="similarity-bar mb-3">
                            <div class="similarity-fill" style="width: ${similarity}%; background: ${barColor}"></div>
                        </div>
                        
                        <p class="text-[#8b949e] text-xs mb-3">${event.description}</p>
                        
                        <div class="text-xs px-2 py-1 rounded inline-block ${outcomeClass}">
                            ${event.outcome}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.switchView = function (view) {
            currentView = view;

            // Update tab styles
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`tab-${view}`).classList.add('active');

            renderEvents();
        };

        window.openDetail = function (date) {
            const event = regimeData.comparisons.find(e => e.date === date);
            if (!event) return;

            document.getElementById('detail-title').textContent = event.label;

            const content = document.getElementById('detail-content');

            // Build sector comparison table
            let sectorRows = '';
            Object.entries(event.sectorSimilarities || {}).forEach(([sector, data]) => {
                const sim = currentView === 'st' ? data.st :
                    currentView === 'it' ? data.it :
                        data.combined;
                const simColor = sim >= 70 ? '#a7f3d0' : sim >= 40 ? '#dcdcaa' : '#fecdd3';

                sectorRows += `
                    <tr class="border-b border-[#21262d]">
                        <td class="py-2 text-white">${sector}</td>
                        <td class="py-2 text-center" style="color: ${simColor}">${sim.toFixed(0)}%</td>
                        <td class="py-2 text-right text-[#9cdcfe]">${data.currentST?.toFixed(1) || '--'}</td>
                        <td class="py-2 text-right text-[#8b949e]">${data.historicalST?.toFixed(1) || '--'}</td>
                    </tr>
                `;
            });

            content.innerHTML = `
                <div class="mb-6">
                    <p class="text-[#8b949e] mb-4">${event.description}</p>
                    <div class="text-sm px-3 py-2 rounded inline-block ${event.outcomeType === 'bullish' ? 'outcome-bullish' : event.outcomeType === 'bearish' ? 'outcome-bearish' : 'outcome-neutral'}">
                        <span class="font-bold">What happened next:</span> ${event.outcome}
                    </div>
                </div>
                
                <div class="mb-6">
                    <h3 class="text-sm font-bold text-white mb-3">Similarity Scores</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-[#161b22] rounded-lg p-3 text-center">
                            <div class="text-xs text-[#8b949e] mb-1">ST Trend</div>
                            <div class="text-lg font-bold" style="color: ${event.stSimilarity >= 70 ? '#a7f3d0' : event.stSimilarity >= 40 ? '#dcdcaa' : '#fecdd3'}">${event.stSimilarity.toFixed(0)}%</div>
                        </div>
                        <div class="bg-[#161b22] rounded-lg p-3 text-center">
                            <div class="text-xs text-[#8b949e] mb-1">IT Trend</div>
                            <div class="text-lg font-bold" style="color: ${event.itSimilarity >= 70 ? '#a7f3d0' : event.itSimilarity >= 40 ? '#dcdcaa' : '#fecdd3'}">${event.itSimilarity.toFixed(0)}%</div>
                        </div>
                        <div class="bg-[#161b22] rounded-lg p-3 text-center">
                            <div class="text-xs text-[#8b949e] mb-1">Combined</div>
                            <div class="text-lg font-bold" style="color: ${event.combinedSimilarity >= 70 ? '#a7f3d0' : event.combinedSimilarity >= 40 ? '#dcdcaa' : '#fecdd3'}">${event.combinedSimilarity.toFixed(0)}%</div>
                        </div>
                    </div>
                </div>
                
                <div class="mb-6">
                    <h3 class="text-sm font-bold text-white mb-3">Historical vs Current</h3>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="bg-[#161b22] rounded-lg p-3">
                            <div class="text-xs text-[#8b949e] mb-2">Historical (${event.date})</div>
                            <div class="text-sm">ST: <span class="font-mono">${event.historical.avgST.toFixed(2)}</span></div>
                            <div class="text-sm">IT: <span class="font-mono">${event.historical.avgIT.toFixed(2)}</span></div>
                        </div>
                        <div class="bg-[#161b22] rounded-lg p-3">
                            <div class="text-xs text-[#8b949e] mb-2">Today</div>
                            <div class="text-sm">ST: <span class="font-mono">${regimeData.current.avgST.toFixed(2)}</span></div>
                            <div class="text-sm">IT: <span class="font-mono">${regimeData.current.avgIT.toFixed(2)}</span></div>
                        </div>
                    </div>
                </div>
                
                <div>
                    <h3 class="text-sm font-bold text-white mb-3">Sector Breakdown</h3>
                    <table class="w-full text-xs">
                        <thead>
                            <tr class="text-[#8b949e] border-b border-[#30363d]">
                                <th class="py-2 text-left">Sector</th>
                                <th class="py-2 text-center">Match</th>
                                <th class="py-2 text-right">Now</th>
                                <th class="py-2 text-right">Then</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sectorRows}
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('detail-overlay').classList.add('show');
            document.getElementById('detail-panel').classList.add('open');
        };

        window.closeDetailPanel = function () {
            document.getElementById('detail-overlay').classList.remove('show');
            document.getElementById('detail-panel').classList.remove('open');
        };

        window.toggleSidebar = function () {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('toggle-icon');
            sidebar.classList.toggle('expanded');
            icon.classList.toggle('rotate-180');
        };

        window.openMobileNav = function () {
            document.getElementById('mobile-nav-overlay').classList.add('show');
            document.getElementById('mobile-nav-panel').classList.add('show');
        };

        window.closeMobileNav = function () {
            document.getElementById('mobile-nav-overlay').classList.remove('show');
            document.getElementById('mobile-nav-panel').classList.remove('show');
        };

        // Initialize
        onAuthStateChanged(auth, (user) => {
            loadData();
        });
    </script>

</body>

</html>
