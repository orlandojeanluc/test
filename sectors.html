        }

            height: 100%;

            { ticker: "NEE", sector: "Utilities" }, { ticker: "DUK", sector: "Utilities" }, { ticker: "SO", sector: "Utilities" }, { ticker: "AEP", sector: "Utilities" }, { ticker: "SRE", sector: "Utilities" }, { ticker: "PLD", sector: "Utilities" }, { ticker: "AMT", sector: "Utilities" }, { ticker: "EQIX", sector: "Utilities" }, { ticker: "WELL", sector: "Utilities" }, { ticker: "SPG", sector: "Utilities" }, { ticker: "O", sector: "Utilities" },
            { ticker: "T", sector: "Other" }, { ticker: "VZ", sector: "Other" }, { ticker: "TMUS", sector: "Other" }, { ticker: "UBER", sector: "Other" }, { ticker: "DASH", sector: "Other" }, { ticker: "INTU", sector: "Other" }, { ticker: "ADSK", sector: "Other" }, { ticker: "ACN", sector: "Other" }, { ticker: "ADP", sector: "Other" }, { ticker: "APH", sector: "Other" }, { ticker: "TEL", sector: "Other" }, { ticker: "APD", sector: "Other" }, { ticker: "ECL", sector: "Other" }, { ticker: "SHW", sector: "Other" }, { ticker: "LIN", sector: "Other" }, { ticker: "FCX", sector: "Other" }, { ticker: "NEM", sector: "Other" }, { ticker: "CB", sector: "Other" }, { ticker: "PGR", sector: "Other" }, { ticker: "WM", sector: "Other" }, { ticker: "GM", sector: "Other" }, { ticker: "PM", sector: "Other" }, { ticker: "MO", sector: "Other" }
        ];

        async function init() {
            document.getElementById('sector-count').textContent = [...new Set(tickerConfig.map(t => t.sector))].length;

            try {
                // Call Cloud Function for aggregated data
                const getSectorsData = httpsCallable(functions, 'getSectorsData');
                const result = await getSectorsData();
                const allAssetData = result.data;

                processSectorData(allAssetData);
                document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();

            } catch (error) {
                console.error("Error fetching sector data:", error);
                document.getElementById('sector-grid').innerHTML = `
                    <div class="col-span-full text-center py-20 text-[#f48771] border border-[#f48771] rounded bg-[#0d1117]">
                        Error loading data. Please refresh.
                    </div>
                `;
            }
        }

        function processSectorData(data) {
            // Group by Sector
            const sectors = {};
            data.forEach(item => {
                if (!sectors[item.sector]) {
                    sectors[item.sector] = {
                        name: item.sector,
                        count: 0,
                        totalMom: 0,
                        totalRisk: 0,
                        posSignals: 0,
                        negSignals: 0,
                        tickers: []
                    };
                }
                const s = sectors[item.sector];
                s.count++;
                s.totalMom += item.momScore;
                s.totalRisk += item.riskScore;
                if (item.trendScore > 0) s.posSignals++;
                if (item.trendScore < 0) s.negSignals++;
                s.tickers.push(item);
            });


            const sectorList = Object.values(sectors).map(s => {
                s.avgMom = s.totalMom / s.count;
                s.avgRisk = s.totalRisk / s.count;
                return s;
            });

            // Sort by Highest Avg Momentum
            sectorList.sort((a, b) => b.avgMom - a.avgMom);

            renderGrid(sectorList);
        }

        function drawMiniChart(sector) {
            const containerId = `#chart-${sector.name.replace(/\s+/g, '-')}`;
            const container = document.querySelector(containerId);
            if (!container) return;

            // Fixed internal coordinates for stable mobile rendering
            const width = 400;
            const height = 150;

            // Clear previous
            d3.select(containerId).selectAll("*").remove();

            const svg = d3.select(containerId)
                .append("svg")
                .attr("width", "100%")
                .attr("height", "100%")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .attr("preserveAspectRatio", "xMidYMid meet")
                .style("overflow", "visible");

            // Select top 12 most "active" assets
            const topNodes = [...sector.tickers]
                .sort((a, b) => Math.abs(b.momScore) - Math.abs(a.momScore))
                .slice(0, 12)
                .map(d => ({ ...d }));

            const simulation = d3.forceSimulation(topNodes)
                .force("charge", d3.forceManyBody().strength(-30))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("x", d3.forceX(width / 2).strength(0.1))
                .force("y", d3.forceY(height / 2).strength(0.15))
                .force("collide", d3.forceCollide().radius(d => 8 + Math.abs(d.momScore)));

            const node = svg.append("g")
                .selectAll("g")
                .data(topNodes)
                .join("g")
                .style("cursor", "crosshair");

            // Glowing Orbs
            node.append("circle")
                .attr("r", d => 3 + Math.abs(d.momScore) * 0.6)
                .attr("fill", d => d.momScore > 0 ? "url(#gradient-positive)" : "url(#gradient-negative)")
                .style("filter", "url(#glow)")
                .attr("stroke", d => d.momScore > 0 ? "#34D399" : "#F472B6")
                .attr("stroke-width", 1)
                .attr("opacity", 0.9);

            // Interaction
            node.on("mouseover", function (event, d) {
                const tooltip = document.getElementById('chart-tooltip');
                tooltip.style.opacity = '1';
                tooltip.innerHTML = `
                    <div class="font-bold border-b border-slate-600 pb-1 mb-1">${d.ticker}</div>
                    <div class="flex justify-between gap-4"><span class="text-slate-400">Score:</span> <span class="font-mono ${d.momScore > 0 ? 'text-emerald-400' : 'text-pink-400'}">${d.momScore.toFixed(2)}</span></div>
                `;
                d3.select(this).select("circle").attr("stroke", "#fff").attr("stroke-width", 2);
            })
                .on("mousemove", function (event) {
                    const tooltip = document.getElementById('chart-tooltip');
                    tooltip.style.left = (event.clientX + 10) + 'px';
                    tooltip.style.top = (event.clientY + 10) + 'px';
                })
                .on("mouseout", function (event, d) {
                    document.getElementById('chart-tooltip').style.opacity = '0';
                    d3.select(this).select("circle")
                        .attr("stroke", d.momScore > 0 ? "#34D399" : "#F472B6")
                        .attr("stroke-width", 1);
                });

            simulation.on("tick", () => {
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        function renderGrid(sectors) {
            const container = document.getElementById('sector-grid');
            container.innerHTML = sectors.map(s => {
                const avgMom = s.avgMom;
                const avgRisk = s.avgRisk;
                s.tickers.sort((a, b) => b.momScore - a.momScore);
                const topPick = s.tickers[0];

                const momColor = avgMom > 0 ? 'text-emerald-400' : 'text-pink-400';
                const riskColor = avgRisk < 4 ? 'text-emerald-400' : avgRisk < 7 ? 'text-yellow-400' : 'text-pink-400';

                // Gradient Bar Logic
                const riskPct = Math.min(100, (avgRisk / 10) * 100);
                const barGradient = avgRisk < 5 ? 'bg-gradient-to-r from-emerald-500 to-emerald-300' : 'bg-gradient-to-r from-pink-500 to-pink-300';

                return `
                    <div class="terminal-card p-5 hover:border-violet-500/50 transition-colors group cursor-pointer" onclick="window.location.href='sector_detail.html?sector=${s.name}'">
                        <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-2">
                            <h3 class="text-lg font-bold text-white group-hover:text-violet-400 transition-colors tracking-wide">${s.name}</h3>
                            <span class="text-[10px] text-slate-400 font-mono bg-slate-800/50 px-2 py-1 rounded-full border border-white/5">${s.count} Assets</span>
                        </div>

                        <div class="space-y-4">
                            <!-- Mini Constellation Preview -->
                            <div id="chart-${s.name.replace(/\s+/g, '-')}" class="h-28 w-full bg-slate-900/50 rounded-xl border border-white/5 relative overflow-hidden backdrop-blur-sm"></div>

                            <!-- Metrics Grid -->
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <span class="text-slate-500 text-[10px] uppercase tracking-wider font-bold">Momentum</span>
                                    <div class="text-2xl font-bold ${momColor} mt-1">${avgMom.toFixed(1)}</div>
                                </div>
                                <div class="text-right">
                                    <span class="text-slate-500 text-[10px] uppercase tracking-wider font-bold">Avg Risk</span>
                                    <div class="text-xl font-bold ${riskColor} mt-1">${avgRisk.toFixed(1)}</div>
                                </div>
                            </div>

                            <!-- Risk Meter -->
                            <div class="w-full bg-slate-800/50 rounded-full h-1.5 overflow-hidden">
                                <div class="h-full rounded-full ${barGradient} shadow-lg shadow-pink-500/20" style="width: ${riskPct}%;"></div>
                            </div>
                            
                            <!-- Signals Pills -->
                            <div class="flex gap-2 mt-2">
                                <div class="flex-1 bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-1.5 text-center">
                                    <div class="text-[9px] text-emerald-400/80 uppercase">Pos Trend</div>
                                    <div class="text-emerald-400 font-bold text-sm">${s.posSignals}</div>
                                </div>
                                <div class="flex-1 bg-pink-500/10 border border-pink-500/20 rounded-lg p-1.5 text-center">
                                    <div class="text-[9px] text-pink-400/80 uppercase">Neg Trend</div>
                                    <div class="text-pink-400 font-bold text-sm">${s.negSignals}</div>
                                </div>
                            </div>

                            <!-- Top Pick -->
                             <div class="flex items-center justify-between pt-3 border-t border-white/5">
                                <span class="text-[10px] text-slate-500 font-bold uppercase">Top Mover</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-white font-bold text-sm">${topPick.ticker}</span>
                                    <span class="text-xs font-mono bg-white/5 px-1.5 rounded text-slate-300">${topPick.momScore.toFixed(1)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Draw Charts after DOM update
            setTimeout(() => {
                sectors.forEach(s => drawMiniChart(s));
            }, 0);
        }

        init();
    </script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const navTexts = document.querySelectorAll('.nav-text');
            const logoText = document.querySelector('.logo-text');
            const toggleIcon = document.getElementById('toggle-icon');

            const isExpanded = sidebar.classList.contains('w-48');

            if (isExpanded) {
                // Collapse
                sidebar.classList.remove('w-48');
                sidebar.classList.add('lg:w-12');
                mainContent.classList.remove('lg:ml-48');
                mainContent.classList.add('lg:ml-12');

                navTexts.forEach(t => t.classList.add('opacity-0'));
                logoText.classList.add('hidden');
                toggleIcon.classList.remove('rotate-180');
            } else {
                // Expand
                sidebar.classList.remove('lg:w-12');
                sidebar.classList.add('w-48');
                mainContent.classList.remove('lg:ml-12');
                mainContent.classList.add('lg:ml-48');

                setTimeout(() => {
                    navTexts.forEach(t => t.classList.remove('opacity-0'));
                    logoText.classList.remove('hidden');
                }, 100);
                toggleIcon.classList.add('rotate-180');
            }
        }
    </script>
