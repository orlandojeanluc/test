        async function init() {
            document.getElementById('sector-count').textContent = [...new Set(tickerConfig.map(t => t.sector))].length;

            try {
                // Call Cloud Function for aggregated data
                const getSectorsData = httpsCallable(functions, 'getSectorsData');
                const result = await getSectorsData();
                const allAssetData = result.data;

                processSectorData(allAssetData);
                document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();

            } catch (error) {
                console.error("Error fetching sector data:", error);
                document.getElementById('sector-grid').innerHTML = `
                    <div class="col-span-full text-center py-20 text-[#f48771] border border-[#f48771] rounded bg-[#0d1117]">
                        ERROR LOADING DATA. PLEASE REFRESH.
                    </div>
                `;
            }
        }

        function processSectorData(data) {
            // Group by Sector
            const sectors = {};
            data.forEach(item => {
                if (!sectors[item.sector]) {
                    sectors[item.sector] = {
                        name: item.sector,
                        count: 0,
                        totalMom: 0,
                        totalRisk: 0,
                        posSignals: 0,
                        negSignals: 0,
                        tickers: []
                    };
                }
                const s = sectors[item.sector];
                s.count++;
                s.totalMom += item.momScore;
                s.totalRisk += item.riskScore;
                if (item.trendScore > 0) s.posSignals++;
                if (item.trendScore < 0) s.negSignals++;
                s.tickers.push(item);
            });


            const sectorList = Object.values(sectors).map(s => {
                s.avgMom = s.totalMom / s.count;
                s.avgRisk = s.totalRisk / s.count;
                return s;
            });

            // Sort by Highest Avg Momentum
            sectorList.sort((a, b) => b.avgMom - a.avgMom);

            renderGrid(sectorList);
        }

        function drawMiniChart(sector) {
            const containerId = `#chart-${sector.name.replace(/\s+/g, '-')}`;
            const container = document.querySelector(containerId);
            if (!container) return;

            const width = container.clientWidth;
            const height = container.clientHeight;

            // Clear previous
            d3.select(containerId).selectAll("*").remove();

            const svg = d3.select(containerId)
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .attr("viewBox", [0, 0, width, height]);

            // Select top 8 most "active" assets (highest abs score)
            const topNodes = [...sector.tickers]
                .sort((a, b) => Math.abs(b.momScore) - Math.abs(a.momScore))
                .slice(0, 8)
                .map(d => ({ ...d })); // Clone to avoid mutation issues

            const simulation = d3.forceSimulation(topNodes)
                .force("charge", d3.forceManyBody().strength(-50)) // Stronger repulsion to spread out
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("x", d3.forceX(width / 2).strength(0.1)) // Gentle pull to center
                .force("y", d3.forceY(height / 2).strength(0.1))
                .force("collide", d3.forceCollide().radius(d => 6 + Math.abs(d.momScore) * 0.6)); // Slightly larger collision zone

            const node = svg.append("g")
                .selectAll("g")
                .data(topNodes)
                .join("g");

            // Simple Circles
            node.append("circle")
                .attr("r", d => 3 + Math.abs(d.momScore) * 0.5) // Smaller scale
                .attr("fill", d => d.momScore > 0 ? "#b5cea8" : "#f48771")
                .attr("opacity", 0.8);

            // Tiny Text
            node.append("text")
                .text(d => d.ticker)
                .attr("text-anchor", "middle")
                .attr("dy", "0.35em")
                .attr("fill", "white")
                .attr("font-size", "8px")
                .style("pointer-events", "none");

            simulation.on("tick", () => {
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        function renderGrid(sectors) {
            const container = document.getElementById('sector-grid');
            container.innerHTML = sectors.map(s => {
                const avgMom = s.avgMom;
                const avgRisk = s.avgRisk;

                // Find Top Pick (Highest Momentum?)
                s.tickers.sort((a, b) => b.momScore - a.momScore);
                const topPick = s.tickers[0];

                // Styling Logic
                const momColor = avgMom > 0 ? 'text-[#b5cea8]' : 'text-[#f48771]';
                const riskColor = avgRisk < 4 ? 'text-[#b5cea8]' : avgRisk < 7 ? 'text-[#dcdcaa]' : 'text-[#f48771]';

                // Risk Bar Width
                const riskPct = Math.min(100, (avgRisk / 10) * 100);
                const riskBarColor = avgRisk < 4 ? '#b5cea8' : avgRisk < 7 ? '#dcdcaa' : '#f48771';

                return `
                    <div class="terminal-card p-5 hover:border-[#c586c0] transition-colors group cursor-pointer" onclick="window.location.href='sector_detail.html?sector=${s.name}'">
                        <div class="flex justify-between items-center mb-4 border-b border-[#21262d] pb-2">
                            <h3 class="text-xl font-bold text-white group-hover:text-[#c586c0] transition-colors">${s.name.toUpperCase()}</h3>
                            <span class="text-xs text-[#8b949e] font-mono bg-[#21262d] px-2 py-1 rounded">${s.count} ASSETS</span>
                        </div>

                        <div class="space-y-4">
                            <!-- Mini Constellation Preview -->
                            <div id="chart-${s.name.replace(/\s+/g, '-')}" class="h-24 w-full bg-[#0d1117] rounded border border-[#21262d] relative overflow-hidden"></div>

                            <!-- Avg Momentum -->
                            <div class="flex justify-between items-end">
                                <span class="text-[#8b949e] text-xs font-bold">AVG MOMENTUM</span>
                                <span class="text-2xl font-bold ${momColor} text-glow">${avgMom.toFixed(1)}</span>
                            </div>

                            <!-- Avg Risk -->
                            <div>
                                <div class="flex justify-between items-end mb-1">
                                    <span class="text-[#8b949e] text-xs font-bold">AVG RISK</span>
                                    <span class="text-sm font-bold ${riskColor}">${avgRisk.toFixed(1)}</span>
                                </div>
                                <div class="sector-meter-bg">
                                    <div class="sector-meter-fill" style="width: ${riskPct}%; background: ${riskBarColor}"></div>
                                </div>
                            </div>
                            
                            <!-- Signals -->
                            <div class="grid grid-cols-2 gap-2 mt-2">
                                <div class="bg-[#21262d] p-2 rounded text-center">
                                    <div class="text-[10px] text-[#8b949e]">POS TREND</div>
                                    <div class="text-[#b5cea8] font-bold">${s.posSignals}</div>
                                </div>
                                <div class="bg-[#21262d] p-2 rounded text-center">
                                    <div class="text-[10px] text-[#8b949e]">NEG TREND</div>
                                    <div class="text-[#f48771] font-bold">${s.negSignals}</div>
                                </div>
                            </div>

                            <!-- Top Pick -->
                             <div class="flex items-center justify-between pt-2 border-t border-[#21262d]">
                                <span class="text-[10px] text-[#8b949e]">TOP PICK</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-white font-bold">${topPick.ticker}</span>
                                    <span class="text-[#b5cea8] text-xs font-mono">${topPick.momScore.toFixed(1)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Draw Charts after DOM update
            setTimeout(() => {
                sectors.forEach(s => drawMiniChart(s));
            }, 0);
        }

        init();
    </script>
</body>

</html>
