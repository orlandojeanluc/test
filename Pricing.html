<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Firebase + Stripe Checkout Demo</title>
  <!-- Stripe.js (only once) -->
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <h1>Choose a Plan</h1>
  <button id="subscribe-investor">Subscribe: Investor ($100/mo)</button>
  <button id="subscribe-allocator">Subscribe: Allocator ($300/mo)</button>

  <script type="module">
    // 1) Load the modular Firebase SDK
    import { initializeApp }       from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth }             from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore }        from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // 2) Load the Stripe-Firebase extension helper
    import {
      getStripePayments,
      createCheckoutSession
    } from "https://unpkg.com/@invertase/firestore-stripe-payments@latest/dist/index.esm.js?module";

    // 3) Init Firebase
    const firebaseConfig = {
      apiKey:    "YOUR_FIREBASE_API_KEY",
      authDomain:"YOUR_FIREBASE_AUTH_DOMAIN",
      projectId: "YOUR_FIREBASE_PROJECT_ID",
    };
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // 4) Init the extension
    const payments = getStripePayments(app, {
      productsCollection:      "products",
      customersCollection:     "customers",
      pricesCollection:        "prices",
      subscriptionsCollection: "subscriptions",
      paymentsCollection:      "payments",
    });

    // 5) Init Stripe.js
    const stripe = Stripe("pk_test_YOUR_STRIPE_PUBLISHABLE_KEY");

    // 6) Hard-code your price IDs (from Stripe Dashboard → Products → Prices)
    const INVESTOR_PRICE_ID   = "price_XXXXXXXXXXXXXX"; 
    const ALLOCATOR_PRICE_ID  = "price_YYYYYYYYYYYYYY";

    // 7) Wire up your buttons
    document.getElementById("subscribe-investor")
      .addEventListener("click", async () => {
        if (!auth.currentUser) {
          // not logged in? send to login
          return window.location.href = "login.html";
        }
        // create a dynamic Checkout Session
        const sessionRef = await createCheckoutSession(payments, {
          price: INVESTOR_PRICE_ID,
          mode:  "subscription",
          success_url: window.location.origin + "/success.html",
          cancel_url:  window.location.origin + "/demo.html",
          // tie session to your Firebase user
          client_reference_id: auth.currentUser.uid
        });
        // get the Stripe-hosted URL and redirect
        const { url } = (await sessionRef.get()).data();
        window.location.href = url;
      });

    document.getElementById("subscribe-allocator")
      .addEventListener("click", async () => {
        if (!auth.currentUser) {
          return window.location.href = "login.html";
        }
        const sessionRef = await createCheckoutSession(payments, {
          price: ALLOCATOR_PRICE_ID,
          mode:  "subscription",
          success_url: window.location.origin + "/success.html",
          cancel_url:  window.location.origin + "/demo.html",
          client_reference_id: auth.currentUser.uid
        });
        const { url } = (await sessionRef.get()).data();
        window.location.href = url;
      });
  </script>
</body>
</html>
