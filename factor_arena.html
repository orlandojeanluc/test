        let allData = [];

        async function init() {
            try {
                // Call Cloud Function
                const getFactorArenaData = httpsCallable(functions, 'getFactorArenaData');
                const result = await getFactorArenaData();
                allData = result.data;

            } catch (error) {
                console.error("Error fetching arena data:", error);
                // Optional: Show error UI
            }

            document.getElementById('loading').style.display = 'none';

            // Render correct view based on device
            if (window.innerWidth < 1024) {
                renderMobileList();
            } else {
                drawChart();
            }

            // Handle resize
            window.addEventListener('resize', () => {
                if (window.innerWidth < 1024) {
                    document.getElementById('mobile-list-view').style.display = 'block';
                    document.getElementById('arena-container').classList.add('hidden');
                    renderMobileList();
                } else {
                    document.getElementById('mobile-list-view').style.display = 'none';
                    document.getElementById('arena-container').classList.remove('hidden');
                    drawChart();
                }
            });
        }

        function renderMobileList() {
            const container = document.getElementById('mobile-list-view');
            container.innerHTML = '';

            // 1. Sweet Spot (Mom > 0, Risk < 4) - Sorted by Mom Desc
            const sweetSpot = allData.filter(d => d.mom > 0 && d.risk < 4).sort((a, b) => b.mom - a.mom);

            // 2. Danger Zone (Mom < 0, Risk > 6) - Sorted by Mom Asc (Worst first)
            const dangerZone = allData.filter(d => d.mom < 0 && d.risk > 6).sort((a, b) => a.mom - b.mom);

            // 3. Battlefield (Rest) - Sorted by Mom Desc
            const field = allData.filter(d => !sweetSpot.includes(d) && !dangerZone.includes(d)).sort((a, b) => b.mom - a.mom);

            const createSection = (title, icon, color, data) => {
                if (data.length === 0) return '';
                return `
                    <div class="mb-6">
                        <div class="flex items-center gap-2 mb-3 border-b border-[#21262d] pb-2">
                             <span class="text-lg">${icon}</span>
                             <span class="font-bold text-sm tracking-widest uppercase" style="color: ${color}">${title}</span>
                             <span class="text-[#8b949e] text-xs ml-auto">${data.length} ASSETS</span>
                        </div>
                        <div class="grid grid-cols-1 gap-3">
                            ${data.map(d => `
                                <div class="bg-[#161b22] border border-[#21262d] p-3 rounded flex items-center justify-between">
                                    <div>
                                        <div class="font-bold text-[#c9d1d9] text-base">${d.ticker}</div>
                                        <div class="text-[#8b949e] text-[10px] uppercase">${d.sector}</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-xs font-mono font-bold ${d.mom > 0 ? 'text-[#9cdcfe]' : 'text-[#f48771]'}">
                                            MOM: ${d.mom > 0 ? '+' : ''}${d.mom.toFixed(2)}
                                        </div>
                                        <div class="text-[10px] text-[#8b949e]">RISK: <span class="text-[#c9d1d9]">${d.risk.toFixed(1)}</span></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            };

            container.innerHTML = `
                ${createSection('The Sweet Spot', '💎', '#b5cea8', sweetSpot)}
                ${createSection('The Danger Zone', '💀', '#f48771', dangerZone)}
                ${createSection('The Battlefield', '⚖️', '#dcdcaa', field)}
            `;
        }

        function drawChart() {
            const container = document.getElementById('arena-container');
            const width = container.clientWidth;

            // Mobile Optimization: Unlock height and increase legibility
            const isMobile = window.innerWidth < 768;
            const height = isMobile ? 1200 : container.clientHeight; // 1200px on mobile

            if (isMobile) container.style.height = (height + 150) + 'px'; // +150px buffer
            else container.style.height = '100%';

            const margin = { top: 40, right: 40, bottom: 40, left: 50 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            d3.select("#arena-container svg").remove();

            const svg = d3.select("#arena-container").append("svg")
                .attr("width", width)
                .attr("height", height);

            const g = svg.append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // Scales
            const xScale = d3.scaleLinear().domain([0, 10]).range([0, innerWidth]); // Risk
            const yScale = d3.scaleLinear().domain([-10, 10]).range([innerHeight, 0]); // Momentum

            // Background Zones (Quadrants)
            // Sweet Spot: Low Risk (0-4), High Mom (0-10) -> Top Left
            g.append("rect")
                .attr("x", xScale(0))
                .attr("y", yScale(10))
                .attr("width", xScale(4) - xScale(0))
                .attr("height", yScale(0) - yScale(10))
                .attr("fill", "#0f3d0f") // Dark Green bg
                .attr("opacity", 0.2);

            // Danger Zone: High Risk (6-10), Low Mom (-10 - 0) -> Bottom Right
            g.append("rect")
                .attr("x", xScale(6))
                .attr("y", yScale(0))
                .attr("width", xScale(10) - xScale(6))
                .attr("height", yScale(-10) - yScale(0))
                .attr("fill", "#3d0f0f") // Dark Red bg
                .attr("opacity", 0.2);

            // Gridlines
            const makeXGrid = () => d3.axisBottom(xScale).ticks(10);
            const makeYGrid = () => d3.axisLeft(yScale).ticks(10);

            g.append("g")
                .attr("class", "grid")
                .attr("transform", `translate(0,${innerHeight})`)
                .call(makeXGrid().tickSize(-innerHeight).tickFormat("").tickSizeOuter(0))
                .style("stroke-opacity", 0.1)
                .style("color", "#21262d");

            g.append("g")
                .attr("class", "grid")
                .call(makeYGrid().tickSize(-innerWidth).tickFormat("").tickSizeOuter(0))
                .style("stroke-opacity", 0.1)
                .style("color", "#21262d");

            // Axes
            g.append("g")
                .attr("transform", `translate(0,${innerHeight})`)
                .call(d3.axisBottom(xScale).ticks(5))
                .attr("color", "#8b949e")
                .select(".domain").attr("stroke", "#21262d");

            g.append("g")
                .call(d3.axisLeft(yScale).ticks(5))
                .attr("color", "#8b949e")
                .select(".domain").attr("stroke", "#21262d");

            // Labels
            g.append("text")
                .attr("x", innerWidth / 2)
                .attr("y", innerHeight + 35)
                .attr("fill", "#8b949e")
                .attr("text-anchor", "middle")
                .style("font-size", "12px")
                .text("RISK SCORE (0 = Low, 10 = High)");

            g.append("text")
                .attr("transform", "rotate(-90)")
                .attr("x", -innerHeight / 2)
                .attr("y", -35)
                .attr("fill", "#8b949e")
                .attr("text-anchor", "middle")
                .style("font-size", "12px")
                .text("MOMENTUM SCORE");

            // Nodes Group
            const nodeGroup = g.append("g").attr("class", "nodes");

            // Mobile Size Adjustments
            const circleRadius = isMobile ? 8 : 5;
            const fontSize = isMobile ? "12px" : "10px";
            const collideRadius = isMobile ? 24 : 20;

            // Initialize simulation (use 'risk' and 'mom' for targets, let D3 manage x/y)
            // We initialize x/y to target to reduce initial jitter
            allData.forEach(d => {
                d.x = xScale(d.risk);
                d.y = yScale(d.mom);
            });

            const simulation = d3.forceSimulation(allData)
                .force("x", d3.forceX(d => xScale(d.risk)).strength(0.1)) // Weakened Anchor to Risk
                .force("y", d3.forceY(d => yScale(d.mom)).strength(0.9)) // Strong Anchor to Momentum
                .force("collide", d3.forceCollide(collideRadius)) // Separation radius
                .force("bound", () => {
                    // Custom force to keep nodes inside the visible chart area
                    allData.forEach(d => {
                        d.x = Math.max(30, Math.min(innerWidth - 30, d.x)); // Side padding for text
                        d.y = Math.max(20, Math.min(innerHeight - 20, d.y)); // Top/Bottom padding
                    });
                })
                .stop();

            // Run simulation for enough ticks to settle
            for (let i = 0; i < 300; ++i) simulation.tick();

            const cell = nodeGroup.selectAll("g")
                .data(allData)
                .join("g")
                .attr("transform", d => `translate(${d.x},${d.y})`)
                .style("cursor", "pointer")
                .on("mouseover", (e, d) => showTooltip(e, d))
                .on("mousemove", moveTooltip)
                .on("mouseout", hideTooltip);

            cell.append("circle")
                .attr("r", circleRadius)
                .attr("fill", d => d.mom > 0 ? "#9cdcfe" : "#f48771") // Blue pos, Red neg
                .attr("stroke", "#0d1117")
                .attr("stroke-width", 1);

            cell.append("text")
                .text(d => d.ticker)
                .attr("dy", isMobile ? -12 : -8)
                .attr("text-anchor", "middle")
                .attr("fill", "white")
                .style("font-size", fontSize)
                .style("font-weight", "bold")
                .style("text-shadow", "0 1px 2px black")
                .style("pointer-events", "none");

            // Annotations
            g.append("text").attr("x", 20).attr("y", 30).text("SWEET SPOT 💎").attr("fill", "#b5cea8").style("font-size", "12px").style("opacity", 0.5);
            g.append("text").attr("x", innerWidth - 20).attr("y", innerHeight - 20).attr("text-anchor", "end").text("DANGER ZONE 💀").attr("fill", "#f48771").style("font-size", "12px").style("opacity", 0.5);

        }

        function showTooltip(e, d) {
            const el = document.getElementById('tooltip');
            el.style.display = 'block';
            el.innerHTML = `
                <div class="font-bold text-[#c586c0]">${d.ticker}</div>
                <div class="grid grid-cols-2 gap-x-2 text-xs text-[#8b949e]">
                    <span>Y: Mom</span> <span class="text-white">${d.mom.toFixed(2)}</span>
                    <span>X: Risk</span> <span class="text-white">${d.risk.toFixed(1)}</span>
                </div>
            `;
            moveTooltip(e);
        }

        function moveTooltip(e) {
            const el = document.getElementById('tooltip');
            const tooltipWidth = el.offsetWidth;
            const windowWidth = window.innerWidth;

            let left = e.pageX + 10; // Use pageX for scroll support

            // Smart Positioning: Flip to left if too close to right edge
            if ((e.clientX + 10 + tooltipWidth) > (windowWidth - 10)) {
                left = e.pageX - tooltipWidth - 10;
            }

            el.style.left = left + 'px';
            el.style.top = (e.pageY + 10) + 'px'; // Use pageY for scroll support
        }

        function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

        window.addEventListener('resize', drawChart);
        init();
    </script>
</body>

</html>
