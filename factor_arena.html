            { ticker: "NEE", sector: "Utilities" }, { ticker: "DUK", sector: "Utilities" }, { ticker: "SO", sector: "Utilities" }, { ticker: "AEP", sector: "Utilities" }, { ticker: "SRE", sector: "Utilities" }, { ticker: "PLD", sector: "Utilities" }, { ticker: "AMT", sector: "Utilities" }, { ticker: "EQIX", sector: "Utilities" }, { ticker: "WELL", sector: "Utilities" }, { ticker: "SPG", sector: "Utilities" }, { ticker: "O", sector: "Utilities" },
            { ticker: "T", sector: "Other" }, { ticker: "VZ", sector: "Other" }, { ticker: "TMUS", sector: "Other" }, { ticker: "UBER", sector: "Other" }, { ticker: "DASH", sector: "Other" }, { ticker: "INTU", sector: "Other" }, { ticker: "ADSK", sector: "Other" }, { ticker: "ACN", sector: "Other" }, { ticker: "ADP", sector: "Other" }, { ticker: "APH", sector: "Other" }, { ticker: "TEL", sector: "Other" }, { ticker: "APD", sector: "Other" }, { ticker: "ECL", sector: "Other" }, { ticker: "SHW", sector: "Other" }, { ticker: "LIN", sector: "Other" }, { ticker: "FCX", sector: "Other" }, { ticker: "NEM", sector: "Other" }, { ticker: "CB", sector: "Other" }, { ticker: "PGR", sector: "Other" }, { ticker: "WM", sector: "Other" }, { ticker: "GM", sector: "Other" }, { ticker: "PM", sector: "Other" }, { ticker: "MO", sector: "Other" }
        ];

        let allData = [];

        async function init() {
            try {
                // Call Cloud Function
                const getFactorArenaData = httpsCallable(functions, 'getFactorArenaData');
                const result = await getFactorArenaData();
                allData = result.data;

            } catch (error) {
                console.error("Error fetching arena data:", error);
                // Optional: Show error UI
            }

            document.getElementById('loading').style.display = 'none';

            // Render correct view based on device
            if (window.innerWidth < 1024) {
                renderMobileList();
            } else {
                drawChart();
            }

            // Handle resize
            window.addEventListener('resize', () => {
                if (window.innerWidth < 1024) {
                    document.getElementById('mobile-list-view').style.display = 'block';
                    document.getElementById('arena-container').classList.add('hidden');
                    renderMobileList();
                } else {
                    document.getElementById('mobile-list-view').style.display = 'none';
                    document.getElementById('arena-container').classList.remove('hidden');
                    drawChart();
                }
            });
        }

        function renderMobileList() {
            const container = document.getElementById('mobile-list-view');
            container.innerHTML = '';

            // 1. Sweet Spot (Mom > 0, Risk < 4) - Sorted by Mom Desc
            const sweetSpot = allData.filter(d => d.mom > 0 && d.risk < 4).sort((a, b) => b.mom - a.mom);

            // 2. Danger Zone (Mom < 0, Risk > 6) - Sorted by Mom Asc (Worst first)
            const dangerZone = allData.filter(d => d.mom < 0 && d.risk > 6).sort((a, b) => a.mom - b.mom);

            // 3. Battlefield (Rest) - Sorted by Mom Desc
            const field = allData.filter(d => !sweetSpot.includes(d) && !dangerZone.includes(d)).sort((a, b) => b.mom - a.mom);

            const createSection = (title, icon, color, data) => {
                if (data.length === 0) return '';
                return `
                    <div class="mb-6">
                        <div class="flex items-center gap-2 mb-3 border-b border-[#21262d] pb-2">
                             <span class="text-lg">${icon}</span>
                             <span class="font-bold text-sm tracking-widest" style="color: ${color}">${title}</span>
                             <span class="text-[#8b949e] text-xs ml-auto">${data.length} Assets</span>
                        </div>
                        <div class="grid grid-cols-1 gap-3">
                            ${data.map(d => `
                                <div class="bg-[#161b22] border border-[#21262d] p-3 rounded flex items-center justify-between">
                                    <div>
                                        <div class="font-bold text-[#c9d1d9] text-base">${d.ticker}</div>
                                        <div class="text-[#8b949e] text-[10px] uppercase">${d.sector}</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-xs font-bold ${d.mom > 0 ? 'text-[#9cdcfe]' : 'text-[#f48771]'}">
                                            Mom: ${d.mom > 0 ? '+' : ''}${d.mom.toFixed(2)}
                                        </div>
                                        <div class="text-[10px] text-[#8b949e]">Risk: <span class="text-[#c9d1d9]">${d.risk.toFixed(1)}</span></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            };

            container.innerHTML = `
                ${createSection('The Sweet Spot', '💎', '#b5cea8', sweetSpot)}
                ${createSection('The Danger Zone', '💀', '#f48771', dangerZone)}
                ${createSection('The Battlefield', '⚖️', '#dcdcaa', field)}
            `;
        }

        function drawChart() {
            const container = document.getElementById('chart-area');
            if (!container) return;

            const parentContainer = document.getElementById('arena-container');
            const width = container.clientWidth;

            // Mobile Optimization
            const isMobile = window.innerWidth < 768;
            const height = isMobile ? 800 : container.clientHeight;

            if (isMobile) parentContainer.style.height = (height + 150) + 'px';
            else parentContainer.style.height = '100%';

            const margin = { top: 80, right: 60, bottom: 80, left: 60 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            // Update summary stats
            const sweetSpotCount = allData.filter(d => d.mom > 0 && d.risk < 4).length;
            const dangerZoneCount = allData.filter(d => d.mom < 0 && d.risk > 6).length;
            document.getElementById('sweet-spot-count').textContent = `(${sweetSpotCount})`;
            document.getElementById('danger-zone-count').textContent = `(${dangerZoneCount})`;

            d3.select("#chart-area svg").remove();

            const svg = d3.select("#chart-area").append("svg")
                .attr("width", width)
                .attr("height", height)
                .style("background", "transparent");

            // DEFINITIONS (Gradients & Glows)
            const defs = svg.append("defs");

            // 1. Glow Filter
            const glow = defs.append("filter")
                .attr("id", "glow")
                .attr("x", "-50%")
                .attr("y", "-50%")
                .attr("width", "200%")
                .attr("height", "200%");
            glow.append("feGaussianBlur")
                .attr("stdDeviation", "2.5")
                .attr("result", "coloredBlur");
            const feMerge = glow.append("feMerge");
            feMerge.append("feMergeNode").attr("in", "coloredBlur");
            feMerge.append("feMergeNode").attr("in", "SourceGraphic");

            // 2. Risk Gradients (Green, Yellow, Red)
            const gradients = [
                { id: "gradGreen", start: "#4ade80", end: "#166534" },
                { id: "gradYellow", start: "#facc15", end: "#854d0e" },
                { id: "gradRed", start: "#f87171", end: "#991b1b" }
            ];

            gradients.forEach(g => {
                const grad = defs.append("radialGradient")
                    .attr("id", g.id)
                    .attr("cx", "30%")
                    .attr("cy", "30%")
                    .attr("r", "70%");
                grad.append("stop").attr("offset", "0%").attr("stop-color", g.start).attr("stop-opacity", 1);
                grad.append("stop").attr("offset", "100%").attr("stop-color", g.end).attr("stop-opacity", 1);
            });

            // 3. Background Gradient for Zones
            const zoneGrad = defs.append("linearGradient")
                .attr("id", "zoneGrad")
                .attr("x1", "0%")
                .attr("x2", "100%")
                .attr("y1", "0%")
                .attr("y2", "0%");
            zoneGrad.append("stop").attr("offset", "0%").attr("stop-color", "#ef4444").attr("stop-opacity", 0.08); // Bearish Red
            zoneGrad.append("stop").attr("offset", "45%").attr("stop-color", "#ef4444").attr("stop-opacity", 0); // Fade to transparent
            zoneGrad.append("stop").attr("offset", "55%").attr("stop-color", "#22c55e").attr("stop-opacity", 0); // Transparent
            zoneGrad.append("stop").attr("offset", "100%").attr("stop-color", "#22c55e").attr("stop-opacity", 0.08); // Bullish Green

            const g = svg.append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // BEESWARM: X-axis is Momentum Score (the primary metric)
            const xScale = d3.scaleLinear()
                .domain([-10, 10])
                .range([0, innerWidth]);

            // Color scale based on Risk (green = low risk, red = high risk)
            const riskColorScale = d3.scaleLinear()
                .domain([0, 5, 10])
                .range(["#22c55e", "#eab308", "#ef4444"]);

            // Full background zone using gradient
            g.append("rect")
                .attr("x", 0)
                .attr("y", 0)
                .attr("width", innerWidth)
                .attr("height", innerHeight)
                .attr("fill", "url(#zoneGrad)")
                .attr("rx", 12);

            // Center Reference Line (Momentum = 0)
            g.append("line")
                .attr("x1", xScale(0))
                .attr("x2", xScale(0))
                .attr("y1", -20)
                .attr("y2", innerHeight + 20)
                .attr("stroke", "#ffffff")
                .attr("stroke-width", 1)
                .attr("stroke-dasharray", "4,4")
                .attr("opacity", 0.2);

            // X-axis
            const xAxis = g.append("g")
                .attr("transform", `translate(0,${innerHeight})`)
                .call(d3.axisBottom(xScale).ticks(9).tickFormat(d => d > 0 ? `+${d}` : d))
                .attr("color", "#8b949e");
            xAxis.select(".domain").attr("stroke", "#30363d");
            xAxis.selectAll("line").attr("stroke", "#30363d");

            // X-axis label
            g.append("text")
                .attr("x", innerWidth / 2)
                .attr("y", innerHeight + 50)
                .attr("fill", "#c9d1d9")
                .attr("text-anchor", "middle")
                .style("font-size", "14px")
                .style("font-weight", "600")
                .text("← Bearish          Momentum Score          Bullish →");

            // Zone labels at top
            g.append("text")
                .attr("x", xScale(-5))
                .attr("y", -40)
                .attr("fill", "#f48771")
                .attr("text-anchor", "middle")
                .style("font-size", "14px")
                .style("font-weight", "600")
                .style("opacity", 0.8)
                .text("📉 Bearish");

            g.append("text")
                .attr("x", xScale(5))
                .attr("y", -40)
                .attr("fill", "#9cdcfe")
                .attr("text-anchor", "middle")
                .style("font-size", "14px")
                .style("font-weight", "600")
                .style("opacity", 0.8)
                .text("📈 Bullish");

            // Neutral zone label
            g.append("text")
                .attr("x", xScale(0))
                .attr("y", -15)
                .attr("fill", "#8b949e")
                .attr("text-anchor", "middle")
                .style("font-size", "11px")
                .text("Neutral");

            // Risk legend at top right
            const legendGroup = g.append("g")
                .attr("transform", `translate(${innerWidth - 120}, -50)`);

            legendGroup.append("text")
                .attr("x", 0)
                .attr("y", 0)
                .attr("fill", "#8b949e")
                .style("font-size", "11px")
                .text("Risk Level:");

            const legendData = [
                { color: "url(#gradGreen)", label: "Low" },
                { color: "url(#gradYellow)", label: "Med" },
                { color: "url(#gradRed)", label: "High" }
            ];

            legendData.forEach((d, i) => {
                const lg = legendGroup.append("g")
                    .attr("transform", `translate(${60 + i * 38}, -4)`);

                lg.append("circle")
                    .attr("r", 5)
                    .attr("fill", d.color)
                    .style("filter", "url(#glow)");

                lg.append("text")
                    .attr("x", 8)
                    .attr("y", 4)
                    .attr("fill", "#8b949e")
                    .style("font-size", "10px")
                    .text(d.label);
            });

            // Nodes Group
            const nodeGroup = g.append("g").attr("class", "nodes");

            // Circle sizes
            const circleRadius = isMobile ? 12 : 10;
            const collideRadius = isMobile ? 16 : 14;

            // Initialize positions
            allData.forEach(d => {
                d.x = xScale(d.mom);
                d.y = innerHeight / 2;
                // Assign gradient based on risk
                if (d.risk <= 4) d.fillUrl = "url(#gradGreen)";
                else if (d.risk <= 7) d.fillUrl = "url(#gradYellow)";
                else d.fillUrl = "url(#gradRed)";
            });

            // Beeswarm simulation with gentle gravity
            const simulation = d3.forceSimulation(allData)
                .force("x", d3.forceX(d => xScale(d.mom)).strength(1))
                .force("y", d3.forceY(innerHeight / 2).strength(0.08))
                .force("collide", d3.forceCollide(collideRadius).strength(0.8))
                .force("bound", () => {
                    allData.forEach(d => {
                        d.y = Math.max(circleRadius, Math.min(innerHeight - circleRadius, d.y));
                    });
                })
                .stop();

            // Run simulation
            for (let i = 0; i < 300; ++i) simulation.tick();

            // Sort by momentum for better layering (outliers on top)
            allData.sort((a, b) => Math.abs(b.mom) - Math.abs(a.mom));

            const cell = nodeGroup.selectAll("g")
                .data(allData)
                .join("g")
                .attr("transform", d => `translate(${d.x},${d.y})`)
                .style("cursor", "pointer")
                .on("mouseover", (e, d) => {
                    showTooltip(e, d);
                    // Lift effect
                    d3.select(e.currentTarget)
                        .transition().duration(200)
                        .attr("transform", `translate(${d.x},${d.y - 5}) scale(1.1)`);
                    d3.select(e.currentTarget).select("circle")
                        .attr("stroke", "#fff")
                        .attr("stroke-width", 2);
                })
                .on("mousemove", moveTooltip)
                .on("mouseout", (e, d) => {
                    hideTooltip();
                    d3.select(e.currentTarget)
                        .transition().duration(200)
                        .attr("transform", `translate(${d.x},${d.y}) scale(1)`);
                    d3.select(e.currentTarget).select("circle")
                        .attr("stroke", "none");
                });

            // Main Circles with Gradient & Glow
            cell.append("circle")
                .attr("r", circleRadius)
                .attr("fill", d => d.fillUrl)
                .style("filter", "url(#glow)")
                .attr("opacity", 0.9);

            // White shiny border (inner reflection)
            cell.append("circle")
                .attr("r", circleRadius - 2)
                .attr("fill", "none")
                .attr("stroke", "white")
                .attr("stroke-width", 1)
                .attr("opacity", 0.15);

            // Ticker labels
            cell.append("text")
                .text(d => d.ticker)
                .attr("dy", 3)
                .attr("text-anchor", "middle")
                .attr("fill", "#0f172a") // Dark text on bright circles for contrast
                .style("font-size", isMobile ? "9px" : "8px")
                .style("font-weight", "800")
                .style("pointer-events", "none")
                .style("text-shadow", "0 0 2px rgba(255,255,255,0.5)");

        }

        function showTooltip(e, d) {
            const el = document.getElementById('tooltip');
            el.style.display = 'block';
            const isPositive = d.mom > 0;
            const isSweetSpot = d.mom > 0 && d.risk < 4;
            const isDangerZone = d.mom < 0 && d.risk > 6;
            const zone = isSweetSpot ? 'Sweet Spot 💎' : (isDangerZone ? 'Danger Zone 💀' : 'Neutral');

            el.innerHTML = `
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-3 h-3 rounded-full" style="background: ${isPositive ? '#9cdcfe' : '#f48771'};"></div>
                    <span class="font-bold text-white text-sm">${d.ticker}</span>
                    <span class="text-[#8b949e] text-xs">${d.sector}</span>
                </div>
                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs">
                    <span class="text-[#8b949e]">Momentum</span>
                    <span class="text-right font-semibold" style="color: ${isPositive ? '#9cdcfe' : '#f48771'}">${isPositive ? '+' : ''}${d.mom.toFixed(2)}</span>
                    <span class="text-[#8b949e]">Risk</span>
                    <span class="text-right text-white">${d.risk.toFixed(1)}</span>
                </div>
                <div class="text-[10px] text-[#8b949e] mt-2 pt-2 border-t border-[#21262d]">${zone}</div>
            `;
            moveTooltip(e);
        }

        function moveTooltip(e) {
            const el = document.getElementById('tooltip');
            const tooltipWidth = el.offsetWidth;
            const windowWidth = window.innerWidth;

            let left = e.pageX + 10; // Use pageX for scroll support

            // Smart Positioning: Flip to left if too close to right edge
            if ((e.clientX + 10 + tooltipWidth) > (windowWidth - 10)) {
                left = e.pageX - tooltipWidth - 10;
            }

            el.style.left = left + 'px';
            el.style.top = (e.pageY + 10) + 'px'; // Use pageY for scroll support
        }

        function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

        window.addEventListener('resize', drawChart);
        init();
    </script>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const navTexts = document.querySelectorAll('.nav-text');
            const logoText = document.querySelector('.logo-text');
            const toggleIcon = document.getElementById('toggle-icon');

            const isExpanded = sidebar.classList.contains('w-48');

            if (isExpanded) {
                // Collapse
                sidebar.classList.remove('w-48');
                sidebar.classList.add('lg:w-12');
                mainContent.classList.remove('lg:ml-48');
                mainContent.classList.add('lg:ml-12');

                navTexts.forEach(t => t.classList.add('opacity-0'));
                logoText.classList.add('hidden');
                toggleIcon.classList.remove('rotate-180');
            } else {
                // Expand
                sidebar.classList.remove('lg:w-12');
                sidebar.classList.add('w-48');
                mainContent.classList.remove('lg:ml-12');
                mainContent.classList.add('lg:ml-48');

                setTimeout(() => {
                    navTexts.forEach(t => t.classList.remove('opacity-0'));
                    logoText.classList.remove('hidden');
                }, 100);
                toggleIcon.classList.add('rotate-180');
            }
        }
    </script>
