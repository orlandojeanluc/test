<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caltropia | Sector Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', '"IBM Plex Mono"', 'monospace'],
                        sans: ['"Inter"', 'sans-serif']
                    },
                    colors: {
                        terminal: {
                            bg: '#0d1117',
                            panel: '#161b22',
                            border: '#30363d',
                            orange: '#c586c0',
                            amber: '#dcdcaa',
                            green: '#b5cea8',
                            red: '#f48771',
                            blue: '#9cdcfe',
                            muted: '#8b949e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            font-size: 12px;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .terminal-header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .terminal-card {
            background: #161b22;
            border: 1px solid #30363d;
            transition: all 0.15s ease;
            position: relative;
            border-radius: 8px;
        }

        .terminal-card:hover {
            border-color: #c586c0;
            box-shadow: 0 0 20px rgba(197, 134, 192, 0.1);
        }

        .bar-fill {
            transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .radar-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 2s ease forwards;
        }

        @keyframes drawLine {
            to {
                stroke-dashoffset: 0;
            }
        }

        .sort-btn.active {
            background-color: #c586c0;
            color: black;
        }

        .filter-chip {
            border: 1px solid #30363d;
            color: #8b949e;
            transition: all 0.2s;
            border-radius: 6px;
        }

        .filter-chip:hover {
            color: #fff;
            border-color: #666;
        }

        .filter-chip.active {
            background: #252526;
            border-color: #c586c0;
            color: #c586c0;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #c586c0;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        #tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid #30363d;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.2s;
            border-radius: 6px;
        }

        #tooltip.show {
            opacity: 1;
        }

        /* Detail Panel */
        #detail-panel {
            position: fixed;
            top: 0;
            right: -500px;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: #161b22;
            border-left: 1px solid #30363d;
            z-index: 100;
            padding: 32px;
            transition: right 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: -20px 0 50px rgba(0, 0, 0, 0.8);
            overflow-y: auto;
        }

        #detail-panel.open {
            right: 0;
        }

        #detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #detail-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        input {
            background: #161b22 !important;
            border: 1px solid #30363d !important;
            color: #fff !important;
            border-radius: 6px;
        }

        input:focus {
            border-color: #c586c0 !important;
            outline: none !important;
        }

        /* Fullscreen Chart Styles */
        .chart-fullscreen {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            background: #0d1117 !important;
            padding: 1rem !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: start !important;
        }

        /* Adjust SVG in fullscreen */
        .chart-fullscreen #constellation-container {
            flex: 1;
            width: 100%;
            height: 100%;
            padding: 0;
            align-items: center;
        }

        .chart-fullscreen #constellation-chart {
            max-width: none !important;
            width: 100% !important;
            height: 100% !important;
            max-height: 85vh !important;
            /* Leave room for header */
        }
    </style>
</head>

<body class="min-h-screen w-screen overflow-x-hidden">

    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="fixed z-50 bg-[#0d1117] flex items-center
                bottom-0 w-full h-14 border-t border-[#30363d] flex-row justify-around py-0
                lg:left-0 lg:top-0 lg:h-full lg:w-12 lg:border-r lg:border-t-0 lg:flex-col lg:py-4">

        <div class="hidden lg:block text-[#c586c0] font-bold text-xs mb-6">C</div>

        <div
            class="flex-1 flex flex-row w-full justify-around items-center lg:flex-col lg:w-auto lg:justify-start lg:gap-4 lg:items-center">
            <a href="radial.html"
                class="w-10 h-full lg:w-8 lg:h-8 flex items-center justify-center text-[#8b949e] hover:text-[#c586c0] lg:hover:bg-[#161b22]"
                title="Dashboard">
                <svg class="w-5 h-5 lg:w-4 lg:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                    </path>
                </svg>
            </a>
            <a href="lowvol.html"
                class="w-10 h-full lg:w-8 lg:h-8 flex items-center justify-center text-[#8b949e] hover:text-[#c586c0] lg:hover:bg-[#161b22]"
                title="Risk Terminal">
                <svg class="w-5 h-5 lg:w-4 lg:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10">
                    </path>
                </svg>
            </a>
            <a href="momentum.html"

                title="Momentum">
                <svg class="w-5 h-5 lg:w-4 lg:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
                </svg>
            </a>
            <a href="momentum_factor.html"
                class="w-10 h-full lg:w-8 lg:h-8 flex items-center justify-center text-[#8b949e] hover:text-[#c586c0] lg:hover:bg-[#161b22]"
                title="Momentum Factor">
                <svg class="w-5 h-5 lg:w-4 lg:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </a>
            <a href="mean_reversion.html"
                class="w-10 h-full lg:w-8 lg:h-8 flex items-center justify-center text-[#8b949e] hover:text-[#c586c0] lg:hover:bg-[#161b22]"
                title="Mean Reversion">
                <svg class="w-5 h-5 lg:w-4 lg:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                    </path>
                </svg>
            </a>
            <a href="sectors.html"
                class="w-10 h-full lg:w-8 lg:h-8 flex items-center justify-center text-[#c586c0] border-t-2 lg:border-t-0 lg:bg-[#161b22] lg:border-l-2 border-[#c586c0]"
                title="Sectors">
                <svg class="w-5 h-5 lg:w-4 lg:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path>
                </svg>
            </a>
            <a href="portfolios.html"
                class="w-10 h-full lg:w-8 lg:h-8 flex items-center justify-center text-[#8b949e] hover:text-[#c586c0] lg:hover:bg-[#161b22]"
                title="Portfolios">
                <svg class="w-5 h-5 lg:w-4 lg:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                    </path>
                </svg>

    <div id="tooltip"></div>
    <div id="detail-overlay" onclick="closeDetailPanel()"></div>
    <div id="detail-panel">
        <div class="flex items-center justify-between mb-8 border-b border-[#333] pb-4">
            <h2 id="detail-title" class="text-xl font-bold text-[#c586c0]">ASSET DETAILS</h2>
            <button onclick="closeDetailPanel()" class="w-6 h-6 text-[#8b949e] hover:text-white">✕</button>
        </div>
        <div id="detail-content" class="space-y-6"></div>
    </div>

    <div class="ml-0 lg:ml-12 pb-20 lg:pb-0 transition-all">
        <!-- Header -->
        <header
            class="terminal-header px-4 py-3 flex flex-col md:flex-row md:items-center justify-between gap-4 sticky top-0 z-40">
            <div class="flex items-center gap-2 md:gap-4 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-2">
                    <a href="sectors.html" class="text-[#8b949e] hover:text-white text-xs flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                            </path>
                        </svg>
                        BACK
                    </a>
                    <span class="text-[#8b949e]">|</span>
                    <span id="sector-title-header" class="text-[#c586c0] font-bold text-sm uppercase">LOADING...</span>
                    <span class="text-[#8b949e]">|</span>
                    <span class="text-white text-xs whitespace-nowrap">SECTOR DETAIL</span>
                </div>
                <span class="text-[#b5cea8] text-[10px] md:text-xs blink">● LIVE</span>
            </div>
            <div class="flex flex-col md:flex-row items-start md:items-center gap-3 md:gap-4 text-xs w-full md:w-auto">
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <span class="text-[#8b949e] whitespace-nowrap">SEARCH:</span>
                    <div class="flex-1 md:flex-none flex items-center gap-2">
                        <input type="text" id="search-input"
                            class="px-2 py-1 text-base md:text-xs w-full md:w-48 bg-[#161b22] border border-[#30363d] text-white focus:border-[#c586c0] outline-none"
                            placeholder="TICKER IN SECTOR..." oninput="handleSearch(this.value)">
                        <button onclick="refreshData()"
                            class="px-2 py-1 bg-[#161b22] border border-[#30363d] text-[#c586c0] hover:bg-[#c586c0] hover:text-black transition-all">↻</button>
                    </div>
                </div>
                <div class="flex items-center gap-2 hidden lg:flex">
                    <span class="text-[#8b949e]">UPDATED:</span>
                    <span id="last-updated" class="text-[#dcdcaa]">--:--:--</span>
                </div>
            </div>
        </header>

        <!-- Controls Bar -->
        <div
            class="bg-[#0d1117] border-b border-[#30363d] px-4 py-2 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 overflow-x-hidden">
            <!-- Filter Group -->
            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0 no-scrollbar">
                <span
                    class="text-[#8b949e] text-xs font-bold uppercase whitespace-nowrap sticky left-0 bg-[#0d1117] z-10 pr-2">FILTERS:</span>
                <button class="filter-chip active px-2 py-1 text-xs whitespace-nowrap" data-filter="all"
                    onclick="setFilter('all')">ALL</button>
                <button class="filter-chip px-2 py-1 text-xs whitespace-nowrap" data-filter="bullish"
                    onclick="setFilter('bullish')"><span class="text-[#b5cea8]">●</span> BULL</button>
                <button class="filter-chip px-2 py-1 text-xs whitespace-nowrap" data-filter="bearish"
                    onclick="setFilter('bearish')"><span class="text-[#f48771]">●</span> BEAR</button>
            </div>

            <!-- Sort Group -->
            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                <span
                    class="text-[#8b949e] text-xs font-bold uppercase whitespace-nowrap sticky left-0 bg-[#0d1117] z-10 pr-2">SORT:</span>
                <button
                    class="sort-btn active px-2 py-1 text-xs bg-[#1a1a1a] border border-[#333] text-[#8b949e] whitespace-nowrap"
                    data-sort="score" onclick="setSort('score')">SCORE</button>
                <button
                    class="sort-btn px-2 py-1 text-xs bg-[#1a1a1a] border border-[#333] text-[#8b949e] whitespace-nowrap"
                    data-sort="alpha" onclick="setSort('alpha')">NAME</button>
            </div>
        </div>

        <div class="p-4 space-y-4">
            <!-- Metrics Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-4 gap-2">
                <div class="terminal-card p-3 cursor-pointer" onclick="showMetricDetail('total')">
                    <div class="text-[#8b949e] text-[10px] font-bold uppercase mb-1">TOTAL ASSETS</div>
                    <div id="total-assets" class="text-2xl font-bold text-white count-up">--</div>
                </div>
                <div class="terminal-card p-3 cursor-pointer" onclick="showMetricDetail('bullish')">
                    <div class="text-[#8b949e] text-[10px] font-bold uppercase mb-1 hover:text-[#b5cea8]">BULLISH TREND
                    </div>
                    <div class="flex items-baseline gap-2 mb-1">
                        <span id="bullish-count" class="text-2xl font-bold text-[#b5cea8] count-up">--</span>
                        <span id="bullish-pct" class="text-xs font-mono text-[#b5cea8]">--%</span>
                    </div>
                    <div class="w-full bg-[#1a1a1a] h-1">
                        <div id="bullish-bar" class="h-full bg-[#b5cea8] bar-fill" style="width: 0%"></div>
                    </div>
                </div>
                <div class="terminal-card p-3 cursor-pointer" onclick="showMetricDetail('neutral')">
                    <div class="text-[#8b949e] text-[10px] font-bold uppercase mb-1 hover:text-[#dcdcaa]">NEUTRAL</div>
                    <div class="flex items-baseline gap-2 mb-1">
                        <span id="neutral-count" class="text-2xl font-bold text-[#dcdcaa] count-up">--</span>
                        <span id="neutral-pct" class="text-xs font-mono text-[#dcdcaa]">--%</span>
                    </div>
                    <div class="w-full bg-[#1a1a1a] h-1">
                        <div id="neutral-bar" class="h-full bg-[#dcdcaa] bar-fill" style="width: 0%"></div>
                    </div>
                </div>
                <div class="terminal-card p-3 cursor-pointer" onclick="showMetricDetail('bearish')">
                    <div class="text-[#8b949e] text-[10px] font-bold uppercase mb-1 hover:text-[#f48771]">BEARISH TREND
                    </div>
                    <div class="flex items-baseline gap-2 mb-1">
                        <span id="bearish-count" class="text-2xl font-bold text-[#f48771] count-up">--</span>
                        <span id="bearish-pct" class="text-xs font-mono text-[#f48771]">--%</span>
                    </div>
                    <div class="w-full bg-[#1a1a1a] h-1">
                        <div id="bearish-bar" class="h-full bg-[#f48771] bar-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Main Charts Row -->
            <div class="grid grid-cols-1 xl:grid-cols-12 gap-4">
                <!-- Force Directed Graph -->
                <div class="xl:col-span-8 terminal-card p-4">
                    <div
                        class="flex flex-col md:flex-row items-start md:items-center justify-between mb-4 border-b border-[#333] pb-2 gap-2">
                        <div>
                            <h2 id="chart-title" class="text-lg font-bold text-white flex items-center gap-2">SECTOR
                                CONSTELLATION <span class="w-2 h-2 rounded-full bg-[#c586c0] animate-pulse"></span></h2>
                            <p id="chart-subtitle" class="text-xs text-[#8b949e]">SPATIAL VISUALIZATION</p>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto">
                            <div class="flex gap-1 overflow-x-auto flex-1 md:flex-none">
                                <button onclick="switchConstellation('overall')" id="const-overall"
                                    class="const-tab px-3 py-1 text-[10px] font-bold bg-[#c586c0] text-black whitespace-nowrap flex-1 md:flex-none text-center">OVERALL</button>
                                <button onclick="switchConstellation('st')" id="const-st"
                                    class="const-tab px-3 py-1 text-[10px] font-bold bg-[#1a1a1a] text-[#8b949e] hover:text-white whitespace-nowrap flex-1 md:flex-none text-center">SHORT
                                    TERM</button>
                                <button onclick="switchConstellation('it')" id="const-it"
                                    class="const-tab px-3 py-1 text-[10px] font-bold bg-[#1a1a1a] text-[#8b949e] hover:text-white whitespace-nowrap flex-1 md:flex-none text-center">INTERM
                                    TERM</button>
                            </div>
                            <button onclick="toggleChartFullscreen()"
                                class="p-1 text-[#8b949e] hover:text-[#c586c0] border border-[#333] bg-[#1a1a1a]"
                                title="Maximize Chart">
                                <svg id="expand-icon" class="w-4 h-4" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4">
                                    </path>
                                </svg>
                                <svg id="compress-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="constellation-container" class="flex justify-center items-center py-4 relative">
                        <svg id="constellation-chart" width="600" height="600" viewBox="0 0 700 700"
                            class="w-full max-w-[600px] h-auto"></svg>
                    </div>
                </div>

                <div class="xl:col-span-4 space-y-4">
                    <!-- Top Movers List -->
                    <div class="terminal-card p-4 h-[300px]">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-sm font-bold text-[#dcdcaa]">TOP MOVERS</h3>
                            <div class="flex">
                                <button onclick="switchMovers('bulls')" id="movers-bulls"
                                    class="px-2 py-0.5 text-[10px] font-bold bg-[#1a1a1a] text-[#b5cea8] border border-[#333]">BULLS</button>
                                <button onclick="switchMovers('bears')" id="movers-bears"
                                    class="px-2 py-0.5 text-[10px] font-bold bg-[#1a1a1a] text-[#8b949e] border border-[#333]">BEARS</button>
                            </div>
                        </div>
                        <div id="movers-list" class="space-y-2 h-[220px] overflow-y-auto custom-scrollbar"></div>
                    </div>

                    <!-- Mean Reversion List -->
                    <div class="terminal-card p-4 h-[300px]">
                        <h3 class="text-sm font-bold text-white mb-4">MEAN REVERSION 🔄</h3>
                        <div id="meanrev-list" class="space-y-2 h-[220px] overflow-y-auto custom-scrollbar"></div>
                    </div>
                </div>
            </div>
            <!-- Momentum Grid -->
            <div class="terminal-card p-4">
                <div class="flex justify-between mb-4">
                    <h3 id="grid-title" class="text-sm font-bold text-white">MOMENTUM LEADERS</h3>
                    <span id="showing-count" class="text-xs text-[#8b949e] font-mono">LOADING...</span>
                </div>
                <div id="momentum-grid" class="flex gap-2 overflow-x-auto pb-2"></div>
            </div>
        </div>
    </div>

    <!-- Reusing existing script logic with modifications for sector filtering -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

        // Firebase Config
        const firebaseConfig = {

        // Global Ticker Config
        const allTickerConfig = [

            { ticker: "LLY", sector: "Health" }, { ticker: "UNH", sector: "Health" }, { ticker: "JNJ", sector: "Health" }, { ticker: "ABBV", sector: "Health" }, { ticker: "MRK", sector: "Health" }, { ticker: "PFE", sector: "Health" }, { ticker: "TMO", sector: "Health" }, { ticker: "ABT", sector: "Health" }, { ticker: "AMGN", sector: "Health" }, { ticker: "GILD", sector: "Health" }, { ticker: "VRTX", sector: "Health" }, { ticker: "BMY", sector: "Health" }, { ticker: "CVS", sector: "Health" }, { ticker: "CI", sector: "Health" }, { ticker: "ELV", sector: "Health" }, { ticker: "SYK", sector: "Health" }, { ticker: "MDT", sector: "Health" }, { ticker: "DHR", sector: "Health" }, { ticker: "BSX", sector: "Health" }, { ticker: "ISRG", sector: "Health" }, { ticker: "ZTS", sector: "Health" }, { ticker: "REGN", sector: "Health" }, { ticker: "HCA", sector: "Health" }, { ticker: "MCK", sector: "Health" }, { ticker: "BDX", sector: "Health" },
            { ticker: "XOM", sector: "Energy" }, { ticker: "CVX", sector: "Energy" }, { ticker: "COP", sector: "Energy" }, { ticker: "EOG", sector: "Energy" }, { ticker: "SLB", sector: "Energy" }, { ticker: "MPC", sector: "Energy" }, { ticker: "WMB", sector: "Energy" }, { ticker: "PSX", sector: "Energy" }, { ticker: "VST", sector: "Energy" }, { ticker: "CEG", sector: "Energy" },
            { ticker: "WMT", sector: "Consumer" }, { ticker: "COST", sector: "Consumer" }, { ticker: "HD", sector: "Consumer" }, { ticker: "PG", sector: "Consumer" }, { ticker: "KO", sector: "Consumer" }, { ticker: "PEP", sector: "Consumer" }, { ticker: "MCD", sector: "Consumer" }, { ticker: "NKE", sector: "Consumer" }, { ticker: "SBUX", sector: "Consumer" }, { ticker: "TJX", sector: "Consumer" }, { ticker: "LOW", sector: "Consumer" }, { ticker: "ORLY", sector: "Consumer" }, { ticker: "AZO", sector: "Consumer" }, { ticker: "MDLZ", sector: "Consumer" }, { ticker: "CL", sector: "Consumer" }, { ticker: "CMG", sector: "Consumer" }, { ticker: "MAR", sector: "Consumer" }, { ticker: "HLT", sector: "Consumer" }, { ticker: "RCL", sector: "Consumer" }, { ticker: "ABNB", sector: "Consumer" }, { ticker: "DIS", sector: "Consumer" }, { ticker: "NFLX", sector: "Consumer" }, { ticker: "BKNG", sector: "Consumer" },
            { ticker: "CAT", sector: "Industrial" }, { ticker: "DE", sector: "Industrial" }, { ticker: "UNP", sector: "Industrial" }, { ticker: "HON", sector: "Industrial" }, { ticker: "GE", sector: "Industrial" }, { ticker: "BA", sector: "Industrial" }, { ticker: "RTX", sector: "Industrial" }, { ticker: "LMT", sector: "Industrial" }, { ticker: "GD", sector: "Industrial" }, { ticker: "NOC", sector: "Industrial" }, { ticker: "MMM", sector: "Industrial" }, { ticker: "EMR", sector: "Industrial" }, { ticker: "ETN", sector: "Industrial" }, { ticker: "PH", sector: "Industrial" }, { ticker: "ITW", sector: "Industrial" }, { ticker: "CMI", sector: "Industrial" }, { ticker: "CSX", sector: "Industrial" }, { ticker: "NSC", sector: "Industrial" }, { ticker: "UPS", sector: "Industrial" }, { ticker: "FAST", sector: "Industrial" }, { ticker: "URI", sector: "Industrial" }, { ticker: "PWR", sector: "Industrial" }, { ticker: "CTAS", sector: "Industrial" }, { ticker: "TDG", sector: "Industrial" }, { ticker: "HWM", sector: "Industrial" }, { ticker: "AXON", sector: "Industrial" }, { ticker: "JCI", sector: "Industrial" }, { ticker: "TT", sector: "Industrial" }, { ticker: "MSI", sector: "Industrial" }, { ticker: "ROP", sector: "Industrial" },
            { ticker: "NEE", sector: "Utilities" }, { ticker: "DUK", sector: "Utilities" }, { ticker: "SO", sector: "Utilities" }, { ticker: "AEP", sector: "Utilities" }, { ticker: "SRE", sector: "Utilities" }, { ticker: "PLD", sector: "Utilities" }, { ticker: "AMT", sector: "Utilities" }, { ticker: "EQIX", sector: "Utilities" }, { ticker: "WELL", sector: "Utilities" }, { ticker: "SPG", sector: "Utilities" }, { ticker: "O", sector: "Utilities" },
            { ticker: "T", sector: "Other" }, { ticker: "VZ", sector: "Other" }, { ticker: "TMUS", sector: "Other" }, { ticker: "UBER", sector: "Other" }, { ticker: "DASH", sector: "Other" }, { ticker: "INTU", sector: "Other" }, { ticker: "ADSK", sector: "Other" }, { ticker: "ACN", sector: "Other" }, { ticker: "ADP", sector: "Other" }, { ticker: "APH", sector: "Other" }, { ticker: "TEL", sector: "Other" }, { ticker: "APD", sector: "Other" }, { ticker: "ECL", sector: "Other" }, { ticker: "SHW", sector: "Other" }, { ticker: "LIN", sector: "Other" }, { ticker: "FCX", sector: "Other" }, { ticker: "NEM", sector: "Other" }, { ticker: "CB", sector: "Other" }, { ticker: "PGR", sector: "Other" }, { ticker: "WM", sector: "Other" }, { ticker: "GM", sector: "Other" }, { ticker: "PM", sector: "Other" }, { ticker: "MO", sector: "Other" }
        ];

        // Parse URL Param
        const urlParams = new URLSearchParams(window.location.search);
        // Normalize: if user passes "tech", allow case-insensitive match by finding proper casing
        const rawSector = urlParams.get('sector') || 'Tech';

        // Find matching sector properly cased from config
        const foundSector = [...new Set(allTickerConfig.map(t => t.sector))].find(s => s.toLowerCase() === rawSector.toLowerCase()) || 'Tech';

        // FILTER TICKER CONFIG
        const tickerConfig = allTickerConfig.filter(t => t.sector === foundSector);

        // Update Headers
        document.title = `Caltropia | ${foundSector}`;
        document.getElementById('sector-title-header').textContent = foundSector;
        document.getElementById('chart-title').innerHTML = `${foundSector.toUpperCase()} CONSTELLATION <span class="w-2 h-2 rounded-full bg-[#c586c0] animate-pulse"></span>`;

        // Filtered State
        let assetsData = [];
        let filteredData = [];
        let currentFilter = 'all';
        let currentSort = 'score';
        let currentConstellation = 'overall';
        let currentMovers = 'bulls';

        async function loadData() {
            const results = await Promise.all(tickerConfig.map(async config => {
                try {
                    const snapshot = await get(ref(db, "equities/" + config.ticker));
                    const data = snapshot.val();
                    if (data) {
                        const p = v => parseFloat(v) || 0;
                        const stTrend = p(data.shortTermTrend) + p(data.shortTermStrength);
                        const itTrend = p(data.intermTrend) + p(data.intermStrength);
                        const meanReversion = p(data.meanReversion);
                        const breakout = p(data.breakoutAndDown);
                        return {
                            ticker: config.ticker, sector: config.sector,
                            overallScore: stTrend + itTrend + meanReversion + breakout,
                            stTrend, itTrend, meanReversion, breakout
                        };
                    }
                } catch (e) { }
                return null;
            }));
            assetsData = results.filter(r => r);
            filteredData = [...assetsData];
            document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();

            // Refresh UI
            setFilter('all');
        }

        window.loadData = loadData;

        // Render Functions 
        function renderAll() {
            // Filter
            let data = [...assetsData];

            if (document.getElementById('search-input').value) {
                const s = document.getElementById('search-input').value.toLowerCase();
                data = data.filter(d => d.ticker.toLowerCase().includes(s));
            }

            if (currentFilter === 'bullish') data = data.filter(d => d.overallScore > 0);
            if (currentFilter === 'bearish') data = data.filter(d => d.overallScore < 0);

            // Sort
            data.sort((a, b) => {
                if (currentSort === 'score') return Math.abs(b.overallScore) - Math.abs(a.overallScore);
                if (currentSort === 'alpha') return a.ticker.localeCompare(b.ticker);
                return 0;
            });

            filteredData = data;

            // Draw
            drawConstellation();
            drawMovers();
            drawMeanRev();
            drawGrid();
            updateMetrics();
        }

        // D3 Constellation
        function drawConstellation() {
            const svg = d3.select("#constellation-chart");
            svg.selectAll("*").remove();

            const width = 600, height = 600;
            const nodes = processedNodes(filteredData);

            // Force Simulation
            const simulation = d3.forceSimulation(nodes)
                .force("charge", d3.forceManyBody().strength(-200)) // Stronger repulsion for clearer sector view
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(30))
                .force("radial", d3.forceRadial(d => {
                    // Mapping: High Score (Abs) -> Center (Radius 0)
                    // Max Score ~10 -> 0
                    // Min Score 0 -> 250 (Edge)
                    const maxScore = 10;
                    const normalized = Math.min(Math.abs(d.score), maxScore) / maxScore;
                    // Invert: 1 (High Score) -> 0 (Center)
                    return (1 - normalized) * 250;
                }, width / 2, height / 2).strength(0.8));

            const g = svg.append("g");

            // Draw Links (Optional - connects nodes?) - skipping for simplicity in detail view, just showing nodes
            // Or maybe links based on correlation? Stick to radial style: no links, just spatial

            const node = g.append("g")
                .selectAll("g")
                .data(nodes)
                .join("g")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended))
                .on("click", (e, d) => window.openAssetDetail(d.ticker))
                .on("mouseover", (e, d) => window.showTooltip(e, d.ticker, d.sector, d.score.toFixed(1)))
                .on("mouseout", window.hideTooltip);

            // Circles
            node.append("circle")
                .attr("r", d => 15 + Math.abs(d.score)) // Size by score
                .attr("fill", d => getScoreColor(d.score))
                .attr("stroke", "#0d1117")
                .attr("stroke-width", 2);

            // Text
            node.append("text")
                .text(d => `${d.ticker} (${d.score.toFixed(1)})`)
                .attr("dy", 4)
                .attr("text-anchor", "middle")
                .attr("fill", "#fff")
                .attr("font-size", "10px")
                .attr("font-weight", "bold")
                .style("text-shadow", "0px 1px 4px rgba(0,0,0,0.8)");

            simulation.on("tick", () => {
                // Bounding Box Logic
                nodes.forEach(d => {
                    const r = 20 + Math.abs(d.score);
                    d.x = Math.max(r, Math.min(width - r, d.x));
                    d.y = Math.max(r, Math.min(height - r, d.y));
                });
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        }

        function processedNodes(data) {
            return data.map(d => {
                let score = d.overallScore;
                if (currentConstellation === 'st') score = d.stTrend;
                if (currentConstellation === 'it') score = d.itTrend;
                return { ...d, score };
            });
        }

        // Top Movers List
        function drawMovers() {
            const container = document.getElementById('movers-list');
            let sorted = [...filteredData];
            if (currentMovers === 'bulls') sorted.sort((a, b) => b.overallScore - a.overallScore);
            else sorted.sort((a, b) => a.overallScore - b.overallScore); // Bearish sort (lowest first)

            container.innerHTML = sorted.map(d => `
                <div class="flex justify-between items-center p-2 rounded bg-[#21262d] hover:bg-[#30363d] cursor-pointer border border-transparent hover:border-[#c586c0]" onclick="openAssetDetail('${d.ticker}')">
                     <div class="flex items-center gap-2">
                         <div class="w-8 font-bold text-white">${d.ticker}</div>
                         <div class="w-1 h-4 ${d.overallScore > 0 ? 'bg-[#b5cea8]' : 'bg-[#f48771]'}"></div>
                     </div>
                     <div class="font-mono text-white ${d.overallScore > 0 ? 'text-[#b5cea8]' : 'text-[#f48771]'}">${d.overallScore.toFixed(1)}</div>
                </div>
            `).join('');
        }

        // Mean Reversion List
        function drawMeanRev() {
            const container = document.getElementById('meanrev-list');
            // Filter non-zero mean reversion items and sort by abs magnitude
            let data = filteredData.filter(d => d.meanReversion !== 0);
            data.sort((a, b) => Math.abs(b.meanReversion) - Math.abs(a.meanReversion));

            if (data.length === 0) {
                container.innerHTML = '<div class="text-[#8b949e] text-xs text-center p-4">NO ACTIVE SIGNALS</div>';
                return;
            }

            container.innerHTML = data.map(d => `
                 <div class="flex justify-between items-center p-2 rounded bg-[#21262d] hover:bg-[#30363d] cursor-pointer border border-transparent hover:border-[#39c5cf]" onclick="openAssetDetail('${d.ticker}')">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-white">${d.ticker}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs ${d.meanReversion > 0 ? 'text-[#b5cea8]' : 'text-[#f48771]'}">${d.meanReversion > 0 ? 'POSITIVE' : 'NEGATIVE'}</span>
                        <span class="font-mono font-bold text-white">${d.meanReversion.toFixed(2)}</span>
                    </div>
                 </div>
            `).join('');
        }

        // Momentum Grid (Bottom)
        function drawGrid() {
            const container = document.getElementById('momentum-grid');
            document.getElementById('showing-count').textContent = `SHOWING ${filteredData.length}`;
            container.innerHTML = filteredData.map(d => `
                 <div class="min-w-[100px] p-2 bg-[#21262d] rounded border border-[#30363d] hover:border-[#c586c0] cursor-pointer" onclick="openAssetDetail('${d.ticker}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-white text-xs">${d.ticker}</span>
                        <span class="text-[10px] text-[#8b949e]">${d.sector.substring(0, 3).toUpperCase()}</span>
                    </div>
                    <div class="text-lg font-bold ${d.overallScore > 0 ? 'text-[#b5cea8]' : 'text-[#f48771]'}">${d.overallScore.toFixed(1)}</div>
                 </div>
             `).join('');
        }

        function updateMetrics() {
            const total = assetsData.length;
            const bulls = assetsData.filter(d => d.overallScore > 0).length;
            const bears = assetsData.filter(d => d.overallScore < 0).length;
            const neutral = total - bulls - bears;

            document.getElementById('total-assets').textContent = total;

            document.getElementById('bullish-count').textContent = bulls;
            const bullPct = total ? Math.round((bulls / total) * 100) : 0;
            document.getElementById('bullish-pct').textContent = `${bullPct}%`;
            document.getElementById('bullish-bar').style.width = `${bullPct}%`;

            document.getElementById('bearish-count').textContent = bears;
            const bearPct = total ? Math.round((bears / total) * 100) : 0;
            document.getElementById('bearish-pct').textContent = `${bearPct}%`;
            document.getElementById('bearish-bar').style.width = `${bearPct}%`;

            document.getElementById('neutral-count').textContent = neutral;
            const neutPct = total ? Math.round((neutral / total) * 100) : 0;
            document.getElementById('neutral-pct').textContent = `${neutPct}%`;
            document.getElementById('neutral-bar').style.width = `${neutPct}%`;
        }

        // --- Styles & Helpers ---
        function getScoreColor(score) {
            if (score >= 5) return "#b5cea8";
            if (score > 0) return "#9cdcfe";
            if (score <= -5) return "#f48771";
            if (score < 0) return "#c586c0";
            return "#666666";
        }

        // Window Helpers specific to this page
        window.setFilter = function (f) {
            currentFilter = f;
            document.querySelectorAll('.filter-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.filter === f);
                c.classList.toggle('bg-[#1a1a1a]', c.dataset.filter !== f);
            });
            renderAll();
        }
        window.setSort = function (s) {
            currentSort = s;
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === s));
            renderAll();
        }
        window.handleSearch = function (val) { renderAll(); };
        window.toggleChartFullscreen = function () { // ... same logic ...
            const card = document.querySelector('.xl\\:col-span-8.terminal-card');
            card.classList.toggle('chart-fullscreen');
            if (card.classList.contains('chart-fullscreen')) document.body.style.overflow = 'hidden';
            else document.body.style.overflow = '';
        }
        window.switchConstellation = function (type) {
            currentConstellation = type;
            document.querySelectorAll('.const-tab').forEach(t => {
                const isActive = t.id === `const-${type}`;
                t.classList.toggle('bg-[#c586c0]', isActive);
                t.classList.toggle('text-black', isActive);
            });
            drawConstellation();
        };
        window.switchMovers = function (type) {
            currentMovers = type;
            // Update buttons
            const bulls = document.getElementById('movers-bulls');
            const bears = document.getElementById('movers-bears');
            if (type === 'bulls') {
                bulls.classList.add('text-[#b5cea8]', 'border-[#333]'); bulls.classList.remove('text-[#8b949e]');
                bears.classList.add('text-[#8b949e]'); bears.classList.remove('text-[#f48771]');
            } else {
                bears.classList.add('text-[#f48771]', 'border-[#333]'); bears.classList.remove('text-[#8b949e]');
                bulls.classList.add('text-[#8b949e]'); bulls.classList.remove('text-[#b5cea8]');
            }
            drawMovers();
        };

        window.showTooltip = function (e, ticker, sector, score) {
            const el = document.getElementById('tooltip');
            el.innerHTML = `<div class="font-bold text-[#c586c0]">${ticker}</div><div class="text-xs text-white">${sector}</div><div class="text-xs mt-1">Score: ${score}</div>`;
            el.style.left = (e.clientX + 10) + 'px';
            el.style.top = (e.clientY + 10) + 'px';
            el.classList.add('show');
        };
        window.hideTooltip = function () { document.getElementById('tooltip').classList.remove('show'); };
        window.openAssetDetail = function (ticker) {
            const asset = assetsData.find(a => a.ticker === ticker);
            if (!asset) return;
            const el = document.getElementById('detail-content');
            const color = asset.overallScore > 0 ? '#b5cea8' : '#f48771';
            el.innerHTML = `
                <div class="mb-2">
                    <div class="text-3xl font-bold text-[#c586c0]">${asset.ticker}</div>
                    <div class="text-xs text-[#8b949e] font-mono">${asset.sector.toUpperCase()}</div>
                </div>
                <div class="text-4xl font-bold mb-4" style="color:${color}">${asset.overallScore}</div>
                 <div class="grid grid-cols-2 gap-4 text-sm">
                    <div class="terminal-card p-3">
                        <div class="text-[#8b949e]">ST TREND</div>
                        <div class="font-bold text-white">${asset.stTrend}</div>
                    </div>
                    <div class="terminal-card p-3">
                        <div class="text-[#8b949e]">IT TREND</div>
                        <div class="font-bold text-white">${asset.itTrend}</div>
                    </div>
                </div>`;
            document.getElementById('detail-panel').classList.add('open');
            document.getElementById('detail-overlay').classList.add('show');
        }
        window.closeDetailPanel = function () {
            document.getElementById('detail-panel').classList.remove('open');
            document.getElementById('detail-overlay').classList.remove('show');
        };
        window.showMetricDetail = function (type) {
            if (type === 'total') setFilter('all');
            else setFilter(type);
        };
        window.refreshData = function () {
            document.getElementById('last-updated').textContent = "SYNCING...";
            loadData();
        };

        onAuthStateChanged(auth, () => loadData());

    </script>
